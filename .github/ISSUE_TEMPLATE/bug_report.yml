name: Bug Report
description: Something isn't working as expected
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

        **Before you start, two quick checks that solve many problems:**
        1. Paste your card YAML into **[Check Your Config](https://lcards.unimatrix01.ca/getting-started/config-checker)**. It finds misspelt options and names (`colour` for `color`, a preset that doesn't exist) in a few seconds.
        2. Run the health check in Home Assistant: **LCARdS** sidebar panel → **Welcome** → **Support & system info**. It spots a stale browser cache, card-mod still installed, and more.

        **Fastest way to report:** in that same section, **Report an issue** opens this form with your versions and system info already filled in.

        Then describe the problem, the steps to reproduce, and your card YAML below.

  - type: checkboxes
    id: checks
    attributes:
      label: Quick checks
      description: Not required, but they save everyone time.
      options:
        - label: "My YAML passes [Check Your Config](https://lcards.unimatrix01.ca/getting-started/config-checker) (or I've noted what it reports below)."
        - label: "I ran the health check in the LCARdS panel (Welcome → Support & system info)."

  - type: dropdown
    id: card_type
    attributes:
      label: Affected Card Type
      description: Which LCARdS card is exhibiting the problem?
      multiple: true
      options:
        - lcards-button
        - lcards-chart
        - lcards-data-grid
        - lcards-elbow
        - lcards-layout-card
        - lcards-msd
        - lcards-select-menu
        - lcards-slider
        - lcards-alert-overlay
        - Multiple / All cards
        - Not card-specific (core system)
    validations:
      required: true

  - type: input
    id: lcards_version
    attributes:
      label: LCARdS Version
      description: Filled in automatically by **Report an issue**. Otherwise see the version in the LCARdS panel header, or run `window.lcards.version` in the browser console.
      placeholder: "e.g. 2026.10.0"
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Version
      description: Filled in automatically by **Report an issue**. Otherwise Settings → About → Version.
      placeholder: "e.g. 2026.10.1"
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: LCARdS support info
      description: >-
        Filled in automatically by **Report an issue**. Otherwise open the LCARdS panel → Welcome →
        Support & system info → **Copy support info** and paste it here (or run
        `await window.lcards.support.copy()` in the browser console). Review it before submitting:
        it holds versions, environment details and recent LCARdS warnings (which may mention
        entity names); data-source entity IDs are only included if you opted in.
      placeholder: Paste the copied support info here
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Optional (already included in the support info).
      options:
        - Chrome / Chromium
        - Firefox
        - Safari
        - Edge
        - Home Assistant Companion App (Android)
        - Home Assistant Companion App (iOS)
        - Other
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug. Include what you expected to happen vs. what actually happened.
      placeholder: |
        Expected: The button color updates when the entity turns on.
        Actual: The button stays the default color regardless of entity state.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Add an `lcards-button` card with the config below
        2. Turn on the linked entity
        3. Observe that the button color does not change
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Card YAML Configuration
      description: >-
        Paste your raw YAML config here (**no triple backticks**: it is formatted automatically).
        Remove any sensitive values (tokens, passwords, etc.).
      render: yaml
      placeholder: |
        type: custom:lcards-button
        entity: light.kitchen
        preset: lozenge
        text:
          label:
            content: Kitchen
            show: true
    validations:
      required: true

  - type: textarea
    id: console_errors
    attributes:
      label: Browser Console Output
      description: |
        Optional. Recent LCARdS warnings/errors are already in the support info. Paste anything else from the browser console (F12 → Console) that looks related, especially red errors.
      render: shell
      placeholder: Paste console output here

  - type: textarea
    id: additional_context
    attributes:
      label: Additional Context
      description: Screenshots, screen recordings, related issues, or anything else that might help.
