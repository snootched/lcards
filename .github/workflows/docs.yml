name: Docs

on:
  push:
    branches: ["main", "dev"]
    paths:
      - "doc/**"
      - "src/**"                   # live demos run the current card bundle
      - "scripts/**"               # docs build steps, validators, release pages
      - "tests/docs/**"
      - "tests/helpers/card-env.js"
      - "playwright.docs.config.js"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "doc/**"
      - "src/**"                   # live demos run the current card bundle
      - "scripts/**"               # docs build steps, validators, release pages
      - "tests/docs/**"
      - "tests/helpers/card-env.js"
      - "playwright.docs.config.js"
      - "vite.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages base URL
        uses: actions/configure-pages@v6

      - name: Build docs (dead links and #anchors fail the build)
        run: npm run docs:build

      # Live card demos, galleries, playgrounds and processor labs: a failure
      # stops the deploy below, so broken demos never go live.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Docs site tests
        run: npm run test:docs

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: doc/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
