name: Release

# Releases are triggered manually only.
# Run from Actions → Release → Run workflow on the desired branch.
#
# Branch determines release type (overridable via the prerelease input):
#   main  → stable release   (prerelease auto = false)
#   dev   → pre-release      (prerelease auto = true)
#   other → pre-release      (prerelease auto = true)
#
# Version is always read from package.json — the single source of truth.
#
# package.json versioning conventions:
#   2026.3.28          → stable release      → manifest 2026.3.28
#   2026.3.28-alpha.1  → pre-release dev     → manifest 2026.3.28   (suffix stripped)
#   2026.3.28.1        → same-day hotfix     → manifest 2026.3.28.1
#   2026.3.28.1-rc.1   → hotfix pre-release  → manifest 2026.3.28.1 (suffix stripped)
#
# NOTE: Use -alpha.* when the stable for that day hasn't shipped yet.
# Use .1/.2 increments when hotfixing an already-released stable.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Pre-release? (auto = detect from branch: main→stable, dev→pre-release)"
        required: false
        type: choice
        options:
          - auto
          - "true"
          - "false"
        default: auto

permissions:
  contents: write

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate-integration.yml
    permissions:
      contents: read

  release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: validate
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for tag creation and release notes

      # ── Node ─────────────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # ── Resolve version ────────────────────────────────────────────────────
      # Version is always read from package.json on the checked-out branch.
      # A tag is created and pushed so the GitHub release has a proper ref.
      - name: Resolve version
        id: version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "📌 package.json version: ${VERSION}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only create tag if it doesn't already exist
          if git rev-parse "${VERSION}" >/dev/null 2>&1; then
            echo "🏷️  Tag ${VERSION} already exists — skipping creation"
          else
            git tag "${VERSION}"
            git push origin "${VERSION}"
            echo "🏷️  Created tag ${VERSION}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # ── Resolve prerelease flag ────────────────────────────────────────────
      # Priority: explicit input > version suffix (-alpha/-beta/-rc) > branch name
      - name: Resolve prerelease
        id: prerelease
        run: |
          INPUT="${{ inputs.prerelease }}"
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH="${{ github.ref_name }}"

          if [ "$INPUT" = "true" ] || [ "$INPUT" = "false" ]; then
            IS_PRERELEASE="$INPUT"
            echo "📌 Pre-release: ${IS_PRERELEASE} (explicit input)"
          elif echo "$VERSION" | grep -q -- '-'; then
            IS_PRERELEASE="true"
            echo "📌 Pre-release: true (version suffix detected in ${VERSION})"
          elif [ "$BRANCH" = "main" ]; then
            IS_PRERELEASE="false"
            echo "📌 Pre-release: false (branch=main)"
          else
            IS_PRERELEASE="true"
            echo "📌 Pre-release: true (branch=${BRANCH} is not main)"
          fi
          echo "is_prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT

      # ── Stamp version ─────────────────────────────────────────────────────
      # manifest.json requires HA CalVer: no leading zeros, no pre-release suffix.
      # A 4th integer segment is preserved for same-day patch releases.
      # const.py stores the full version string (including any suffix) for display.
      #
      # Examples:
      #   2026.03.27          → manifest 2026.3.27   (normal release)
      #   2026.03.27.1        → manifest 2026.3.27.1 (same-day patch)
      #   2026.03.27-alpha.1  → manifest 2026.3.27   (pre-release; suffix stripped)
      #   2026.03.27.1-rc.1   → manifest 2026.3.27.1 (pre-release patch; suffix stripped)
      - name: Stamp version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "📌 Release version: ${VERSION}"

          # Strip any pre-release suffix (-alpha.1, -beta.2, -rc.1, etc.)
          CALVER="${VERSION%%-*}"
          # Read up to 4 segments: YYYY.MM.DD[.SEQ]
          IFS='.' read -r Y M D SEQ <<< "$CALVER"
          HA_VERSION="${Y}.$((10#$M)).$((10#$D))${SEQ:+.$SEQ}"
          echo "📌 HA manifest version: ${HA_VERSION}"

          # manifest.json — HA calver (no leading zeros, no suffix)
          jq --arg v "$HA_VERSION" '.version = $v' \
            custom_components/lcards/manifest.json > /tmp/manifest.json
          mv /tmp/manifest.json custom_components/lcards/manifest.json
          echo "  ✅ manifest.json → ${HA_VERSION}"

          # const.py — store full release tag for display/WS endpoint
          sed -i "s/^DOMAIN_VERSION = .*/DOMAIN_VERSION = \"${VERSION}\"/" \
            custom_components/lcards/const.py
          echo "  ✅ const.py       → ${VERSION}"

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build integration JS
        run: npm run build:integration
        # build:integration = vite build --mode integration && node scripts/copy-assets.js
        # This produces custom_components/lcards/lcards.js and copies
        # src/assets/{fonts,msd,sounds} into custom_components/lcards/

      - name: Verify build output
        run: |
          ERRORS=0
          if [ ! -f "custom_components/lcards/lcards.js" ]; then
            echo "❌ Build failed: custom_components/lcards/lcards.js missing"
            ERRORS=$((ERRORS + 1))
          else
            echo "✅ lcards.js — $(du -sh custom_components/lcards/lcards.js | cut -f1)"
          fi
          for DIR in fonts msd sounds; do
            if [ ! -d "custom_components/lcards/$DIR" ]; then
              echo "❌ Missing asset dir: custom_components/lcards/$DIR"
              ERRORS=$((ERRORS + 1))
            else
              echo "✅ assets/$DIR present"
            fi
          done
          [ $ERRORS -eq 0 ] || exit 1

      # ── Package ───────────────────────────────────────────────────────────────
      # Zip contents at root so HACS extracts them into custom_components/lcards/
      - name: Package integration
        run: |
          cd custom_components/lcards
          zip -r ../../lcards.zip . \
            --exclude "__pycache__/*" \
            --exclude "*.pyc"

          echo ""
          echo "📦 Package contents:"
          unzip -l ../../lcards.zip

      # ── Release ───────────────────────────────────────────────────────────────
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: lcards.zip
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          generate_release_notes: true
