name: Validate

# No push trigger on main: a change reaches main through a pull request from dev,
# which already ran this workflow on the same tree, and Release runs it again as
# its gate. The nightly run covers main between releases (see the changes job).
#
# Browser tests: a push to dev runs the ones its changes need (the
# test:browser:changed picker, against the last dev commit this workflow passed
# on); shared code runs them all. Pull requests (the release PR included), the
# Release gate, manual runs and a nightly run with new commits run them all.
# Either way they are split over 4 runners (Playwright shards).
on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  workflow_call:  # allow release.yml (and others) to call this as a gate

# Checkout and tests only: the token needs no write access (CodeQL actions/missing-workflow-permissions)
permissions:
  contents: read

# A newer push to the same pull request or to dev cancels the older run. Manual and
# scheduled runs and the Release gate (workflow_call: github.workflow is then
# "Release", its own group) always finish.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  # The nightly schedule exists for HACS (its checks want this workflow passing),
  # so Hassfest and HACS always run. Everything else runs nightly only when main
  # has moved since the last scheduled run; every other trigger runs it all.
  changes:
    name: What to run
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
      browser: ${{ steps.browser.outputs.browser }}
      grep: ${{ steps.browser.outputs.grep }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          LAST=$(gh api "repos/${{ github.repository }}/actions/workflows/validate-integration.yml/runs?event=schedule&status=completed&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')
          if [ "$LAST" = "${{ github.sha }}" ]; then
            echo "::notice::No new commits since the last nightly run ($LAST): HACS and Hassfest only."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "📌 main moved (${LAST:-none} to ${{ github.sha }}): full run."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # Which browser tests. On a dev push: what changed since the last dev commit this
      # workflow passed on (not just the previous push: a newer push cancels an older
      # run, whose changes must still be tested). No such commit: all of them.
      - id: browser
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.check.outputs.run }}" != "true" ]; then
            echo "browser=none" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "browser=all" >> "$GITHUB_OUTPUT"; exit 0
          fi
          BASE=$(gh api "repos/${{ github.repository }}/actions/workflows/validate-integration.yml/runs?branch=dev&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // ""')
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "::notice::No passed dev run to compare with: every browser test."
            echo "browser=all" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "📌 browser tests for the changes since ${BASE}"
          node scripts/test-browser-changed.mjs --base "$BASE" --github-output

  validate-hassfest:
    name: Hassfest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  validate-hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: "integration"

  validate-css-vars:
    name: Validate CSS Variables
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run CSS variable validator
        run: npm run validate:css-vars

  validate-doc-examples:
    name: Validate Documentation Examples
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run documentation YAML validator
        run: npm run validate:doc-examples:strict

      - name: Schema description check
        run: npm run validate:schema-descriptions

      - name: Docs em-dash check
        run: node scripts/check-doc-em-dashes.js

      # The docs site build, its #anchor check and the live-demo tests run in the
      # Docs workflow (before it deploys), not here.

  test:
    name: Tests and Typecheck
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Typecheck (zero TypeScript errors)
        run: npm run typecheck

  browser:
    name: Browser tests (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.browser != 'none'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Browser component tests run against the built bundle. Visual baselines
      # (test:visual) and real-HA tests (test:ha) stay local-only.
      - name: Build bundle for browser tests
        run: npm run build:integration

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser component tests (${{ needs.changes.outputs.browser }})
        env:
          GREP: ${{ needs.changes.outputs.grep }}
        run: |
          if [ "${{ needs.changes.outputs.browser }}" = "all" ]; then
            npx playwright test --project=component --shard=${{ matrix.shard }}/4 --pass-with-no-tests
          else
            npx playwright test --project=component --grep "$GREP" --shard=${{ matrix.shard }}/4 --pass-with-no-tests
          fi

  validate-build:
    name: Validate Build
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    needs:
      - changes
      - test
      - validate-css-vars
      - validate-version
      - validate-structure
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build:integration

      - name: Check build output
        run: |
          ERRORS=0
          if [ ! -f "custom_components/lcards/lcards.js" ]; then
            echo "❌ Build failed: custom_components/lcards/lcards.js not found"
            ERRORS=$((ERRORS + 1))
          else
            echo "✅ lcards.js — $(du -sh custom_components/lcards/lcards.js | cut -f1)"
          fi
          # lcards.js is a loader stub; the bundle itself is chunks/lcards-main-*.js
          if ! ls custom_components/lcards/chunks/lcards-main-*.js >/dev/null 2>&1; then
            echo "❌ Missing main chunk: custom_components/lcards/chunks/lcards-main-*.js"
            ERRORS=$((ERRORS + 1))
          fi
          # Pre-compressed siblings served by HA when the browser accepts them
          for EXT in br gz; do
            if [ ! -f "custom_components/lcards/lcards.js.$EXT" ]; then
              echo "❌ Missing custom_components/lcards/lcards.js.$EXT"
              ERRORS=$((ERRORS + 1))
            else
              echo "✅ lcards.js.$EXT: $(du -sh custom_components/lcards/lcards.js.$EXT | cut -f1)"
            fi
          done
          for DIR in fonts msd sounds; do
            if [ ! -d "custom_components/lcards/$DIR" ]; then
              echo "❌ Missing asset dir: custom_components/lcards/$DIR"
              ERRORS=$((ERRORS + 1))
            else
              echo "✅ assets/$DIR present"
            fi
          done
          [ $ERRORS -eq 0 ] || exit 1

  validate-version:
    name: Validate Version Format
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check version format
        run: |
          # Format: YYYY.MM.SEQ[-suffix]
          # e.g. 2026.08.0  2026.08.1  2026.08.1-dev.1
          VERSION=$(jq -r '.version' package.json)
          echo "package.json version: $VERSION"

          if ! [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+(-[a-zA-Z][a-zA-Z0-9]*(\.[0-9]+)?)?$ ]]; then
            echo "❌ Version must follow format YYYY.MM.SEQ with optional pre-release suffix"
            echo "   Examples: 2026.08.0  2026.08.1  2026.08.1-dev.1"
            exit 1
          fi

          echo "✅ Version format is valid: $VERSION"

  validate-structure:
    name: Validate Project Structure
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check required files
        run: |
          ERRORS=0

          # Check critical files
          FILES=(
            "package.json"
            "hacs.json"
            "README.md"
            "LICENSE"
            "src/lcards.js"
            "src/lcards-main.js"
            "src/assets"
            "custom_components/lcards/__init__.py"
            "custom_components/lcards/manifest.json"
            "custom_components/lcards/config_flow.py"
            "custom_components/lcards/frontend.py"
            "custom_components/lcards/websocket_api.py"
            "custom_components/lcards/const.py"
          )

          for FILE in "${FILES[@]}"; do
            if [ ! -e "$FILE" ]; then
              echo "❌ Missing: $FILE"
              ERRORS=$((ERRORS + 1))
            else
              echo "✅ Found: $FILE"
            fi
          done

          if [ $ERRORS -gt 0 ]; then
            echo "❌ $ERRORS required file(s) missing"
            exit 1
          fi

          echo "✅ All required files present"
