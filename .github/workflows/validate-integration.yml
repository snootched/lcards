name: Validate

on:
  push:
    branches: [ "main", "dev", "develop" ]
  pull_request:
    branches: [ "main", "dev", "develop" ]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  workflow_call:  # allow release.yml (and others) to call this as a gate

jobs:
  validate-hassfest:
    name: Hassfest Validation
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  validate-hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: "integration"

  validate-css-vars:
    name: Validate CSS Variables
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run CSS variable validator
        run: npm run validate:css-vars

  validate-build:
    name: Validate Build
    runs-on: ubuntu-latest
    needs:
      - validate-css-vars
      - validate-version
      - validate-structure
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build:integration

      - name: Check build output
        run: |
          ERRORS=0
          if [ ! -f "custom_components/lcards/lcards.js" ]; then
            echo "❌ Build failed: custom_components/lcards/lcards.js not found"
            ERRORS=$((ERRORS + 1))
          else
            echo "✅ lcards.js — $(du -sh custom_components/lcards/lcards.js | cut -f1)"
          fi
          for DIR in fonts msd sounds; do
            if [ ! -d "custom_components/lcards/$DIR" ]; then
              echo "❌ Missing asset dir: custom_components/lcards/$DIR"
              ERRORS=$((ERRORS + 1))
            else
              echo "✅ assets/$DIR present"
            fi
          done
          [ $ERRORS -eq 0 ] || exit 1

  validate-version:
    name: Validate Version Format
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check version format
        run: |
          # Format: YYYY.MM.SEQ[-suffix]
          # e.g. 2026.08.0  2026.08.1  2026.08.1-dev.1
          VERSION=$(jq -r '.version' package.json)
          echo "package.json version: $VERSION"

          if ! [[ "$VERSION" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+(-[a-zA-Z][a-zA-Z0-9]*(\.[0-9]+)?)?$ ]]; then
            echo "❌ Version must follow format YYYY.MM.SEQ with optional pre-release suffix"
            echo "   Examples: 2026.08.0  2026.08.1  2026.08.1-dev.1"
            exit 1
          fi

          echo "✅ Version format is valid: $VERSION"

  validate-structure:
    name: Validate Project Structure
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          ERRORS=0

          # Check critical files
          FILES=(
            "package.json"
            "hacs.json"
            "README.md"
            "LICENSE"
            "src/lcards.js"
            "src/assets"
            "custom_components/lcards/__init__.py"
            "custom_components/lcards/manifest.json"
            "custom_components/lcards/config_flow.py"
            "custom_components/lcards/frontend.py"
            "custom_components/lcards/websocket_api.py"
            "custom_components/lcards/const.py"
          )

          for FILE in "${FILES[@]}"; do
            if [ ! -e "$FILE" ]; then
              echo "❌ Missing: $FILE"
              ERRORS=$((ERRORS + 1))
            else
              echo "✅ Found: $FILE"
            fi
          done

          if [ $ERRORS -gt 0 ]; then
            echo "❌ $ERRORS required file(s) missing"
            exit 1
          fi

          echo "✅ All required files present"
