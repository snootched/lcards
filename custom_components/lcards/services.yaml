# LCARdS HA service (action) descriptions.
# These appear in the HA Developer Tools → Actions panel and can be used
# in automations and scripts.
#
# Targeting fields (optional, present on every service; any combination is valid):
#
#   target_device_ids    — list of browser device UUIDs (lcards_device_id from
#                          each browser's localStorage).  Omit to target all.
#   target_device_names  — list of device display names (set in the LCARdS
#                          config panel or ?lcards_device= URL param).  Resolved
#                          to UUIDs server-side.  Non-unique names match all
#                          devices sharing that display name.
#   target_user_ids      — list of HA user IDs.  Omit to target all.
#   target_user_names    — list of HA user display names.  Resolved to user IDs
#                          server-side.  Case-insensitive.
#
# Broadcast behaviour (omit all four fields) is the default and is fully
# backward-compatible with existing automations.
#
# Alert services + targeting: the input_select helper is NOT written; the
# alert is applied as a local, transient state change on matching devices only.

set_alert_mode:
  name: Set Alert Mode
  description: >
    Set the LCARdS alert mode. Without targeting, requires
    input_select.lcards_alert_mode — create it from the Helpers tab in the
    LCARdS Config Panel. With targeting, the alert is applied locally on
    matching devices only (the global helper is not changed).
  fields:
    mode:
      name: Mode
      description: Alert mode to activate.
      required: true
      selector:
        select:
          options:
            - value: red_alert
              label: "🔴 Red Alert"
            - value: yellow_alert
              label: "🟡 Yellow Alert"
            - value: blue_alert
              label: "🔵 Blue Alert"
            - value: gray_alert
              label: "⚫ Gray Alert"
            - value: black_alert
              label: "⬛ Black Alert"
            - value: green_alert
              label: "🟢 Green (Normal)"
    target_device_ids:
      name: Target Device IDs
      description: >
        Limit to specific browser/device UUIDs (the lcards_device_id value
        stored in each browser's localStorage). Leave empty to target all
        devices. When set, the global input_select helper is NOT changed.
      required: false
      selector:
        text:
          multiple: true
    target_user_ids:
      name: Target User IDs
      description: >
        Limit to specific HA user IDs. Leave empty to target all users.
        When set, the global input_select helper is NOT changed.
      required: false
      selector:
        text:
          multiple: true
    target_device_names:
      name: Target Device Names
      description: >
        Limit to devices by their friendly display name (set in the LCARdS
        config panel or ?lcards_device= URL param). Resolved server-side.
        Non-unique names match all devices sharing that name.
        When set, the global input_select helper is NOT changed.
      required: false
      selector:
        text:
          multiple: true
    target_user_names:
      name: Target User Names
      description: >
        Limit to HA users by their display name. Resolved server-side.
        Case-insensitive. When set, the global input_select helper is NOT changed.
      required: false
      selector:
        text:
          multiple: true

