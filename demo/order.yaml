# The demo boards (npm run demo:push): the views in demo/views/, grouped by release,
# newest first. Every view file is listed exactly once (tests/docs/demo-dashboard.test.js).
# Per view: topic (one of topics below: the index groups the views by it), summary (index
# line), description (header text), session (dev board only), docs (a docs page path,
# optional) and public (also on the public board and the docs site's live demo; false for
# checks, benchmarks and comparisons).
# The header and the index are generated from this file (scripts/lib/demo-dashboard.js).
title: LCARdS Demo
# The index's blocks, in this order
topics:
  - { id: astrometrics, title: Astrometrics }
  - { id: charts, title: Charts }
  - { id: data-grid, title: Data grid }
  - { id: webgl, title: WebGL backgrounds }
  - { id: grids, title: Grids }
  - { id: alerts, title: Alerts and animation }
  - { id: cards, title: Cards }
  - { id: benchmarks, title: Benchmarks }
releases:
  - version: "2026.11.0"
    views:
      - file: astro-showcase
        topic: astrometrics
        summary: "Astrometrics showcase: the Star Trek galaxy down to Deep Space 9"
        description: "Every astrometrics feature in one card, in an LCARS frame. The stops on the left fly from the galaxy (the quadrants and the powers) to Federation space, the real Sol system on today's date (Spacedock at Earth, the Utopia Planitia yards over Mars, Jupiter, Saturn, Pluto), and on to the Bajor system: Deep Space 9 and its shields, the wormhole, a nebula to fly through and a Borg cube. Along the bottom: orbits and planet grids on or off, a Borg incursion, the shields, the wormhole's power, the date's rate, the alert status, the date itself, and the guided tour (PLAY TOUR steps through every stop)."
        session: "R4d"
        docs: /cards/astrometrics/
        public: true
      - file: astro-comet
        topic: astrometrics
        summary: "Astrometrics comet: tails away from its star"
        description: "type: comet: a dark nucleus, a glowing coma and two tails pointing away from its star (light): a straight blue ion tail and a pale dust tail that bends back along the comet's path. On an orbit centred off the star, with activity: distance it grows and brightens as it swings in and fades as it swings out. COMET flies to it. Second card: TAIL, COMA and GLOW follow sliders and ease in place."
        session: "AC1"
        docs: /cards/astrometrics/objects#comet
        public: true
      - file: astro-wormhole
        topic: astrometrics
        summary: "Astrometrics wormhole: its mouth and the regions inside it"
        description: "The Bajoran wormhole starter. Realistic look: a swirl of blue and violet gas pouring into the funnel round a warm rippled heart, a soft shaft of light and wisps trailing off. Diagram look: the entrance disc and funnel, the pipeline (three twisted strands drawn as lit tubes), the negative and positive CTL regions, the ring and point singularities and the verteron membrane. POWER opens the mouth and wobbles the regions; the look menu switches between them."
        session: "W1"
        docs: /cards/astrometrics/starters#bajoran-wormhole
        public: true
      - file: astro-asteroid
        topic: astrometrics
        summary: "Astrometrics asteroid: one rock up close"
        description: "type: asteroid: one rock with lumps and craters, tumbling, lit from its star (light: a point id). The star here goes round it, so day and night sweep across it. FAR shows it from thousands of units away, where it is a dot. Second card: three seeds and colours, all lit from one star."
        session: "AC1"
        docs: /cards/astrometrics/objects#asteroid
        public: true
      - file: astro-studio-forms
        topic: astrometrics
        summary: "Astrometrics Studio forms: a card to open in the Studio"
        description: "Open this card's editor, then its Studio. The scene is in light years with a star system in astronomical units, and number fields say so. The look is a switch, the stars sit behind a switch, the nebula's colours are a colour list and the labels pick a font. The route hides inside the system, the shield's opacity follows SHIELDS, and the camera's first view is a guided tour on STAGE."
        session: "UX1"
        docs: /cards/astrometrics/studio
        public: false
      - file: astro-studio-starters
        topic: astrometrics
        summary: "Astrometrics Studio starters: try a scene, keep it or undo it"
        description: "A new card with no scene. Open its editor, then its Studio: it opens on the Starters gallery. Open a starter to see what it adds and change its settings, try it in the preview, keep or discard it, and undo with Ctrl+Z or the toolbar."
        session: "UX1"
        docs: /cards/astrometrics/studio
        public: false
      - file: astro-studio-objects
        topic: astrometrics
        summary: "Astrometrics Studio objects: add by picture, parts into a system"
        description: "A galaxy in light years with Sol as a system in km. In the Studio: Add object is a gallery by group, shapes are picked by picture, the system row has Open, and with the system open Starters adds parts into it at real sizes."
        session: "UX1"
        docs: /cards/astrometrics/studio
        public: false
      - file: astro-real-size
        topic: astrometrics
        summary: "Astrometrics real size: starbases and ships in proportion"
        description: "Five built-in models with no size in a scene in km, so each is drawn at its real size from its file: Deep Space 9 (1.45 km) with a Constitution-class ship (289 m) beside it, Earth Spacedock (5.5 km tall) and a Utopia Planitia drydock (760 m) with a ship in its berth. The buttons fly to each. From ALL the ships are specks: the REAL SIZE button under the camera pad (or the V key) switches to VISIBLE SIZE, which draws each small model at least 40 px across, and back. In the Studio, a model's form says what its file measures and how it is drawn, with Show, Fit to view, File size and Real size and a Length (m) field for a download at an odd scale."
        session: "UX1"
        docs: /cards/astrometrics/objects#real-size
        public: true
      - file: astro-prism-outline
        topic: astrometrics
        summary: "Astrometrics prism outlines: edit a territory's border on the preview"
        description: "Two territories as prism volumes over a map. In the card's Studio, Objects, open a territory: its outline is a row per corner, and Edit on preview puts the corners on the map to drag (snapped to the map's 5, Shift for free), a + between corners adds one, Delete removes the selected one; Draw new outline taps a new border, closing on its first corner. Each change is one undo step."
        session: "UX1"
        docs: /cards/astrometrics/studio#objects
        public: true
      - file: chart-sources
        topic: charts
        summary: "Charts, rebuilt: entity history, long-term statistics and data sources"
        description: "The chart card was rebuilt for this release: every series is one entry of sources. Top left, entity history: move POWER and SHIELDS and the lines follow. Top right, an LCARdS data source smoothing the same power value beside its raw history. Below, a week of hourly means from Home Assistant's long-term statistics, and TOGGLE plotted as on/off steps."
        session: "R3"
        docs: /cards/chart/#where-the-data-comes-from
        public: true
      - file: chart-types
        topic: charts
        summary: "Chart types on the same four values"
        description: "Area, grouped columns, radial bars, donut, radar, polar area, treemap and heatmap, all drawn from the same four helpers. The round charts, the radar and the treemap show each series' latest value: drag a slider and they change at once; the time charts add the new value to their history."
        session: "R3"
        docs: /cards/chart/#chart-types
        public: true
      - file: chart-styling
        topic: charts
        summary: "Chart styling: gradients, reference lines, labels and formatters"
        description: "Drag SHIELDS across the Nominal and Critical reference lines. Below, a real temperature sensor: two days as a gradient area with its 30-minute peak and tooltip and axis formatters, a week of daily highs as labelled rounded columns from statistics, and three days as a low-to-high range band."
        session: "R3"
        docs: /cards/chart/styling
        public: true
      - file: datagrid-data
        topic: data-grid
        summary: "Data grid, rebuilt: live entity cells, colours and tap actions"
        description: "The data grid was rebuilt for this release: write rows of cells and each cell works out what it is (text, an entity, an attribute, a Home Assistant template, a JavaScript template or a data source value). Drag POWER, SHIELDS and TEMPERATURE: the readings change colour past their limits and pulse when they change; SHIELDS under 25 turns its cell red and the note to CRITICAL. Tap a LIGHTS or DOORS cell, or the buttons, to toggle it."
        session: "R3"
        docs: /cards/data-grid/data
        public: true
      - file: datagrid-decorative
        topic: data-grid
        summary: "Data grid decorative mode: the LCARS number wall"
        description: "Decorative mode makes up its values: hex with digit columns trickling in and pulsing, floats refreshing faster, and a mixed wall under the cascade animation. Nothing to control: no entities."
        session: "R3"
        docs: /cards/data-grid/#decorative-mode
        public: true
      - file: astro-navigation
        topic: astrometrics
        summary: "Astrometrics navigation: follow a moving ship, touchpad pan, a time slider, buttons that fade"
        description: "Tap ENTERPRISE, SHUTTLE or PROBE (the name or its marker): the camera flies to it and stays on it round its orbit, and the wheel or a pinch zooms straight in on it; a tap on blank space lets go (a pan or a fly forward keeps following, offset). On a touchpad a two-finger swipe pans and a pinch zooms; with a mouse the wheel zooms and a middle-drag pans. The LCARdS D-pad pans (arms), zooms (left corners), flies forward and back (right corners) and resets (centre); the slider under it slows the motion down, holds it or speeds it up. The buttons fade after a few seconds and come back when the pointer moves. The buttons fly to the system views, or to a ship and follow it. Click the scene and press W or S (Page Up, Page Down) to fly forward and back through it: camera and target move together."
        session: "N1"
        docs: /cards/astrometrics/#following-a-point
        public: true
      - file: astro-face
        topic: astrometrics
        summary: "Astrometrics face: motion: ships nose first along their orbits"
        description: "Two starships share a tilted patrol orbit: the one with face: motion flies nose first and tips with the tilt, the other slides along sideways. The small ship circles a planet that is itself on an orbit, so its heading follows both motions. Under reduced motion they hold still, facing along their orbits. The buttons fly to the views, or to a ship and follow it nose first."
        session: "M3"
        docs: /cards/astrometrics/objects#facing-the-way-it-goes
        public: true
      - file: astro-star-trek
        topic: astrometrics
        summary: "Astrometrics Star Trek galaxy: the quadrants, the powers, Federation space"
        description: "The Star Trek galaxy starter with its optional parts. The Milky Way cut into the four quadrants along the line from Sol to the core; the Federation, Klingon, Romulan and Cardassian regions, the Dominion and the Borg; the Bajoran wormhole to Idran, Voyager's route home and the Great Barrier. FEDERATION and SOL NEIGHBOURS fly in to the capitals and nearby stars: Vulcan, Andoria and Tellar at their real stars (40 Eridani, Procyon, 61 Cygni), the others at the distances the reference charts give. The galaxy view sizes the empires to be seen, so the two scales do not overlay exactly."
        session: "R4c2"
        docs: /cards/astrometrics/starters#star-trek-galaxy
        public: true
      - file: astro-galaxy
        topic: astrometrics
        summary: "Astrometrics galaxy: a procedural Milky Way, and a prism territory"
        description: "The galaxy object: the Milky Way built from its real structure (the central bar, the Scutum-Centaurus and Perseus arms from its ends, Sagittarius and Norma between them, the Orion spur), each star at its own place, so flying in shows parallax. SOL sits 26,000 light years out with a prism territory round it, a border drawn as any outline. Below, a generic two-arm galaxy with no bar, turning."
        session: "R4c1"
        docs: /cards/astrometrics/objects#galaxy
        public: true
      - file: astro-bindings
        topic: astrometrics
        summary: "Astrometrics settings from entities: shields, power and a guided tour"
        description: "Any number on a point or object can follow an entity. SHIELDS sets the shield bubble's opacity round the station (it eases to each new value). POWER opens the wormhole: its throat grows, its wobble follows a template, its glow brightens, the ring spins faster and debris gathers round it (a belt whose rock count follows the power, a whole number). PREVIOUS STOP and NEXT STOP step the stage helper, and the camera flies through four views; the last one holds the scene clock. STAGE goes back to the start."
        session: "R4b"
        docs: /cards/astrometrics/data#settings-from-entities
        public: true
      - file: astro-real-sol
        topic: astrometrics
        summary: "Astrometrics real Sol: the planets and moons where they are today"
        description: "The Solar system (real positions) starter: the Sun, the planets, Pluto, Ceres and the major moons in km where they really are at the scene date, on their real orbits, with real tilts and spins, Saturn's rings in its equator, and the main and Kuiper belts. The first row flies the camera; the second sets the scene date and its speed (NOW, a day, a month or a year a second, rewind, the Apollo 11 landing). The date slider on the card does the same, and its clock button switches to the speed slider."
        session: "R4a"
        docs: /cards/astrometrics/scale#the-real-solar-system
        public: true
      - file: astro-true-solar
        topic: astrometrics
        summary: "Astrometrics true-scale starter: the Sun and eight planets in km"
        description: "The Solar system at true scale starter as the Studio inserts it: every planet at its real distance and size, so from the whole system they are dots on their orbits. Tap EARTH, JUPITER or SATURN to fly in to it. The galaxy dive view now hides the galactic disc once you are inside the solar system. The buttons above a scene fly its camera to each of its named views."
        session: "E10"
        docs: /cards/astrometrics/scale
        public: true
      - file: astro-dive
        topic: astrometrics
        summary: "Astrometrics star systems: a galaxy in light years with Sol in km inside it"
        description: "One card from the galaxy down to a station: the galaxy disc in light years, the Sol system in km at its real place 26,000 ly from the core, and Deep Space 9 in orbit round Earth. Tap SOL, then EARTH, then DEEP SPACE 9, or fly from the station straight back out and in again. The buttons above a scene fly its camera to each of its named views."
        session: "E10"
        docs: /cards/astrometrics/scale#star-systems
        public: true
      - file: astro-true-scale
        topic: astrometrics
        summary: "Astrometrics at true scale: the Sun, Earth, the Moon and Deep Space 9 in km"
        description: "A scene built with real numbers: fly from the whole inner system (planets are dots at this scale) to Earth and to Deep Space 9, 1.5 km across, with Earth filling the sky behind it. Depth slices, scene-sized zoom limits and a log-distance fly-to make it hold. The buttons above a scene fly its camera to each of its named views."
        session: "E10"
        docs: /cards/astrometrics/scale#one-scene-in-real-units
        public: true
      - file: astro-distance
        topic: astrometrics
        summary: "Astrometrics distance: objects that appear as you zoom in"
        description: "min_distance and max_distance on objects: zoom in and a galaxy sector gives way to a star system, then the Earth's Moon; Deep Space 9 is a starbase marker far away and its model close up; a ship marker hands over to the ship's model, and the asteroid belt's rocks are dots from far away. The buttons above a scene fly its camera to each of its named views."
        session: "E9"
        docs: /cards/astrometrics/objects#distance
        public: true
      - file: astro-cube
        topic: astrometrics
        summary: "Astrometrics Borg cube: the screen effect's cube in the scene"
        description: "type: cube: the Borg cube with carved machinery, its rail lattice and pulsing glow spots, closing on a starship with a tractor beam (the Borg encounter starter); below, the styles side by side: borg, detail off and plain. The buttons above a scene fly its camera to each of its named views."
        session: "E8"
        docs: /cards/astrometrics/objects#cube
        public: true
      - file: astro-trail
        topic: astrometrics
        summary: "Astrometrics trails: where moving points have been"
        description: "type: trail: fading lines behind planets and a comet on their orbits, built while the card is open, and a starship model riding an orbit with a dashed wake. The buttons above a scene fly its camera to each of its named views."
        session: "E8"
        docs: /cards/astrometrics/objects#trail
        public: true
      - file: astro-own-models
        topic: astrometrics
        summary: "Astrometrics own models: one model file from the library, a path and the media browser"
        description: "The same Deep Space 9 file reached the three ways the Studio's Src picker offers: the asset library (builtin:), a custom path, and the Home Assistant media browser under LCARdS (the route your own models take from the My models folder, /config/www/lcards/models). The middle one shows as a hologram, the default for any model."
        session: "M2b"
        docs: /cards/astrometrics/models
        public: true
      - file: astro-starbases
        topic: astrometrics
        summary: "Astrometrics starbases: Deep Space 9, Earth Spacedock, Utopia Planitia"
        description: "Three built-in starbase models made in code after the on-screen designs: Deep Space 9 by the wormhole with Ops and its pylons marked, the Utopia Planitia drydocks over Mars with a starship in one, a starship approaching Earth Spacedock's space doors, and all three as holograms. The buttons above a scene fly its camera to each of its named views."
        session: "E8"
        docs: /cards/astrometrics/objects#built-in-models
        public: true
      - file: astro-belt
        topic: astrometrics
        summary: "Astrometrics asteroid belt: rocks round a star"
        description: "type: belt: a band of low-poly rocks round the Sun, the inner ones going round faster (period) and each tumbling, lit from the Sun, grey and tan rocks from a colors list (each rock takes one). Fly to MAIN BELT for a close look. Second card: a ring of small rocks round a planet. Third card: the band follows sliders and eases in place round the same rocks (INNER EDGE and OUTER + ROCKS move each edge, the second also adds rocks; THICKNESS spreads them up and down). The buttons above a scene fly its camera to each of its named views."
        session: "E8"
        docs: /cards/astrometrics/objects#belt
        public: true
      - file: astro-planets
        topic: astrometrics
        summary: "Astrometrics planets: maps, planet types, Saturn's rings"
        description: "The built-in planet maps (NASA and USGS, public domain), the nine fill_effect planet types (gas giant to terran), Saturn with its ring band, and a gas giant preset with its own keys on top (fewer belts, stormier, churning)."
        session: "E8"
        docs: /cards/astrometrics/objects#built-in-planet-maps
        public: true
      - file: astro-starters
        topic: astrometrics
        summary: "Astrometrics starters: scenes and parts"
        description: "Every scene of the Astrometrics Studio's Starters tab with its defaults (galaxy, sector map, sky dome, solar system, Federation map, starbase approach), and the four parts added round one star: a planet with a moon, an asteroid belt, territories and a nebula. The buttons above a scene fly its camera to each of its named views."
        session: "E7"
        docs: /cards/astrometrics/starters
        public: true
      - file: astro-objects
        topic: astrometrics
        summary: "Every astrometrics object type"
        description: "One card per object type: grid, volume, sphere (plain and textured) and path."
        session: "E2b"
        docs: /cards/astrometrics/objects
        public: true
      - file: astro-points-data
        topic: astrometrics
        summary: "Points, labels, live data, globe and sky"
        description: "Placement forms, label styles, point actions, a point following an entity, templates, a globe with your home on it (zone.home) and the sky from your location (sun.sun). The buttons above a scene fly its camera to each of its named views. LIGHTS and TOGGLE switch the helpers the points beside them follow."
        session: "E3a"
        docs: /cards/astrometrics/points
        public: true
      - file: astro-camera
        topic: astrometrics
        summary: "Camera controls and fly-to from other cards"
        description: "Drag to orbit, shift-drag, middle-drag, two fingers or a touchpad swipe to pan, wheel or pinch to zoom to the pointer, double-tap blank space to fly in (shift: out), the on-card buttons, and fly-to from other cards (the buttons below name the card by its id). The second card is a map: a one-finger drag pans."
        session: "E3b"
        docs: /cards/astrometrics/#controls
        public: true
      - file: astro-effects
        topic: astrometrics
        summary: "Nebula, scans, flows, fills, warp and dust in 3D"
        description: "Background effects in 3D space: nebula, scan bands, moving dashes and pulses, animated surface fills, warp and dust. The buttons above a scene fly its camera to each of its named views."
        session: "E6"
        docs: /cards/astrometrics/effects
        public: true
      - file: astro-cards-models
        topic: astrometrics
        summary: "Cards and 3D models in the scene"
        description: "The built-in starship as a hologram with points on its parts, LCARdS cards pinned to points (always shown, or opened with a tap on BRIDGE), labels hiding behind the hull, the ship with its own materials, and a see-through orange hologram. The buttons above a scene fly its camera to each of its named views. TOGGLE, LIGHTS and POWER drive the cards pinned on the ship."
        session: "E4"
        docs: /cards/astrometrics/objects#model
        public: true
      - file: astro-deformed-grids
        topic: astrometrics
        summary: "Deformed grids, wells and a wormhole"
        description: "A jelly cylinder, a tornado (a twisted well whose bend circles), a wormhole with a ripple, a whirlpool disc, and a sector map on rolling noise with its cells and points riding the surface. The buttons above a scene fly its camera to each of its named views."
        session: "E5"
        docs: /cards/astrometrics/objects#deformed-grids
        public: true
      - file: webgl-scenes
        topic: webgl
        summary: "WebGL background scenes, alone and stacked"
        description: "three.js background scenes: the WebGL noise presets, grid floor and warp starfield, alone and stacked. The sliders are bound with the card's entity and map_range: FLOOR TILT tilts card 5, WARP SPEED drives cards 1 and 2; RED ALERT warps card 3."
        session: "C2"
        docs: /core/effects/background-animations#webgl-presets
        public: true
      - file: webgl-fields
        topic: webgl
        summary: "Noise presets on the GPU"
        description: "contour-field, plasma, fluid and the other noise presets on the GPU, with the renderer key. FILL LEVEL raises the waterline and noise scale of cards 6A and 6B; DRIFT moves the plasma and fluid (3 and 4), WebGL and Canvas together."
        session: "C3"
        docs: /core/effects/background-animations/preset-reference#contour-field
        public: true
      - file: holo-sphere
        topic: webgl
        summary: "The holographic planet"
        description: "The holographic planet: lines, scan band, rotation and tilt. TURN + SIZE drives card 3, TILT leans the spheres in 1A and 1B; tap card 4 to tilt it."
        session: "C3"
        docs: /core/effects/background-animations/preset-reference#holo-sphere
        public: true
      - file: nebula-volumetric
        topic: webgl
        summary: "The nebula, flat and volumetric"
        description: "The nebula preset on WebGL, flat and volumetric. TURBULENCE stirs 1A and 1B (volumetric and plain side by side), DRIFT moves card 2."
        session: "C3"
        docs: /core/effects/background-animations/preset-reference#nebula
        public: true
      - file: warp-spectrum
        topic: webgl
        summary: "Doppler-shifted warp streaks"
        description: "spectrum: true splits each streak into colour, a Doppler shift of the star's own colour (violet toward the tail). White stars show the whole rainbow, coloured stars a part of it; reverse puts violet at the head. The last card warps on red alert and drops to dots when it clears: the colour fades in as the dots stretch. STREAK stretches cards 1 to 4 together, BANK turns the camera of card 6."
        session: "warp-starfield spectrum"
        docs: /core/effects/background-animations/preset-reference#warp-starfield
        public: true
      - file: grid-views
        topic: grids
        summary: "Grid floors, camera and line widths"
        description: "grid, grid-diagonal and grid-hexagonal on WebGL: flat and floor views, camera, line widths, scan line. LINE WIDTH drives the floors 3, 4 and 7; CAMERA tilts floor 8 and banks the warp in card 10."
        session: "C3"
        docs: /core/effects/background-animations/preset-reference#grid-views-and-camera
        public: true
      - file: grid-surfaces
        topic: grids
        summary: "Grids on cylinders, domes and spheres"
        description: "Grids wrapped round a cylinder, dome or sphere, with rims. TURN spins the cylinders and the sphere (1, 3, 4, 5) about their axis, CAMERA TILT the dome and the unbounded cylinder."
        session: "C4"
        docs: /core/effects/background-animations/preset-reference#grid-surfaces
        public: true
      - file: grid-surfaces-inside
        topic: grids
        summary: "Grid surfaces seen from inside"
        description: "The camera inside a cylinder, dome or sphere. SPEED flies through the tunnel, LOOK UP tilts the camera inside the dome and the sphere."
        session: "C4"
        docs: /core/effects/background-animations/preset-reference#grid-surfaces
        public: true
      - file: grid-polar
        topic: grids
        summary: "Polar grids"
        description: "pattern: polar, flat, as a floor and on surfaces. SPOKES sets the spoke count of 1, 5 and 6; CAMERA TILT the floors 2 and 8."
        session: "C5"
        docs: /core/effects/background-animations/preset-reference#polar-pattern
        public: true
      - file: grid-wells
        topic: grids
        summary: "Grid wells, morph and ripple"
        description: "surface: well: funnels of any profile, morph and ripple. THROAT opens and closes the wells 1, 4 and 9; CAMERA TILT turns 6 and 10."
        session: "C5"
        docs: /core/effects/background-animations/preset-reference#grid-wells
        public: true
      - file: grid-motion
        topic: grids
        summary: "Camera roll and surface rotation"
        description: "camera_roll and the surface_rotate_* keys: surfaces facing any way, animated. RIPPLE and RIPPLE SPEED drive the waves of cards 4 and 6; the rest animate on their own."
        session: "C5"
        docs: /core/effects/background-animations/preset-reference#grid-surfaces
        public: true
      - file: zoom-webgl
        topic: webgl
        summary: "The zoom wrapper over WebGL"
        description: "The zoom wrapper over the WebGL presets."
        session: "C5"
        docs: /core/effects/background-animations#zoom-wrapper
        public: true
      - file: alert-recolour
        topic: alerts
        summary: "Backgrounds through alert modes"
        description: "Every background should keep moving without a jump when the alert mode changes (press the alert buttons)."
        session: "F1"
        docs: /core/effects/background-animations
        public: false
      - file: anim-presets
        topic: alerts
        summary: "New animation presets"
        description: "boot-sequence (tap a card to boot it again), text-decode (tap to decode, or drag the slider beside it), tap-ripple (tap a cell), sensor-sweep and morph on MSD overlays."
        session: "A4, B1"
