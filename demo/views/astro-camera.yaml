# Astrometrics camera controls (E3b). Seeded from the docs examples.
title: Astrometrics camera controls
path: astro-camera
type: sections
max_columns: 4
sections:
  - type: grid
    column_span: 4
    cards:
      - type: custom:lcards-button
        preset: lozenge
        text: { name: { content: GALAXY, show: true } }
        tap_action: { action: fly-to, card: demo_galaxy, view: galaxy }
        grid_options: { columns: 8, rows: 1 }
      - type: custom:lcards-button
        preset: lozenge
        text: { name: { content: MAP, show: true } }
        tap_action: { action: fly-to, card: demo_galaxy, view: map }
        grid_options: { columns: 8, rows: 1 }
      - type: custom:lcards-button
        preset: lozenge
        text: { name: { content: NIMBUS III, show: true } }
        tap_action: { action: fly-to, card: demo_galaxy, view: planet }
        grid_options: { columns: 8, rows: 1 }
      - type: custom:lcards-button
        preset: lozenge
        text: { name: { content: VEGA, show: true } }
        tap_action: { action: fly-to, card: demo_galaxy, point: vega, duration: 2500 }
        grid_options: { columns: 8, rows: 1 }
      - type: custom:lcards-astrometrics-card
        height: 460
        camera:
          view: galaxy
          views:
            galaxy: { target: core, yaw: 20, tilt: 35, distance: 280 }
            map: { target: core, tilt: 90, distance: 300 }
            planet: { target: nimbus, yaw: 60, tilt: 20, distance: 40 }
          buttons: true
        backdrop: { stars: { count: 2500 } }
        points:
          - { id: core, xyz: [ 0, 0, 0 ], label: GALACTIC CORE, style: title }
          - { id: sagittarius, polar: [ 45, 300 ], label: Sagittarius Arm, style: major }
          - id: federation
            polar: [ 75, 135 ]
            alt: 22
            label: FEDERATION
            style: major
            color: var(--lcars-blue)
          - id: borg
            polar: [ 30, 345 ]
            alt: 44
            label: BORG SPACE
            style: major
            color: var(--lcars-green)
          - id: talos
            polar: [ 52, 310 ]
            marker: dot
            label: Talos IV
            style: tiny
            max_distance: 200
          - { id: vega, polar: [ 64, 160 ], marker: triangle, label: Vega, style: minor }
          - id: nimbus
            polar: [ 72, 236 ]
            alt: 12
            marker: reticle
            label: NIMBUS III
            tap_action: { action: fly-to, view: planet }
          - id: away
            latlon: [ 10, 40 ]
            object: planet
            alt: 0.3
            marker: dot
            label: AWAY TEAM
            style: tiny
            color: var(--lcars-orange)
        objects:
          - type: grid
            shape: disc
            radius: 100
            pattern: polar
            line_spacing: 10
            spoke_count: 36
            major_row_interval: 3
            ring_labels: { step: 10, radius: 106 }
          - { type: ring, radius: 100, width: 3, color: theme:colors.ui.secondary }
          - type: volume
            id: federation_space
            shape: sector
            radius: [ 55, 95 ]
            angle: [ 100, 170 ]
            height: [ -6, 18 ]
            cells: { ring: 10, angle: 10, layer: 8 }
            color: var(--lcars-blue)
            tap_action: { action: fly-to }
          - type: volume
            shape: sector
            radius: [ 18, 42 ]
            angle: [ 330, 360 ]
            height: [ 0, 40 ]
            color: var(--lcars-green)
          - { type: glow, at: core, size: 70 }
          - { type: beam, from: [ -180, 0, 0 ], to: [ 180, 0, 0 ] }
          - { type: beam, from: [ 0, 0, -180 ], to: [ 0, 0, 180 ] }
          - { type: sphere, id: planet, at: nimbus, radius: 6, spin: 8 }
          - { type: ring, around: nimbus, radius: 10, inclination: 20, width: 1.5 }
          - type: path
            points: [ talos, vega ]
            arc: 12
            dash: [ 6, 4 ]
            color: var(--lcars-orange)
        id: demo_galaxy
        grid_options: &a1 { columns: full }
  - type: grid
    column_span: 4
    cards:
      - type: custom:lcards-astrometrics-card
        height: 420
        camera:
          views: { map: { target: core, tilt: 90, distance: 300, projection: orthographic } }
          drag: pan
          zoom_step: 2
          limits: { tilt: [ 90, 90 ], target: { radius: 150 } }
          buttons: { position: bottom-right, pan: true, zoom: true, reset: true }
        points:
          - { id: core, xyz: [ 0, 0, 0 ], label: SECTOR 001, style: title }
          - { id: a, xyz: [ 60, 0, 40 ], label: Wolf 359, style: minor }
          - { id: b, xyz: [ -80, 0, -30 ], label: Vulcan, style: minor }
          - { id: c, xyz: [ 20, 0, -90 ], label: Andoria, style: minor }
        objects:
          - { type: grid, shape: plane, size: 300, line_spacing: 20, major_row_interval: 5 }
          - { type: path, points: [ a, core, b ], dash: [ 6, 4 ], color: var(--lcars-orange) }
        grid_options: *a1
