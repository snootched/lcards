# Astrometrics navigation (N1): follow a moving point, touchpad swipe to pan,
# middle-drag, buttons that fade when idle. Tap a ship: the camera flies to it
# and stays on it round its orbit; zoom and orbit still work, a pan or a tap
# on blank space lets go. The slider under the buttons sets the speed.
title: Astrometrics navigation
path: astro-navigation
type: sections
max_columns: 4
sections:
  - type: grid
    column_span: 4
    cards:
      - type: custom:lcards-button
        preset: lozenge
        text: { name: { content: SYSTEM, show: true } }
        tap_action: { action: fly-to, card: astro_navigation_1, view: system }
        grid_options: { columns: 8, rows: 1 }
      - type: custom:lcards-button
        preset: lozenge
        text: { name: { content: TOP, show: true } }
        tap_action: { action: fly-to, card: astro_navigation_1, view: top }
        grid_options: { columns: 8, rows: 1 }
      - type: custom:lcards-button
        preset: lozenge
        text: { name: { content: ENTERPRISE, show: true } }
        tap_action: { action: fly-to, card: astro_navigation_1, point: enterprise }
        grid_options: { columns: 8, rows: 1 }
      - type: custom:lcards-button
        preset: lozenge
        text: { name: { content: SHUTTLE, show: true } }
        tap_action: { action: fly-to, card: astro_navigation_1, point: shuttle }
        grid_options: { columns: 8, rows: 1 }
      - type: custom:lcards-button
        preset: lozenge
        text: { name: { content: PROBE, show: true } }
        tap_action: { action: fly-to, card: astro_navigation_1, point: probe }
        grid_options: { columns: 8, rows: 1 }
      - type: custom:lcards-astrometrics-card
        id: astro_navigation_1
        height: 650
        grid_options: { columns: full }
        camera:
          view: system
          buttons: true
          views:
            system: { target: [ 0, 0, 0 ], yaw: 20, tilt: 40, distance: 320 }
            top: { target: [ 0, 0, 0 ], tilt: 90, distance: 360 }
        backdrop:
          stars: { count: 2000 }
        points:
          - { id: star, xyz: [ 0, 0, 0 ], label: STARBASE 11, style: major }
          - { id: enterprise, polar: [ 70, 0 ], object: patrol, label: ENTERPRISE, style: minor, offset: [ 0, 8, 0 ] }
          - { id: planet, polar: [ 130, 120 ], object: outer, marker: dot, label: TAU CETI IV, style: minor }
          - { id: shuttle, polar: [ 16, 0 ], object: moon_orbit, label: SHUTTLE, style: minor, offset: [ 0, 4, 0 ] }
          - { id: probe, polar: [ 100, 250 ], object: probe_path, marker: dot, label: PROBE, style: minor }
        objects:
          - { type: sphere, at: star, radius: 12, fill_effect: { preset: rocky }, line_width: 0.5, opacity: 0.35, spin: 5 }
          - { type: ring, id: patrol, radius: 70, spin: 4, width: 0.5, opacity: 0.25, rotation: [ 12, 0, 0 ] }
          - { type: model, src: builtin:constitution, at: enterprise, size: 16, face: motion }
          - { type: trail, point: enterprise, length: 6, width: 2, dash: [ 6, 4 ] }
          - { type: ring, id: outer, radius: 130, spin: 1.5, width: 0.5, opacity: 0.15 }
          - { type: sphere, at: planet, radius: 7, fill_effect: { preset: ice }, line_width: 0.5 }
          - { type: ring, id: moon_orbit, at: planet, radius: 16, spin: 12, width: 0.5, opacity: 0.2 }
          - { type: model, src: builtin:constitution, at: shuttle, size: 4, face: motion }
          - { type: ring, id: probe_path, radius: 100, spin: -6, width: 0.5, opacity: 0.12, rotation: [ -25, 0, 10 ] }
          - { type: trail, point: probe, length: 4, width: 1.5, color: var(--lcars-orange) }
          - { type: grid, shape: disc, radius: 160, line_spacing: 20, opacity: 0.25 }
