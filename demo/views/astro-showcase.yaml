# Astrometrics showcase (R4d), written by scripts/make-astro-showcase.mjs: do not
# edit by hand, change the script (or the starters it is built on) and run it.
# The Star Trek galaxy with the real Sol system and a Bajor system inside it,
# the 18 stops down the left, the controls along the bottom. Helpers in
# tests/ha/ha-client.mjs; uses: script.lcards_test_tour,
# automation.lcards_test_alert, automation.lcards_test_date (demo/package.yaml).
title: Astrometrics showcase
path: astro-showcase
type: custom:lcards-layout-view
layout:
  height: calc(100dvh - var(--header-height, 56px))
  min-height: 1250px
  padding: 12px
  grid-gap: 8px
  grid-template-columns: 90px 170px minmax(0, 1fr)
  grid-template-rows: 80px minmax(0, 1fr) 326px 44px
  grid-template-areas: '"head head head" "arm stops scene" "arm stops controls" "foot foot foot"'
cards:
  - type: custom:lcards-elbow
    view_layout:
      grid-area: head
    elbow:
      type: header-left
  - type: custom:lcards-layout-card
    view_layout:
      grid-area: arm
    layout:
      grid-gap: 6px
      grid-template-columns: minmax(0, 1fr)
      grid-template-rows: 3fr 1fr 1fr 5fr 1fr 2fr
    cards:
      - type: custom:lcards-button
        preset: panel-light
        min_height: 0
        interactive: false
        text:
          label: {content: 47-2201, position: bottom-right}
        style:
          card: {color: {background: {default: theme:colors.ui.primary}}}
      - type: custom:lcards-button
        preset: panel-light
        min_height: 0
        interactive: false
        text:
          label: {content: 03-118, position: bottom-right}
        style:
