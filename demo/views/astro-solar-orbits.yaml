# Astrometrics Solar system orbits: the Solar system starter (scene units) with Pluto, each orbit
# ring tilted to its planet's real inclination about its ascending node (J2000), the planets going
# round in those planes. SYSTEM is the starter's own view, TOP looks down, EDGE looks along the
# ecliptic so each ring's tilt shows (Mercury 7 degrees, Pluto 17), PLUTO flies to Pluto.
title: Astrometrics Solar system orbits
path: astro-solar-orbits
type: sections
max_columns: 4
sections:
  - type: grid
    column_span: 4
    cards:
      - type: custom:lcards-button
        preset: lozenge
        text:
          name: {content: SYSTEM, show: true}
        tap_action: {action: fly-to, card: astro_solar_orbits, view: system}
        grid_options: {columns: 8, rows: 1}
      - type: custom:lcards-button
        preset: lozenge
        text:
          name: {content: TOP, show: true}
        tap_action: {action: fly-to, card: astro_solar_orbits, view: top}
        grid_options: {columns: 8, rows: 1}
      - type: custom:lcards-button
        preset: lozenge
        text:
          name: {content: EDGE, show: true}
        tap_action: {action: fly-to, card: astro_solar_orbits, view: edge}
        grid_options: {columns: 8, rows: 1}
      - type: custom:lcards-button
        preset: lozenge
        text:
          name: {content: PLUTO, show: true}
        tap_action: {action: fly-to, card: astro_solar_orbits, view: pluto}
        grid_options: {columns: 8, rows: 1}
      - type: custom:lcards-astrometrics-card
        points:
          - { id: sun, xyz: [0, 0, 0], label: SOL, style: major }
          - id: mercury
            polar: [20, 40]
            object: mercury_orbit
            marker: dot
            label: MERCURY
            style: minor
            tap_action: { action: fly-to }
          - { id: venus, polar: [30, 150], object: venus_orbit, marker: dot, label: VENUS, style: minor, tap_action: { action: fly-to } }
          - { id: earth, polar: [42, 250], object: earth_orbit, marker: dot, label: EARTH, style: minor, tap_action: { action: fly-to } }
          - { id: mars, polar: [56, 320], object: mars_orbit, marker: dot, label: MARS, style: minor, tap_action: { action: fly-to } }
          - id: jupiter
            polar: [82, 100]
            object: jupiter_orbit
            marker: dot
            label: JUPITER
            style: minor
            tap_action: { action: fly-to }
          - id: saturn
            polar: [112, 200]
            object: saturn_orbit
            marker: dot
            label: SATURN
            style: minor
            tap_action: { action: fly-to }
          - id: uranus
            polar: [138, 20]
            object: uranus_orbit
            marker: dot
            label: URANUS
            style: minor
            tap_action: { action: fly-to }
          - id: neptune
            polar: [160, 280]
            object: neptune_orbit
            marker: dot
            label: NEPTUNE
            style: minor
            tap_action: { action: fly-to }
          - { id: pluto, polar: [184, 160], object: pluto_orbit, marker: dot, label: PLUTO, style: minor, tap_action: { action: fly-to } }
          - { id: moon, polar: [5, 0], object: moon_orbit, marker: dot, label: LUNA, style: tiny, max_distance: 80 }
        objects:
          - { type: glow, at: sun, size: 40, color: var(--lcars-yellow) }
          - type: sphere
            id: sun_body
            at: sun
            radius: 5
            fill: { color: var(--lcars-yellow) }
            color: var(--lcars-orange)
            line_spacing_deg: 30
          - type: ring
            id: mercury_orbit
            radius: 20
            spin: 24
            width: 1
            color: theme:colors.ui.secondary
            opacity: 0.6
            rotation: [7, 48.3, 0]
          - type: sphere
            id: mercury_body
            at: mercury
            radius: 1.2
            image: builtin:mercury_messenger
            line_spacing_deg: 30
            line_width: 0.5
            spin: 15
          - type: ring
            id: venus_orbit
            radius: 30
            spin: 16
            width: 1
            color: theme:colors.ui.secondary
            opacity: 0.6
            rotation: [3.39, 76.7, 0]
          - type: sphere
            id: venus_body
            at: venus
            radius: 2
            fill: { effect: { preset: clouds } }
            line_spacing_deg: 30
            line_width: 0.5
            spin: 15
          - { type: ring, id: earth_orbit, radius: 42, spin: 10, width: 1, color: theme:colors.ui.secondary, opacity: 0.6 }
          - type: sphere
            id: earth_body
            at: earth
            radius: 2.4
            image: builtin:earth_blue_marble
            line_spacing_deg: 30
            line_width: 0.5
            spin: 20
          - type: ring
            id: mars_orbit
            radius: 56
            spin: 6
            width: 1
            color: theme:colors.ui.secondary
            opacity: 0.6
            rotation: [1.85, 49.6, 0]
          - type: sphere
            id: mars_body
            at: mars
            radius: 1.6
            image: builtin:mars_viking
            line_spacing_deg: 30
            line_width: 0.5
            spin: 15
          - type: ring
            id: jupiter_orbit
            radius: 82
            spin: 2.5
            width: 1
            color: theme:colors.ui.secondary
            opacity: 0.6
            rotation: [1.3, 100.5, 0]
          - type: sphere
            id: jupiter_body
            at: jupiter
            radius: 5
            image: builtin:jupiter_cassini
            line_spacing_deg: 30
            line_width: 0.5
            spin: 15
          - type: ring
            id: saturn_orbit
            radius: 112
            spin: 1.6
            width: 1
            color: theme:colors.ui.secondary
            opacity: 0.6
            rotation: [2.49, 113.7, 0]
          - type: sphere
            id: saturn_body
            at: saturn
            radius: 4.2
            fill: { effect: { preset: ringed_giant } }
            line_spacing_deg: 30
            line_width: 0.5
            spin: 15
          - type: ring
            id: uranus_orbit
            radius: 138
            spin: 1.1
            width: 1
            color: theme:colors.ui.secondary
            opacity: 0.6
            rotation: [0.77, 74, 0]
          - type: sphere
            id: uranus_body
            at: uranus
            radius: 3
            fill: { effect: { preset: ice_giant } }
            line_spacing_deg: 30
            line_width: 0.5
            spin: 15
          - type: ring
            id: neptune_orbit
            radius: 160
            spin: 0.8
            width: 1
            color: theme:colors.ui.secondary
            opacity: 0.6
            rotation: [1.77, 131.8, 0]
          - type: sphere
            id: neptune_body
            at: neptune
            radius: 3
            fill: { effect: { preset: storm_giant } }
            line_spacing_deg: 30
            line_width: 0.5
            spin: 15
          - type: ring
            id: pluto_orbit
            radius: 184
            spin: 0.55
            width: 1
            color: theme:colors.ui.secondary
            opacity: 0.6
            rotation: [17.16, 110.3, 0]
          - type: sphere
            id: pluto_body
            at: pluto
            radius: 0.9
            image: builtin:pluto_new_horizons
            line_spacing_deg: 30
            line_width: 0.5
            spin: 15
          - type: ring
            id: saturn_rings
            at: saturn
            radius: 9.8
            inclination: 27
            band: { image: builtin:saturn_rings, inner_radius: 4.66 }
          - { type: ring, id: moon_orbit, at: earth, radius: 5, spin: 40, width: 1, dash: [3, 3], opacity: 0.6, max_distance: 80 }
          - type: sphere
            id: moon_body
            at: moon
            radius: 0.6
            image: builtin:moon_lroc
            line_spacing_deg: 45
            line_width: 0.5
            max_distance: 80
        camera:
          view: system
          views:
            system: { target: sun, yaw: 20, tilt: 40, distance: 440 }
            top: { target: sun, tilt: 90, distance: 460 }
            earth: { target: earth, yaw: 30, tilt: 20, distance: 22 }
            edge: { target: sun, yaw: 20, tilt: 4, distance: 420 }
            pluto: { target: pluto, yaw: 60, tilt: 20, distance: 14 }
        backdrop: { stars: { count: 2000 } }
        id: astro_solar_orbits
        height: 620
        grid_options: {columns: full}
