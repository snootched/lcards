# Astrometrics Star Trek galaxy (R4c2): the 'Star Trek galaxy' starter with its
# three parts (minor powers, Delta Quadrant powers, Borg transwarp network) as
# the Studio inserts them. Real stars near Sol at their real positions, the
# recorded distances for the rest; the buttons fly the camera to each stop.
title: Astrometrics Star Trek galaxy
path: astro-star-trek
type: sections
max_columns: 4
sections:
  - type: grid
    column_span: 4
    cards:
      - type: custom:lcards-button
        preset: lozenge
        text:
          name: {content: GALAXY, show: true}
        tap_action:
          action: fly-to
          card: astro_star_trek_1
          view: galaxy
        grid_options:
          columns: 6
          rows: 1
      - type: custom:lcards-button
        preset: lozenge
        text:
          name: {content: QUADRANTS, show: true}
        tap_action:
          action: fly-to
          card: astro_star_trek_1
          view: quadrants
        grid_options:
          columns: 6
          rows: 1
      - type: custom:lcards-button
        preset: lozenge
        text:
          name: {content: FEDERATION, show: true}
        tap_action:
          action: fly-to
          card: astro_star_trek_1
          view: federation
        grid_options:
          columns: 6
          rows: 1
      - type: custom:lcards-button
        preset: lozenge
        text:
          name: {content: SOL NEIGHBOURS, show: true}
        tap_action:
          action: fly-to
          card: astro_star_trek_1
          view: neighbours
        grid_options:
          columns: 6
          rows: 1
      - type: custom:lcards-button
        preset: lozenge
        text:
          name: {content: BAJOR, show: true}
        tap_action:
          action: fly-to
          card: astro_star_trek_1
          view: bajor
        grid_options:
          columns: 6
          rows: 1
      - type: custom:lcards-button
        preset: lozenge
        text:
          name: {content: GAMMA QUADRANT, show: true}
        tap_action:
          action: fly-to
          card: astro_star_trek_1
          view: gamma
        grid_options:
          columns: 6
          rows: 1
      - type: custom:lcards-button
        preset: lozenge
        text:
          name: {content: DELTA QUADRANT, show: true}
        tap_action:
          action: fly-to
          card: astro_star_trek_1
          view: delta
        grid_options:
          columns: 6
          rows: 1
      - type: custom:lcards-button
        preset: lozenge
        text:
          name: {content: GREAT BARRIER, show: true}
        tap_action:
          action: fly-to
          card: astro_star_trek_1
          view: barrier
        grid_options:
          columns: 6
          rows: 1
      - type: custom:lcards-astrometrics-card
        id: astro_star_trek_1
        grid_options:
          columns: full
        height: 750
