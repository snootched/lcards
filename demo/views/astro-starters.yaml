# Astrometrics starters (E7 part 4): every scene starter of the Studio's
# Starters tab with its defaults, and every part added round one star.
# Generated from src/core/astrometrics/starters/ (the view is kept as it is).
title: Astrometrics starters
path: astro-starters
type: sections
max_columns: 4
sections:
  - type: grid
    column_span: 4
    cards:
      - type: custom:lcards-button
        preset: lozenge
        text: { name: { content: GALAXY, show: true } }
        tap_action: { action: fly-to, card: astro_starters_1, view: galaxy }
        grid_options: { columns: 8, rows: 1 }
      - type: custom:lcards-button
        preset: lozenge
        text: { name: { content: MAP, show: true } }
        tap_action: { action: fly-to, card: astro_starters_1, view: map }
        grid_options: { columns: 8, rows: 1 }
      - type: custom:lcards-button
        preset: lozenge
        text: { name: { content: PLANET, show: true } }
        tap_action: { action: fly-to, card: astro_starters_1, view: planet }
        grid_options: { columns: 8, rows: 1 }
      - type: custom:lcards-astrometrics-card
        id: astro_starters_1
        height: 650
        points:
          - { id: core, xyz: [0, 0, 0], label: GALACTIC CORE, style: title }
          - { id: sagittarius, polar: [45, 300], label: Sagittarius Arm, style: major }
          - { id: federation, polar: [75, 135], alt: 22, label: FEDERATION, style: major, color: var(--lcars-blue) }
          - { id: borg, polar: [30, 345], alt: 44, label: BORG SPACE, style: major, color: var(--lcars-green) }
          - { id: talos, polar: [52, 310], marker: dot, label: Talos IV, style: tiny, max_distance: 200 }
          - { id: vega, polar: [64, 160], marker: triangle, label: Vega, style: minor }
          - { id: nimbus, polar: [72, 236], alt: 12, marker: reticle, label: NIMBUS III, tap_action: { action: fly-to, view: planet } }
          - id: away
            latlon: [10, 40]
            object: planet
            alt: 0.3
            marker: dot
            label: AWAY TEAM
            style: tiny
            color: var(--lcars-orange)
        objects:
          - type: grid
            shape: disc
            radius: 100
            pattern: polar
            line_spacing: 10
            spoke_count: 36
            major: { row_interval: 3 }
            ring_labels: { step: 10, radius: 106 }
          - { type: ring, radius: 100, width: 3, color: theme:colors.ui.secondary }
          - type: volume
            id: federation_space
            shape: sector
            radius: [55, 95]
            angle: [100, 170]
            height: [-6, 18]
            cells: { ring: 10, angle: 10, layer: 8 }
            color: var(--lcars-blue)
            tap_action: { action: fly-to }
          - { type: volume, shape: sector, radius: [18, 42], angle: [330, 360], height: [0, 40], color: var(--lcars-green) }
          - { type: glow, at: core, size: 70 }
          - { type: beam, from: [-180, 0, 0], to: [180, 0, 0] }
          - { type: beam, from: [0, 0, -180], to: [0, 0, 180] }
          - { type: sphere, id: planet, at: nimbus, radius: 6, spin: 8 }
          - { type: ring, at: nimbus, radius: 10, inclination: 20, width: 1.5 }
          - { type: path, points: [talos, vega], arc: 12, dash: [6, 4], color: var(--lcars-orange) }
        camera:
          view: galaxy
          views:
            galaxy: { target: core, yaw: 20, tilt: 35, distance: 280 }
            map: { target: core, tilt: 90, distance: 300 }
            planet: { target: nimbus, yaw: 60, tilt: 20, distance: 40 }
        backdrop: { stars: { count: 2500 } }
        grid_options: { columns: full }
      - type: custom:lcards-astrometrics-card
        height: 650
        points:
          - { id: ufp, cell: AG4, object: sectors, label: UNITED FEDERATION OF PLANETS, style: major }
          - { id: sb10, cell: AJ2, object: sectors, offset: [8, 0, 12], marker: triangle, label: Starbase 10 }
          - { id: achernar, cell: AN3, object: sectors, marker: diamond, label: Achernar }
          - { id: qualor, cell: AL6, object: sectors, marker: dot, label: Qualor, style: tiny, max_distance: 1300 }
        objects:
          - type: grid
            id: sectors
            shape: plane
            size: [1200, 600]
            line_spacing: 40
            axis_labels: { columns: letters, rows: numbers, column_start: AD }
            cells:
              - { from: AF3, to: AH6, color: var(--lcars-blue), opacity: 0.3, shade: 0.4, edges: true }
              - { from: AL2, to: AO5, color: var(--lcars-green), opacity: 0.25, shade: 0.4 }
              - { from: AL9, to: AP12, color: var(--lcars-red), opacity: 0.3, shade: 0.4 }
        camera:
          view: map
          limits: { tilt: [90, 90] }
          views: { map: { target: [0, 0, 0], tilt: 90, distance: 1250, projection: orthographic } }
        grid_options: { columns: full }
      - type: custom:lcards-button
        preset: lozenge
        text: { name: { content: HORIZON, show: true } }
        tap_action: { action: fly-to, card: astro_starters_3, view: horizon }
        grid_options: { columns: 8, rows: 1 }
      - type: custom:lcards-button
        preset: lozenge
        text: { name: { content: ZENITH, show: true } }
        tap_action: { action: fly-to, card: astro_starters_3, view: zenith }
        grid_options: { columns: 8, rows: 1 }
      - type: custom:lcards-astrometrics-card
        id: astro_starters_3
        height: 650
        points:
          - { id: sun, sky: sun, object: sky, marker: reticle, label: SOL }
          - { id: moon, sky: moon, object: sky, marker: moon_phase, label: LUNA }
          - { id: north, altaz: [0, 0], object: sky, label: 'N', style: major, overlap: true }
          - { id: east, altaz: [90, 0], object: sky, label: E, style: major, overlap: true }
          - { id: south, altaz: [180, 0], object: sky, label: S, style: major, overlap: true }
          - { id: west, altaz: [270, 0], object: sky, label: W, style: major, overlap: true }
        objects:
          - { type: grid, id: sky, shape: dome, radius: 100, pattern: both, line_spacing_deg: 15 }
          - { type: ring, radius: 100, width: 3, color: theme:colors.ui.primary }
          - { type: path, sky: sun, object: sky, dash: [6, 4], color: var(--lcars-yellow) }
          - { type: path, sky: moon, object: sky, dash: [6, 4], color: var(--lcars-blue) }
        camera:
          view: horizon
          views:
            horizon: { target: [0, 15, 0], yaw: 180, tilt: 28, distance: 260 }
            zenith: { target: [0, 0, 0], tilt: 90, distance: 260 }
        grid_options: { columns: full }
      - type: custom:lcards-button
        preset: lozenge
        text: { name: { content: SYSTEM, show: true } }
        tap_action: { action: fly-to, card: astro_starters_4, view: system }
        grid_options: { columns: 8, rows: 1 }
      - type: custom:lcards-button
        preset: lozenge
        text: { name: { content: TOP, show: true } }
        tap_action: { action: fly-to, card: astro_starters_4, view: top }
        grid_options: { columns: 8, rows: 1 }
      - type: custom:lcards-button
        preset: lozenge
        text: { name: { content: EARTH, show: true } }
        tap_action: { action: fly-to, card: astro_starters_4, view: earth }
        grid_options: { columns: 8, rows: 1 }
      - type: custom:lcards-astrometrics-card
        id: astro_starters_4
        height: 650
        points:
          - { id: sun, xyz: [0, 0, 0], label: SOL, style: major }
          - id: mercury
            polar: [20, 40]
            object: mercury_orbit
            marker: dot
            label: MERCURY
            style: minor
            tap_action: { action: fly-to }
          - { id: venus, polar: [30, 150], object: venus_orbit, marker: dot, label: VENUS, style: minor, tap_action: { action: fly-to } }
          - { id: earth, polar: [42, 250], object: earth_orbit, marker: dot, label: EARTH, style: minor, tap_action: { action: fly-to } }
          - { id: mars, polar: [56, 320], object: mars_orbit, marker: dot, label: MARS, style: minor, tap_action: { action: fly-to } }
          - id: jupiter
            polar: [82, 100]
            object: jupiter_orbit
            marker: dot
            label: JUPITER
            style: minor
            tap_action: { action: fly-to }
          - { id: moon, polar: [5, 0], object: moon_orbit, marker: dot, label: LUNA, style: tiny, max_distance: 80 }
        objects:
          - { type: glow, at: sun, size: 40, color: var(--lcars-yellow) }
          - type: sphere
            id: sun_body
            at: sun
            radius: 5
            fill: { color: var(--lcars-yellow) }
            color: var(--lcars-orange)
            line_spacing_deg: 30
          - { type: ring, id: mercury_orbit, radius: 20, spin: 24, width: 1, color: theme:colors.ui.secondary, opacity: 0.6 }
          - { type: sphere, id: mercury_body, at: mercury, radius: 1.2, line_spacing_deg: 30, spin: 15 }
          - { type: ring, id: venus_orbit, radius: 30, spin: 16, width: 1, color: theme:colors.ui.secondary, opacity: 0.6 }
          - { type: sphere, id: venus_body, at: venus, radius: 2, line_spacing_deg: 30, spin: 15 }
          - { type: ring, id: earth_orbit, radius: 42, spin: 10, width: 1, color: theme:colors.ui.secondary, opacity: 0.6 }
          - { type: sphere, id: earth_body, at: earth, radius: 2.4, image: builtin:earth_blue_marble, line_spacing_deg: 30, spin: 20 }
          - { type: ring, id: mars_orbit, radius: 56, spin: 6, width: 1, color: theme:colors.ui.secondary, opacity: 0.6 }
          - { type: sphere, id: mars_body, at: mars, radius: 1.6, line_spacing_deg: 30, spin: 15 }
          - { type: ring, id: jupiter_orbit, radius: 82, spin: 2.5, width: 1, color: theme:colors.ui.secondary, opacity: 0.6 }
          - { type: sphere, id: jupiter_body, at: jupiter, radius: 5, line_spacing_deg: 30, spin: 15 }
          - { type: ring, id: moon_orbit, at: earth, radius: 5, spin: 40, width: 1, dash: [3, 3], opacity: 0.6 }
          - { type: sphere, id: moon_body, at: moon, radius: 0.6, line_spacing_deg: 45 }
        camera:
          view: system
          views:
            system: { target: sun, yaw: 20, tilt: 40, distance: 230 }
            top: { target: sun, tilt: 90, distance: 250 }
            earth: { target: earth, yaw: 30, tilt: 20, distance: 22 }
        backdrop: { stars: { count: 2000 } }
        grid_options: { columns: full }
      - type: custom:lcards-button
        preset: lozenge
        text: { name: { content: OVERVIEW, show: true } }
        tap_action: { action: fly-to, card: astro_starters_5, view: overview }
        grid_options: { columns: 8, rows: 1 }
      - type: custom:lcards-button
        preset: lozenge
        text: { name: { content: TOP, show: true } }
        tap_action: { action: fly-to, card: astro_starters_5, view: top }
        grid_options: { columns: 8, rows: 1 }
      - type: custom:lcards-button
        preset: lozenge
        text: { name: { content: SOL, show: true } }
        tap_action: { action: fly-to, card: astro_starters_5, view: sol }
        grid_options: { columns: 8, rows: 1 }
      - type: custom:lcards-astrometrics-card
        id: astro_starters_5
        height: 650
        points:
          - { id: federation, polar: [60, 165], alt: 14, label: UNITED FEDERATION OF PLANETS, style: major, color: var(--lcars-blue) }
          - { id: klingon, polar: [80, 45], alt: 14, label: KLINGON EMPIRE, style: major, color: var(--lcars-red) }
          - { id: romulan, polar: [90, 320], alt: 14, label: ROMULAN STAR EMPIRE, style: major, color: var(--lcars-green) }
          - { id: cardassian, polar: [85, 235], alt: 14, label: CARDASSIAN UNION, style: major, color: var(--lcars-orange) }
          - { id: earth, polar: [45, 170], marker: reticle, label: Earth, tap_action: { action: fly-to, view: sol } }
          - { id: vulcan, polar: [52, 150], marker: dot, label: Vulcan, style: tiny }
          - { id: qonos, polar: [80, 40], marker: diamond, label: Qo'noS }
          - { id: romulus, polar: [95, 325], marker: diamond, label: Romulus }
          - { id: cardassia, polar: [90, 230], marker: diamond, label: Cardassia Prime }
          - { id: neutral_zone, polar: [60, 330], label: NEUTRAL ZONE, style: tiny, color: var(--lcars-green) }
        objects:
          - type: grid
            shape: disc
            radius: 130
            pattern: polar
            line_spacing: 10
            spoke_count: 36
            major: { row_interval: 3 }
            opacity: 0.6
          - { type: ring, radius: 130, width: 2, color: theme:colors.ui.secondary }
          - type: volume
            id: federation_space
            shape: sector
            radius: [25, 75]
            angle: [130, 200]
            height: [-4, 6]
            color: var(--lcars-blue)
            tap_action: { action: fly-to }
          - type: volume
            id: klingon_space
            shape: sector
            radius: [50, 110]
            angle: [15, 75]
            height: [-4, 6]
            color: var(--lcars-red)
            tap_action: { action: fly-to }
          - type: volume
            id: romulan_space
            shape: sector
            radius: [65, 120]
            angle: [295, 350]
            height: [-4, 6]
            color: var(--lcars-green)
            tap_action: { action: fly-to }
          - type: volume
            id: cardassian_space
            shape: sector
            radius: [60, 115]
            angle: [210, 255]
            height: [-4, 6]
            color: var(--lcars-orange)
            tap_action: { action: fly-to }
          - { type: ring, radius: 62, arc: [295, 350], width: 2, dash: [6, 4], color: var(--lcars-green) }
          - { type: path, points: [earth, qonos], arc: 10, dash: { pattern: [6, 4], speed: 20 }, color: var(--lcars-orange) }
          - { type: glow, at: [0, 0, 0], size: 40, opacity: 0.6 }
        camera:
          view: overview
          views:
            overview: { target: [0, 0, -10], yaw: 200, tilt: 50, distance: 350 }
            top: { target: [0, 0, 0], tilt: 90, distance: 300, projection: orthographic }
            sol: { target: earth, yaw: 220, tilt: 35, distance: 80 }
        backdrop: { stars: { count: 1500 } }
        grid_options: { columns: full }
      - type: custom:lcards-button
        preset: lozenge
        text: { name: { content: APPROACH, show: true } }
        tap_action: { action: fly-to, card: astro_starters_6, view: approach }
        grid_options: { columns: 8, rows: 1 }
      - type: custom:lcards-button
        preset: lozenge
        text: { name: { content: STARBASE, show: true } }
        tap_action: { action: fly-to, card: astro_starters_6, view: starbase }
        grid_options: { columns: 8, rows: 1 }
      - type: custom:lcards-button
        preset: lozenge
        text: { name: { content: SHIP, show: true } }
        tap_action: { action: fly-to, card: astro_starters_6, view: ship }
        grid_options: { columns: 8, rows: 1 }
      - type: custom:lcards-astrometrics-card
        id: astro_starters_6
        height: 650
        points:
          - { id: ship_centre, xyz: [0, 20, 90] }
          - id: ship_name
            at: ship_centre
            offset: [0, 22, 0]
            label: USS ENTERPRISE
            style: major
            tap_action: { action: fly-to, view: ship }
          - { id: bridge, object: ship, part: bridge, marker: dot, label: BRIDGE, style: tiny }
          - { id: port, object: ship, part: nacelle_port, marker: dot, label: PORT NACELLE, style: tiny }
          - { id: starboard, object: ship, part: nacelle_starboard, marker: dot, label: STARBOARD NACELLE, style: tiny }
          - id: dock
            xyz: [0, 20, -40]
            marker: reticle
            label: SPACEDOCK
            style: major
            tap_action: { action: fly-to, view: starbase }
        objects:
          - type: model
            id: ship
            src: builtin:constitution
            at: ship_centre
            size: 50
            rotation: [0, 180, 0]
            scan: { period: 6 }
            animation: all
          - type: grid
            id: starbase_dome
            shape: sphere
            at: [0, 20, -40]
            radius: 45
            pattern: both
            line_spacing_deg: 15
            color: theme:colors.ui.secondary
            opacity: 0.7
          - { type: grid, id: starbase_stem, shape: cylinder, at: [0, -50, -40], radius: 8, height: 50, pattern: both, line_spacing: 6 }
          - { type: path, points: [ship_centre, dock], dash: { pattern: [4, 6], speed: -30 }, color: var(--lcars-orange) }
          - { type: grid, shape: plane, size: [300, 300], line_spacing: 20, at: [0, -60, 0], opacity: 0.25 }
        camera:
          view: approach
          views:
            approach: { target: [0, 15, 25], yaw: 125, tilt: 18, distance: 230 }
            starbase: { target: dock, yaw: 200, tilt: 25, distance: 160 }
            ship: { target: ship_centre, yaw: 140, tilt: 25, distance: 90 }
        backdrop: { stars: { count: 2000 } }
        grid_options: { columns: full }
      - type: custom:lcards-astrometrics-card
        height: 650
        points:
          - { id: star, xyz: [0, 0, 0], label: STAR, style: major }
          - id: kronos_body
            polar: [35, 0]
            object: kronos_orbit
            marker: dot
            label: KRONOS
            style: minor
            tap_action: { action: fly-to }
          - { id: kronos_moon1, polar: [6, 0], object: kronos_moon1_orbit, marker: dot, label: MOON1, style: tiny, max_distance: 120 }
          - { id: belt_label, at: star, offset: [0, 0, -68], label: ASTEROID BELT, style: tiny }
          - { id: zone_a, at: star, offset: [53.7, 16, -93.1], label: TERRITORY A, style: major, color: var(--lcars-blue) }
          - { id: zone_b, at: star, offset: [105.9, 16, 18.7], label: TERRITORY B, style: major, color: var(--lcars-red) }
          - { id: zone_c, at: star, offset: [18.7, 16, 105.9], label: TERRITORY C, style: major, color: var(--lcars-green) }
          - { id: veil_centre, xyz: [-70, 20, -150] }
          - { id: veil_heart, at: veil_centre, label: NEBULA, style: major }
        objects:
          - { type: glow, at: star, size: 30 }
          - { type: sphere, at: star, radius: 6, color: var(--lcars-yellow) }
          - { type: ring, id: kronos_orbit, at: star, radius: 35, spin: 5, width: 1, color: theme:colors.ui.secondary, opacity: 0.6 }
          - { type: sphere, id: kronos_globe, at: kronos_body, radius: 3, line_spacing_deg: 30, spin: 15 }
          - { type: ring, id: kronos_moon1_orbit, at: kronos_body, radius: 6, spin: 36, width: 1, dash: [3, 3], opacity: 0.5 }
          - { type: sphere, id: kronos_moon1_globe, at: kronos_moon1, radius: 0.75, line_spacing_deg: 45 }
          - type: ring
            id: belt_ring1
            at: star
            radius: 56
            spin: 3
            width: 2
            dash: [1, 5]
            color: var(--lcars-tangerine)
            opacity: 0.7
          - type: ring
            id: belt_ring2
            at: star
            radius: 58.4
            spin: 3.7
            width: 3
            dash: [1, 7]
            color: var(--lcars-tangerine)
            opacity: 0.7
          - type: ring
            id: belt_ring3
            at: star
            radius: 60.8
            spin: 4.4
            width: 2
            dash: [1, 9]
            color: var(--lcars-tangerine)
            opacity: 0.7
          - type: ring
            id: belt_ring4
            at: star
            radius: 62.8
            spin: 5.1
            width: 3
            dash: [1, 11]
            color: var(--lcars-tangerine)
            opacity: 0.7
          - type: ring
            id: belt_ring5
            at: star
            radius: 64
            spin: 5.8
            width: 2
            dash: [1, 13]
            color: var(--lcars-tangerine)
            opacity: 0.7
          - type: volume
            id: zone_a_space
            at: star
            shape: sector
            radius: [85, 130]
            angle: [0, 60]
            height: [-4, 10]
            cells: { ring: 10, angle: 10, layer: 7 }
            color: var(--lcars-blue)
            tap_action: { action: fly-to }
          - type: volume
            id: zone_b_space
            at: star
            shape: sector
            radius: [85, 130]
            angle: [70, 130]
            height: [-4, 10]
            cells: { ring: 10, angle: 10, layer: 7 }
            color: var(--lcars-red)
            tap_action: { action: fly-to }
          - type: volume
            id: zone_c_space
            at: star
            shape: sector
            radius: [85, 130]
            angle: [140, 200]
            height: [-4, 10]
            cells: { ring: 10, angle: 10, layer: 7 }
            color: var(--lcars-green)
            tap_action: { action: fly-to }
          - { type: nebula, id: veil_clouds, at: veil_heart, radius: 45, count: 10, seed: 7, drift: 0.5 }
          - type: nebula
            id: veil_veil
            at: veil_heart
            radius: 27
            count: 6
            seed: 23
            drift: 0.8
            colors: [var(--lcars-violet), var(--lcars-blue)]
          - { type: glow, id: veil_glow, at: veil_heart, size: 22.5, opacity: 0.7 }
        camera: { views: { system: { target: star, yaw: 30, tilt: 40, distance: 330 } } }
        backdrop: { stars: { count: 1500 } }
        grid_options: { columns: full }
