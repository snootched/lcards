# Astrometrics at true scale (E10 part 1): the inner solar system in km,
# real sizes and distances. Fly from the system to Earth to Deep Space 9.
title: Astrometrics true scale
path: astro-true-scale
type: sections
max_columns: 4
sections:
  - type: grid
    column_span: 4
    cards:
      - type: custom:lcards-astrometrics-card
        height: 480
        camera:
          view: system
          buttons: true
          fly_duration: 4000
          views:
            system: { target: sun, yaw: 40, tilt: 35, distance: 700000000 }
            earth: { target: earth, yaw: 225, tilt: 12, distance: 70000 }
            station: { target: ds9, yaw: 330, tilt: 6, distance: 4 }
        backdrop:
          stars: { count: 2000 }
        points:
          - { id: sun, xyz: [ 0, 0, 0 ], label: SOL, style: major }
          - { id: mercury, polar: [ 57909050, 200 ], marker: dot, label: MERCURY, style: tiny }
          - { id: venus, polar: [ 108208000, 120 ], marker: dot, label: VENUS, style: tiny }
          - { id: earth, polar: [ 149597870.7, 30 ], marker: dot, label: EARTH, style: minor, tap_action: { action: fly-to, view: earth } }
          - { id: mars, polar: [ 227939200, 320 ], marker: dot, label: MARS, style: tiny }
          - { id: moon, at: earth, offset: [ -360000, 20000, -140000 ], label: LUNA, style: tiny, max_distance: 20000000 }
          - { id: ds9, at: earth, offset: [ -21082, 0, 36515 ], label: DEEP SPACE 9, style: tiny, max_distance: 3000000, tap_action: { action: fly-to, view: station } }
        objects:
          - { type: glow, at: sun, size: 9000000, color: var(--lcars-yellow) }
          - { type: sphere, at: sun, radius: 696340, fill_color: var(--lcars-yellow), color: var(--lcars-orange) }
          - { type: ring, radius: 57909050, width: 1, opacity: 0.5 }
          - { type: ring, radius: 108208000, width: 1, opacity: 0.5 }
          - { type: ring, radius: 149597870.7, width: 1, color: var(--lcars-blue), opacity: 0.7 }
          - { type: ring, radius: 227939200, width: 1, opacity: 0.5 }
          - { type: sphere, at: mercury, radius: 2440, image: builtin:mercury_messenger }
          - { type: sphere, at: venus, radius: 6052, fill_effect: { preset: clouds } }
          - { type: sphere, at: earth, radius: 6371, image: builtin:earth_blue_marble, spin: 2 }
          - { type: sphere, at: mars, radius: 3390, image: builtin:mars_viking }
          - { type: sphere, at: moon, radius: 1737, image: builtin:moon_lroc }
          - { type: model, at: ds9, src: builtin:deep_space_nine, size: 1.452, material: original }
