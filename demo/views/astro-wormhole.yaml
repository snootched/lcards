# Astrometrics wormhole (W1): the Bajoran wormhole starter (scene bajoran_wormhole) with power bound to
# input_number.lcards_test_power and the look to input_select.lcards_test_look. Diagram: the entrance,
# the pipeline (tube lines), the CTL regions, the singularities and the membrane; realistic: the swirl mouth.
title: Astrometrics wormhole
path: astro-wormhole
type: sections
max_columns: 4
sections:
  - type: grid
    column_span: 4
    cards:
      - type: custom:lcards-button
        preset: lozenge
        text:
          name: {content: OVERVIEW, show: true}
        tap_action:
          action: fly-to
          card: astro_wormhole
          view: overview
        grid_options:
          columns: 9
          rows: 1
      - type: custom:lcards-button
        preset: lozenge
        text:
          name: {content: MOUTH, show: true}
        tap_action:
          action: fly-to
          card: astro_wormhole
          view: mouth
        grid_options:
          columns: 9
          rows: 1
      - type: custom:lcards-button
        preset: lozenge
        text:
          name: {content: INSIDE, show: true}
        tap_action:
          action: fly-to
          card: astro_wormhole
          view: inside
        grid_options:
          columns: 9
          rows: 1
      - type: custom:lcards-button
        preset: lozenge
        text:
          name: {content: MEMBRANE, show: true}
        tap_action:
          action: fly-to
          card: astro_wormhole
          view: membrane
        grid_options:
          columns: 9
          rows: 1
      - type: custom:lcards-slider
        entity: input_number.lcards_test_power
        preset: shaped-horizontal
        component: shaped
        text:
          name: {content: POWER}
        style:
          shaped: {text_bands: {left: {size: 110}}}
        min_height: 0
        grid_options:
          columns: 18
          rows: 1
      - type: custom:lcards-select-menu
        entity: input_select.lcards_test_look
        preset: toggle-tab
        grid:
          columns: 3
        min_height: 0
        grid_options:
          columns: 18
          rows: 1
