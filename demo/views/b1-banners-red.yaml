# Generated by scripts/banner/make-concepts.py: edit the script, not this file.
title: B1 banners red
path: b1-banners-red
theme: LCARS Picard [LCARdS Red Accent]
type: custom:lcards-layout-view
layout:
  padding: 16px
  grid-gap: 16px
  grid-template-columns: 1200px
  grid-template-rows: repeat(4, 300px)
cards:
- type: custom:lcards-layout-card
  layout:
    height: 300px
    grid-gap: 0px
    grid-template-columns: 110px minmax(0, 1fr)
    grid-template-rows: 20px 260px 20px
    grid-template-areas: '". ."

      ". scene"

      ". ."

      '
  cards:
  - type: custom:lcards-astrometrics-card
    view_layout:
      grid-area: scene
    id: banner_badlands_a
    height: 260
    camera:
      view: banner
      buttons: false
      controls: false
      auto_rotate: 0
      views:
        banner:
          target:
          - -260
          - 0
          - 0
          yaw: 25
          tilt: 7
          distance: 520
    backdrop:
      stars:
        count: 3000
      dust:
        count: 3000
        opacity: 0.5
        colors:
        - var(--lcards-moonlight)
        - var(--lcars-ice)
    background_animation:
    - preset: nebula
      config:
        cloud_count: 7
        colors:
        - var(--lcars-deep-navy)
        - var(--lcars-eggplant)
        - var(--lcars-slate)
        min_opacity: 0.25
        max_opacity: 0.55
        max_radius: 0.6
        seed: 11
        scroll_speed_x: 2
        scroll_speed_y: 0
        volumetric: true
    points: []
    objects:
    - type: nebula
      id: badlands
      at: &id001
      - 0
      - 0
      - 0
      preset: badlands
  - type: custom:lcards-layout-card
    view_layout:
      grid-area: 1 / 1 / 4 / 3
    layout:
      grid-gap: 5px
      grid-template-columns: 190px 340px 6px minmax(0, 1fr) 6px 90px
      grid-template-rows: 20px minmax(0, 1fr) minmax(0, 1fr) 20px
      grid-template-areas: '"corner t1 . t2 . t3"

        "corner title . . . ."

        "fcorner byline . . . ."

        "fcorner b1 . b2 . b3"

        '
    cards:
    - type: custom:lcards-elbow
      view_layout:
        grid-area: corner
      elbow:
        type: header-left
        segment:
          bar_width: 110
          bar_height: 20
          outer_curve: 90
          inner_curve: 40
          color: var(--lcars-ui-primary)
    - type: custom:lcards-elbow
      view_layout:
        grid-area: fcorner
      elbow:
        type: footer-left
        segment:
          bar_width: 110
          bar_height: 20
          outer_curve: 90
          inner_curve: 40
          color: var(--lcars-ui-primary)
    - type: custom:lcards-button
      view_layout:
        grid-area: t1
      preset: panel-light
      min_height: 0
      interactive: false
      text:
        label:
          show: false
      style:
        card:
          color:
            background:
              default: var(--lcars-ui-primary)
    - type: custom:lcards-button
      view_layout:
        grid-area: t2
      preset: panel-light
      min_height: 0
      interactive: false
      text:
        label:
          show: false
      style:
        card:
          color:
            background:
              default: var(--lcars-card-bottom-color)
    - type: custom:lcards-button
      view_layout:
        grid-area: t3
      preset: panel-light
      min_height: 0
      interactive: false
      text:
        label:
          show: false
      style:
        card:
          color:
            background:
              default: var(--lcars-ui-accent-color)
    - type: custom:lcards-button
      view_layout:
        grid-area: b1
      preset: panel-light
      min_height: 0
      interactive: false
      text:
        label:
          show: false
      style:
        card:
          color:
            background:
              default: var(--lcars-ui-primary)
    - type: custom:lcards-button
      view_layout:
        grid-area: b2
      preset: panel-light
      min_height: 0
      interactive: false
      text:
        label:
          content: lcards.unimatrix01.ca
          show: true
          position: center-right
          text_transform: none
          font_size: 16
          color: var(--lcars-ui-tertiary)
      style:
        card:
          color:
            background:
              default: var(--lcars-card-bottom-color)
    - type: custom:lcards-button
      view_layout:
        grid-area: b3
      preset: panel-light
      min_height: 0
      interactive: false
      text:
        label:
          show: false
