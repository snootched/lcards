# Bench: 20 cards (C2). Rescued from reports/c2-review/c2.yaml.
title: "Bench: 20 cards"
path: bench-20
type: sections
max_columns: 4
sections:
  - type: grid
    column_span: 4
    cards:
      - type: custom:lcards-elbow
