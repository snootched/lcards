# Bench: 500 stars, shader (C2). Rescued from reports/c2-review/c2.yaml.
title: "Bench: 500 stars, shader"
path: bench-stars-500-shader
type: sections
max_columns: 4
sections:
  - type: grid
    column_span: 4
    cards:
      - type: custom:lcards-elbow
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - { preset: warp-starfield, config: { count: 500, speed: 2 } }
        text: { label: { content: "500 STARS, SHADER", show: true, color: var(--lcards-blue) } }
        grid_options: { columns: 12, rows: 6 }
