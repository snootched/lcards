# Grid surfaces (C4). Rescued from reports/c2-review/c4.yaml.
title: Grid surfaces
path: grid-surfaces
type: sections
max_columns: 4
sections:
  - type: grid
    column_span: 4
    cards:
      - type: custom:lcards-button
        preset: lozenge
        text: { name: { content: RED ALERT, show: true } }
        tap_action: { action: perform-action, perform_action: lcards.red_alert }
        grid_options: { columns: 8, rows: 1 }
      - type: custom:lcards-button
        preset: lozenge
        text: { name: { content: YELLOW ALERT, show: true } }
        tap_action: { action: perform-action, perform_action: lcards.yellow_alert }
        grid_options: { columns: 8, rows: 1 }
      - type: custom:lcards-button
        preset: lozenge
        text: { name: { content: CLEAR, show: true } }
        tap_action: { action: perform-action, perform_action: lcards.clear_alert }
        grid_options: { columns: 8, rows: 1 }
      - type: custom:lcards-slider
        entity: input_number.lcards_test_value
        grid_options: { columns: 8, rows: 1 }
  - type: grid
    column_span: 4
    cards:
      - type: custom:lcards-elbow
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - preset: grid
              config:
                surface: cylinder
                color: var(--lcards-orange)
                major_row_interval: 3
                color_major: var(--lcards-moonlight)
                line_width_major: 2
        text: { label: { content: 1 CYLINDER, show: true, color: var(--lcards-blue) } }
        grid_options: { columns: 6, rows: 5 }
      - type: custom:lcards-elbow
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - preset: grid
              config:
                surface: cylinder
                surface_axis: horizontal
                surface_length: 0.8
                color: var(--lcards-orange)
        text:
          label: { content: 2 CYLINDER HORIZONTAL (ROLLS), show: true, color: var(--lcards-blue) }
        grid_options: { columns: 6, rows: 5 }
      - type: custom:lcards-elbow
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - preset: grid-hexagonal
              config: { surface: cylinder, surface_size: 1, surface_length: 0.8 }
        text: { label: { content: 3 CYLINDER HEXAGONAL, show: true, color: var(--lcards-blue) } }
        grid_options: { columns: 6, rows: 5 }
      - type: custom:lcards-elbow
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - preset: grid
              config:
                surface: cylinder
                pattern: dots
                dot_radius: 2
                color: var(--lcards-orange)
                scan_period: 4
                line_spacing: 25
        text: { label: { content: 4 CYLINDER DOTS + SCAN, show: true, color: var(--lcards-blue) } }
        grid_options: { columns: 6, rows: 5 }
      - type: custom:lcards-elbow
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - preset: grid
              config:
                surface: sphere
                surface_size: 0.9
                color: "var(--lcards-blue-light, #99ccff)"
                major_row_interval: 3
                major_col_interval: 3
                color_major: var(--lcards-moonlight)
                line_width_major: 2
                camera_tilt: 25
        text: { label: { content: 5 SPHERE, show: true, color: var(--lcards-blue) } }
        grid_options: { columns: 6, rows: 5 }
      - type: custom:lcards-elbow
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - preset: grid
              config:
                surface: dome
                surface_size: 1
                color: "var(--lcards-blue-light, #99ccff)"
                line_spacing: 30
                camera_tilt: 25
        text: { label: { content: 6 DOME, show: true, color: var(--lcards-blue) } }
        grid_options: { columns: 6, rows: 5 }
      - type: custom:lcards-elbow
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - preset: grid
              config:
                surface: dome
                surface_axis: horizontal
                surface_size: 1.1
                color: "var(--lcards-blue-light, #99ccff)"
                line_spacing: 25
                scroll_speed_x: 10
                scan_period: 5
        text:
          label: { content: 7 DOME FACING (POLAR CHART), show: true, color: var(--lcards-blue) }
        grid_options: { columns: 6, rows: 5 }
      - type: custom:lcards-elbow
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - preset: grid
              config:
                surface: cylinder
                surface_length: 0
                color: var(--lcards-orange)
                camera_tilt: 40
                camera_yaw: 20
                back_opacity: 0.4
        text:
          label: { content: "8 CYLINDER UNBOUNDED, TILTED", show: true, color: var(--lcards-blue) }
        grid_options: { columns: 6, rows: 5 }
