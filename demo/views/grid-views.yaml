# Grid views and camera (C3). Rescued from reports/c2-review/c3.yaml.
title: Grid views and camera
path: grid-views
type: sections
max_columns: 4
sections:
  - type: grid
    column_span: 4
    cards:
      - type: custom:lcards-slider
        entity: input_number.lcards_test_value
        preset: shaped-horizontal
        component: shaped
        text: { name: { content: LINE WIDTH } }
        style: { shaped: { text_bands: { left: { size: 120 } } } }
        grid_options: { columns: 16, rows: 1 }
      - type: custom:lcards-slider
        entity: input_number.lcards_test_power
        preset: shaped-horizontal
        component: shaped
        text: { name: { content: CAMERA } }
        style: { shaped: { text_bands: { left: { size: 120 } } } }
        grid_options: { columns: 16, rows: 1 }
  - type: grid
    column_span: 4
    cards:
      - type: custom:lcards-elbow
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - preset: grid
              config:
                color: var(--lcards-orange)
                line_spacing: 30
                major_row_interval: 4
                major_col_interval: 4
                color_major: var(--lcards-moonlight)
                line_width_major: 3
        text: { label: { content: 1 GRID MAJORS, show: true, color: var(--lcards-blue) } }
        grid_options: { columns: 6, rows: 4 }
      - type: custom:lcards-elbow
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - { preset: grid-hexagonal, config: { hex_radius: 25 } }
        text: { label: { content: 2 HEX, show: true, color: var(--lcards-blue) } }
        grid_options: { columns: 6, rows: 4 }
      - type: custom:lcards-elbow
        entity: input_number.lcards_test_value
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - { preset: grid, config: { line_width: { map_range: { input: [ 0, 100 ], output: [ 0.5, 4 ] } }, view: floor, color: var(--lcards-orange) } }
        text: { label: { content: "3 FLOOR · LINE WIDTH", show: true, color: var(--lcards-blue) } }
        grid_options: { columns: 12, rows: 4 }
      - type: custom:lcards-elbow
        entity: input_number.lcards_test_value
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - preset: grid
              config:
                view: floor
                color: var(--lcards-orange)
                line_width: { map_range: { input: [ 0, 100 ], output: [ 0.5, 4 ] } }
                major_row_interval: 4
                major_col_interval: 4
                color_major: var(--lcards-moonlight)
                line_width_major: 3
        text:
          label: { content: "4 FLOOR, MAJORS 3 PX · LINE WIDTH", show: true, color: var(--lcards-blue) }
        grid_options: { columns: 12, rows: 4 }
      - type: custom:lcards-elbow
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - preset: grid
              config: { color: var(--lcards-orange), line_width: 2, scroll_speed_x: 0, scroll_speed_y: 20 }
        text:
          label: { content: "5 TAP: TIP FLAT INTO FLOOR AND BACK", show: true, color: var(--lcards-blue) }
        grid_options: { columns: 12, rows: 4 }
        tap_action: { action: none }
        animations:
          - trigger: on_tap
            target: background
            preset: custom
            params: { camera_tilt: [ 90, 10 ], duration: 2500, ease: inOutSine, alternate: true, loop: 1 }
      - type: custom:lcards-elbow
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - preset: grid
              config: { view: floor, color: var(--lcards-orange), line_width: 1.5, camera_tilt: 25 }
        text:
          label: { content: "6 FLOOR, YAW SWEEP (ANIMATION)", show: true, color: var(--lcards-blue) }
        grid_options: { columns: 12, rows: 4 }
        animations:
          - trigger: on_load
            target: background
            preset: custom
            params: { camera_yaw: [ -30, 30 ], duration: 8000, ease: inOutSine, alternate: true, loop: true }
      - type: custom:lcards-elbow
        entity: input_number.lcards_test_value
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - { preset: grid-hexagonal, config: { view: floor, line_width_minor: { map_range: { input: [ 0, 100 ], output: [ 0.5, 4 ] } }, hex_radius: 30 } }
        text: { label: { content: 7 HEX FLOOR · LINE WIDTH, show: true, color: var(--lcards-blue) } }
        grid_options: { columns: 6, rows: 4 }
      - type: custom:lcards-elbow
        entity: input_number.lcards_test_power
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - preset: grid-diagonal
              config: { camera_tilt: { map_range: { input: [ 0, 100 ], output: [ 5, 85 ] } }, view: floor, scan_period: 0, line_width: 2, color: var(--lcards-orange) }
        text: { label: { content: "8 DIAGONAL FLOOR, NO SCAN · CAMERA", show: true, color: var(--lcards-blue) } }
        grid_options: { columns: 6, rows: 4 }
      - type: custom:lcards-elbow
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - { preset: holo-sphere, config: { line_width: 2.5 } }
        text:
          label: { content: 9 SPHERE LINE WIDTH 2.5, show: true, color: var(--lcards-blue) }
        grid_options: { columns: 6, rows: 4 }
      - type: custom:lcards-elbow
        entity: input_number.lcards_test_power
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - preset: warp-starfield
              transition: 1200
              config:
                count: 1200
                speed: 4
                camera_yaw: { map_range: { input: [ 0, 100 ], output: [ -35, 35 ] } }
                camera_tilt: { map_range: { input: [ 0, 100 ], output: [ 10, -10 ] } }
        text:
          label: { content: "10 WARP · CAMERA BANKS IT", show: true, color: var(--lcards-blue) }
        grid_options: { columns: 12, rows: 4 }
