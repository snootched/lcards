# MSD leader lines (2026-11-12): labels joined to their parts the canon way, for
# review in Home Assistant before the gallery MSDs are reworked
# (reports/msd-leader-lines-plan.md). Before, the Picard and classic patterns
# examples, and the angled and bracket variants on a bare card.
title: MSD leader lines
path: msd-leader-lines
type: sections
max_columns: 4
sections:
  - type: grid
    column_span: 4
    cards:
      - type: custom:lcards-button
        preset: text-only
        min_height: 0
        text:
          label:
            content: "BEFORE: TOP AND BOTTOM EXITS, SQUARE CORNERS"
            show: true
            position: center-left
            font_size: 16
            color: theme:colors.ui.primary
        grid_options:
          columns: 24
          rows: 1
      - type: custom:lcards-msd-card
        msd:
          base_svg:
            source: builtin:enterprise-d-shuttlecraft15-anomaly
            filters:
              - mode: css
                type: grayscale
                value: 1
              - mode: css
                type: opacity
                value: 0.55
          view_box:
            - -40
            - -110
            - 1123
            - 720
          overlays:
            # a label in the top margin, joined to the fuel tanks
            - id: lbl-tanks
              type: control
              attachment: top-left
              position:
                - 150
                - -100
              size:
                - 190
                - 22
              card:
                type: custom:lcards-button
                preset: text-only
                min_height: 0
                text:
                  label:
                    content: DEUTERIUM 1-3
                    show: true
                    position: center-left
                    font_size: 13
                    color: theme:colors.ui.secondary
            - id: ln-tanks
              type: line
              anchor: lbl-tanks
              attach_to:
                - 281
                - 60
              anchor_side: bottom
              attach_side: center
              route: manhattan
              style:
                color: var(--lcars-card-top-color, var(--lcards-gray-medium))
                width: 1.5
            # the fault, in the accent, below the drawing
            - id: lbl-cargo
              type: control
              attachment: top-left
              position:
                - 330
                - 530
              size:
                - 190
                - 22
              card:
                type: custom:lcards-button
                preset: text-only
                min_height: 0
                text:
                  label:
                    content: CARGO 4 · SEAL FAULT
                    show: true
                    position: center-left
                    font_size: 13
                    color: theme:colors.ui.tertiary
            - id: ln-cargo
              type: line
              anchor: lbl-cargo
              attach_to:
                - 300
                - 413
              anchor_side: top
              attach_side: center
              route: manhattan
              style:
                color: theme:colors.ui.tertiary
                width: 1.5
        grid_options:
          columns: 24
          rows: 14
