# MSD line art (C2, 2026-11-14): builtin:galaxy-class-lineart, drawn from the built-in
# Galaxy class model by scripts/make-msd-lineart.mjs. The drawing alone, then labels made
# with the MSD Studio Quick label rules (size XS, for a full-width card) joined to its
# named anchors in two leader styles.
title: MSD line art
path: msd-lineart
type: sections
max_columns: 4
sections:
  - type: grid
    column_span: 4
    cards:
      - type: custom:lcards-button
        preset: text-only
        min_height: 0
        text:
          label:
            content: 'THE DRAWING: OUTLINE, DECKS, WARP CORE, NACELLE COILS'
            show: true
            position: center-left
            font_size: 16
            color: theme:colors.ui.primary
        grid_options:
          columns: 24
          rows: 1
      - type: custom:lcards-msd-card
        msd:
          base_svg:
            source: builtin:galaxy-class-lineart
        grid_options:
          columns: full
          rows: 6
      - type: custom:lcards-button
        preset: text-only
        min_height: 0
        text:
          label:
            content: 'PICARD TIGHT LABELS ON ITS NAMED PARTS (QUICK LABEL SIZE XS: A FULL-WIDTH CARD)'
            show: true
            position: center-left
            font_size: 16
            color: theme:colors.ui.primary
        grid_options:
          columns: 24
          rows: 1
      - type: custom:lcards-msd-card
