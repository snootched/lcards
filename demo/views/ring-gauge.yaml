# Ring gauge (slider component: ring). Seeded from the docs examples.
title: Ring gauge
path: ring-gauge
type: sections
max_columns: 4
sections:
  - type: grid
    column_span: 4
    cards:
      - type: custom:lcards-slider
        entity: input_number.lcards_test_value
        preset: ring
        grid_options: { columns: 12, rows: 4 }
      - type: custom:lcards-slider
        entity: input_number.lcards_test_value
        preset: picard-ring
        grid_options: { columns: 12, rows: 4 }
        text: { name: { content: Zone N } }
        style:
          ring:
            scale:
              tick_marks: { major: { interval: 20 }, minor: { interval: 5 } }
              labels: { show_unit: false }
          ranges:
            - { min: 80, max: 100, color: theme:colors.status.error }
      - type: custom:lcards-slider
        entity: input_number.lcards_test_temperature
        preset: ring
        grid_options: { columns: 12, rows: 4 }
        text: { name: { content: SET POINT } }
        style:
          ring: { scale: { tick_marks: { major: { interval: 5 } }, labels: {} } }
          ranges:
            # NOW follows the test value, mapped from 0-100 onto the 10-35 °C scale.
            - value: "[[[ return 10 + Number(states['input_number.lcards_test_value'].state) / 4 ]]]"
              indicator: { type: triangle, color: theme:colors.status.success }
              label: { text: NOW }
      - type: custom:lcards-slider
        entity: input_number.lcards_test_value
        preset: ring
        grid_options: { columns: 12, rows: 4 }
        style: { ring: { start_angle: -90, end_angle: 90, thickness: 20% } }
        text: { name: { zone: sublabel, position: top } }
      - type: custom:lcards-slider
        entity: input_number.lcards_test_value
        preset: shaped-horizontal
        component: shaped
        text: { name: { content: TEST VALUE } }
        style: { shaped: { text_bands: { left: { size: 120 } } } }
        grid_options: { columns: full, rows: 1 }
