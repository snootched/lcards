# Classic bracket ratios (review, 2026-11-16): the controls section's bracket built in
# pieces (a top sweep with the title in its bar, a break, a side bar, a break, a foot
# sweep), as the demo board's own frames. A is the default; B to D vary the side and bars;
# E and F the padding and header gap. Generated by tmp/bracket-review.mjs.
title: Bracket ratios
path: section-bracket-ratios
type: sections
max_columns: 3
sections:
  - type: grid
    demo_frame: false
    cards:
      - type: custom:lcards-layout-card
        layout:
          padding: 0
          card_margin: 0
          margin: 0
          grid-gap: 0px
          grid-template-columns: 72px 18px minmax(0, 1fr) 6px minmax(0, 1fr)
          grid-template-rows: 28px 18px minmax(0, 1fr) 6px minmax(0, 1fr) 18px 14px
        cards:
          - type: custom:lcards-elbow
            min_height: 0
            elbow:
              type: header-left
              segment:
                bar_width: 72
                bar_height: 28
                outer_curve: 46
                inner_curve: 18
                color: theme:colors.ui.primary
            view_layout:
              grid-column: 1 / -1
              grid-row: 1 / 3
            text:
              label:
                content: A DEFAULT 72 / 28 / 14
                show: true
                zone: horizontal_bar
                position: center-right
                font_size_percent: 100
                cap_height_ratio: 0.86
                padding:
                  top: 0
                  bottom: 0
                  left: 8
                  right: 24
                font_weight: 100
                text_transform: uppercase
                color: 'var(--lcards-yellow, #FFCC99)'
                background:
                  default: black
                background_padding: 8
                background_radius: 0
                fit: true
          - type: custom:lcards-layout-card
            layout:
              padding: 0
              card_margin: 0
              margin: 0
              grid-gap: 0px
              grid-template-columns: minmax(0, 1fr)
              grid-template-rows: 6px minmax(0, 1fr) 6px
            cards:
              - type: custom:lcards-button
                preset: panel-light
                min_height: 0
                interactive: false
                text:
                  label:
                    show: false
                style:
                  card:
                    color:
                      background:
                        default: theme:colors.ui.primary
                view_layout:
                  grid-column: '1'
                  grid-row: '2'
            view_layout:
              grid-column: '1'
              grid-row: 3 / 6
          - type: custom:lcards-elbow
            min_height: 0
            elbow:
              type: footer-left
              segment:
                bar_width: 72
                bar_height: 14
                outer_curve: 32
                inner_curve: 18
                color: theme:colors.ui.primary
            view_layout:
              grid-column: 1 / -1
              grid-row: 6 / 8
          - type: custom:lcards-button
            preset: lozenge
            entity: input_boolean.lcards_test_doors
            min_height: 0
            text:
              label:
                content: DOORS
                show: true
                position: bottom-right
                padding:
                  right: 24
                  bottom: 4
                fit: true
            tap_action:
              action: toggle
            hold_action:
              action: more-info
            view_layout:
              grid-column: '3'
              grid-row: '3'
          - type: custom:lcards-button
            preset: lozenge
