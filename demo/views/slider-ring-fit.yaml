# Slider rings fit their arc: a ring is as large as its arc lets it be in its cell. A half ring
# fills a wide cell (its centre text above the cut), a quarter ring sits in its corner, the
# default three-quarter ring is centred on its own shape, and a full ring fills the smaller side.
# Each follows input_number.lcards_test_power. (A section with column_span: 4 has 48 grid columns.)
title: Slider ring fit
path: slider-ring-fit
type: sections
max_columns: 4
sections:
  - type: grid
    column_span: 4
    cards:
      - type: custom:lcards-slider
        entity: input_number.lcards_test_power
        preset: ring
        text: { name: { content: HALF } }
        style: { ring: { start_angle: -90, end_angle: 90 } }
        grid_options: { columns: 24, rows: 4 }
      - type: custom:lcards-slider
        entity: input_number.lcards_test_power
        preset: ring
        text: { name: { content: QUARTER } }
        style: { ring: { start_angle: 0, end_angle: 90, thickness: 18% } }
        grid_options: { columns: 12, rows: 4 }
      - type: custom:lcards-slider
        entity: input_number.lcards_test_power
        preset: ring
        text: { name: { content: DEFAULT } }
        grid_options: { columns: 12, rows: 5 }
      - type: custom:lcards-slider
        entity: input_number.lcards_test_power
        preset: ring
        text: { name: { content: WIDE DEFAULT } }
        grid_options: { columns: 24, rows: 3 }
      - type: custom:lcards-slider
        entity: input_number.lcards_test_power
        preset: ring
        text: { name: { content: FULL } }
        style: { ring: { start_angle: 0, end_angle: 360 } }
        grid_options: { columns: 12, rows: 5 }
      - type: custom:lcards-slider
        entity: input_number.lcards_test_power
        preset: picard-ring
        text: { name: { content: PICARD HALF } }
        style: { ring: { start_angle: -90, end_angle: 90 } }
        grid_options: { columns: 36, rows: 5 }
