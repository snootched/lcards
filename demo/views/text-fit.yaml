# Text fit (D, 2026-11-15): fit on a text field keeps long text inside its zone:
# shrink, then wrap, then an ellipsis. Each pair: without fit, with fit.
title: Text fit
path: text-fit
type: sections
max_columns: 4
sections:
  - type: grid
    column_span: 4
    cards:
      # a block label: runs out, then fits (shrinks and wraps)
      - type: custom:lcards-button
        preset: panel-light
        min_height: 0
        text:
          label: { content: PRIMARY SYSTEMS DISPLAY, position: center-right, font_size: 20 }
        grid_options: { columns: 3, rows: 1 }
      - type: custom:lcards-button
        preset: panel-light
        min_height: 0
        text:
          label: { content: PRIMARY SYSTEMS DISPLAY, position: center-right, font_size: 20, fit: true }
        grid_options: { columns: 3, rows: 1 }
      # one line only: shrinks to its minimum, then the ellipsis
      - type: custom:lcards-button
        preset: panel-light
        min_height: 0
        text:
          label:
            content: PRIMARY SYSTEMS DISPLAY
            position: center-right
            font_size: 20
            fit: { max_lines: 1, min_font_size: 14 }
        grid_options: { columns: 3, rows: 1 }
      # a lozenge with a long name
      - type: custom:lcards-button
        preset: lozenge
        entity: input_boolean.lcards_test_warp_travel
        text:
          label: { content: WARP TRAVEL AUTHORISATION, show: true, fit: true }
        grid_options: { columns: 8, rows: 1 }
      # picard gauge caps: the long name runs into the next gauge, then fits
      - type: custom:lcards-slider
        preset: picard-gauge-column
        entity: input_number.lcards_test_shields
        text:
          name: { content: SHIELD HARMONICS }
        grid_options: { columns: 3, rows: 5 }
      - type: custom:lcards-slider
        preset: picard-gauge-column
        entity: input_number.lcards_test_shields
        text:
          name: { content: SHIELD HARMONICS, fit: true }
        grid_options: { columns: 3, rows: 5 }
