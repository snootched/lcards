# Warp spectrum (warp-starfield spectrum). Seeded from the docs examples.
title: Warp spectrum
path: warp-spectrum
type: sections
max_columns: 4
sections:
  - type: grid
    column_span: 4
    cards:
      - type: custom:lcards-button
        preset: lozenge
        text: { name: { content: RED ALERT, show: true } }
        tap_action: { action: perform-action, perform_action: lcards.red_alert }
        grid_options: { columns: 8, rows: 1 }
      - type: custom:lcards-button
        preset: lozenge
        text: { name: { content: CLEAR, show: true } }
        tap_action: { action: perform-action, perform_action: lcards.clear_alert }
        grid_options: { columns: 8, rows: 1 }
      - type: custom:lcards-slider
        entity: input_number.lcards_test_value
        preset: shaped-horizontal
        component: shaped
        text: { name: { content: BANK } }
        style: { shaped: { text_bands: { left: { size: 120 } } } }
        grid_options: { columns: 16, rows: 1 }
      - type: custom:lcards-slider
        entity: input_number.lcards_test_power
        preset: shaped-horizontal
        component: shaped
        text: { name: { content: STREAK } }
        style: { shaped: { text_bands: { left: { size: 120 } } } }
        grid_options: { columns: 16, rows: 1 }
  - type: grid
    column_span: 4
    cards:
      - type: custom:lcards-elbow
        entity: input_number.lcards_test_power
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - preset: warp-starfield
              transition: 1500
              config: { speed: 6, streak: { map_range: { input: [ 0, 100 ], output: [ 0, 4 ] } }, seed: 7, spectrum: true, colors: [ "#ffffff" ] }
        text: { label: { content: "1 SPECTRUM, WHITE STARS · STREAK", show: true, color: var(--lcards-blue) } }
        grid_options: { columns: 16, rows: 5 }
      - type: custom:lcards-elbow
        entity: input_number.lcards_test_power
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - preset: warp-starfield
              transition: 1500
              config: { speed: 6, streak: { map_range: { input: [ 0, 100 ], output: [ 0, 4 ] } }, seed: 7, spectrum: true, colors: [ "var(--lcars-orange)", "var(--lcars-blue)", "var(--lcars-violet)" ] }
        text: { label: { content: "2 SPECTRUM, COLOURED STARS · STREAK", show: true, color: var(--lcards-blue) } }
        grid_options: { columns: 16, rows: 5 }
      - type: custom:lcards-elbow
        entity: input_number.lcards_test_power
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - preset: warp-starfield
              transition: 1500
              config:
                speed: 6
                streak: { map_range: { input: [ 0, 100 ], output: [ 0, 4 ] } }
                seed: 7
                spectrum: true
                spectrum_direction: reverse
                colors: [ "#ffffff" ]
        text: { label: { content: 3 SPECTRUM REVERSE · STREAK, show: true, color: var(--lcards-blue) } }
        grid_options: { columns: 16, rows: 5 }
      - type: custom:lcards-elbow
        entity: input_number.lcards_test_power
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - preset: warp-starfield
              transition: 1500
              config: { speed: 6, streak: { map_range: { input: [ 0, 100 ], output: [ 0, 4 ] } }, seed: 7, colors: [ "#ffffff" ] }
        text: { label: { content: 4 SPECTRUM OFF · STREAK, show: true, color: var(--lcards-blue) } }
        grid_options: { columns: 16, rows: 5 }
      - type: custom:lcards-elbow
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - preset: warp-starfield
              transition: 2000
              config:
                speed: "[[[ return states['input_select.lcards_alert_mode']?.state === 'red_alert' ? 8 : 1 ]]]"
                streak: 1.5
                seed: 7
                spectrum: true
                count: 1200
                colors: [ "#ffffff" ]
        text: { label: { content: "5 RED ALERT: WARP 8", show: true, color: var(--lcards-blue) } }
        grid_options: { columns: 16, rows: 5 }
      - type: custom:lcards-elbow
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - preset: warp-starfield
              transition: 1500
              config:
                speed: 4
                streak: 1.5
                seed: 7
                spectrum: true
                camera_yaw:
                  map_range: { entity_id: input_number.lcards_test_value, input: [ 0, 100 ], output: [ -30, 30 ] }
        text: { label: { content: 6 BANKING · BANK, show: true, color: var(--lcards-blue) } }
        grid_options: { columns: 16, rows: 5 }
