# Noise fields on WebGL (C3). Rescued from reports/c2-review/c3.yaml.
title: Noise fields on WebGL
path: webgl-fields
type: sections
max_columns: 4
sections:
  - type: grid
    column_span: 4
    cards:
      - type: custom:lcards-slider
        entity: input_number.lcards_test_value
        preset: shaped-horizontal
        component: shaped
        text: { name: { content: FILL LEVEL } }
        style: { shaped: { text_bands: { left: { size: 120 } } } }
        grid_options: { columns: 16, rows: 1 }
      - type: custom:lcards-slider
        entity: input_number.lcards_test_power
        preset: shaped-horizontal
        component: shaped
        text: { name: { content: DRIFT } }
        style: { shaped: { text_bands: { left: { size: 120 } } } }
        grid_options: { columns: 16, rows: 1 }
  - type: grid
    column_span: 4
    cards:
      - type: custom:lcards-elbow
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - preset: contour-field
              config: { seed: 7, num_bands: 6, colors: [ theme:colors.ui.primary, theme:colors.ui.secondary ] }
        text: { label: { content: 1 CONTOUR, show: true, color: var(--lcards-blue) } }
        grid_options: { columns: 6, rows: 4 }
      - type: custom:lcards-elbow
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - preset: contour-field
              config: { seed: 5, cell_size: 4, num_bands: 4, blend_colors: false }
        text: { label: { content: 2 CONTOUR BLOCKY, show: true, color: var(--lcards-blue) } }
        grid_options: { columns: 6, rows: 4 }
      - type: custom:lcards-elbow
        entity: input_number.lcards_test_power
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - { preset: plasma, config: { scroll_speed_x: { map_range: { input: [ 0, 100 ], output: [ 0, 120 ] } } } }
        text: { label: { content: 3 PLASMA · DRIFT, show: true, color: var(--lcards-blue) } }
        grid_options: { columns: 6, rows: 4 }
      - type: custom:lcards-elbow
        entity: input_number.lcards_test_power
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - { preset: fluid, config: { color: theme:colors.ui.primary, scroll_speed_x: { map_range: { input: [ 0, 100 ], output: [ 0, 120 ] } } } }
        text: { label: { content: 4 FLUID · DRIFT, show: true, color: var(--lcards-blue) } }
        grid_options: { columns: 6, rows: 4 }
      - type: custom:lcards-elbow
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - preset: contour-field
              config: { seed: 3, num_octaves: 8, cell_size: 1, num_bands: 12 }
        text:
          label:
            content: 5 CONTOUR, 8 OCTAVES
            show: true
            color: var(--lcards-blue)
        grid_options: { columns: 12, rows: 6 }
      - type: custom:lcards-elbow
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - preset: contour-field
              transition: 800
              config:
                seed: 7
                num_bands: 8
                fill_color: alpha(theme:colors.ui.primary, 0.35)
                fill_level: { map_range: { input: [ 0, 100 ], output: [ 0, 0.9 ] } }
                noise_scale: { map_range: { input: [ 0, 100 ], output: [ 0.002, 0.02 ] } }
        text:
          label:
            content: "6 FILL LEVEL + NOISE SCALE (GLIDES)"
            show: true
            color: var(--lcards-blue)
        grid_options: { columns: 6, rows: 4 }
        entity: input_number.lcards_test_value
