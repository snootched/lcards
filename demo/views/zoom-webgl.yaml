# Zoom over WebGL (C5). Rescued from reports/c2-review/c5.yaml.
title: Zoom over WebGL
path: zoom-webgl
type: sections
max_columns: 4
sections:
  - type: grid
    column_span: 4
    cards:
      - type: custom:lcards-button
        preset: lozenge
        text: { name: { content: RED ALERT, show: true } }
        tap_action: { action: perform-action, perform_action: lcards.red_alert }
        grid_options: { columns: 8, rows: 1 }
      - type: custom:lcards-button
        preset: lozenge
        text: { name: { content: YELLOW ALERT, show: true } }
        tap_action: { action: perform-action, perform_action: lcards.yellow_alert }
        grid_options: { columns: 8, rows: 1 }
      - type: custom:lcards-button
        preset: lozenge
        text: { name: { content: CLEAR, show: true } }
        tap_action: { action: perform-action, perform_action: lcards.clear_alert }
        grid_options: { columns: 8, rows: 1 }
      - type: custom:lcards-slider
        entity: input_number.lcards_test_value
        grid_options: { columns: 8, rows: 1 }
  - type: grid
    column_span: 4
    cards:
      - type: custom:lcards-elbow
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - preset: grid
              config:
                major_row_interval: 3
                major_col_interval: 3
                color: var(--lcards-orange)
                color_major: var(--lcards-moonlight)
              zoom: { layers: 4 }
        text: { label: { content: 1 GRID + ZOOM (WEBGL), show: true, color: var(--lcards-blue) } }
        grid_options: { columns: 6, rows: 5 }
      - type: custom:lcards-elbow
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - preset: grid
              renderer: canvas
              config:
                major_row_interval: 3
                major_col_interval: 3
                color: var(--lcards-orange)
                color_major: var(--lcards-moonlight)
              zoom: { layers: 4 }
        text:
          label: { content: "2 GRID + ZOOM (renderer: canvas)", show: true, color: var(--lcards-blue) }
        grid_options: { columns: 6, rows: 5 }
      - type: custom:lcards-elbow
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - preset: grid
              config:
                pattern: polar
                color: var(--lcards-blue-light)
                color_major: var(--lcards-moonlight)
              zoom: { layers: 3 }
        text: { label: { content: 3 POLAR + ZOOM, show: true, color: var(--lcards-blue) } }
        grid_options: { columns: 6, rows: 5 }
      - type: custom:lcards-elbow
        elbow:
          type: frame
          segment: { color: theme:colors.card.topColor }
          frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
        background_animation:
          inset: auto
          effects:
            - { preset: grid-hexagonal, config: {}, zoom: { layers: 3 } }
        text: { label: { content: 4 HEXAGONAL + ZOOM, show: true, color: var(--lcards-blue) } }
        grid_options: { columns: 6, rows: 5 }
