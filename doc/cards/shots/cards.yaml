# Pictures for the card overview tabs (doc/cards/index.md):
#   node scripts/release-shots.mjs --list doc/cards/shots/cards.yaml --out doc/public/img/cards [name ...]
# The alert overlay needs a real dashboard behind it (alert-overlay-dashboard.yaml):
#   node scripts/dashboard-shots.mjs doc/cards/shots/alert-overlay-dashboard.yaml --out=doc/public/img/cards \
#     --name=alert-overlay --action=lcards.red_alert --size=1400x900
# Uses only lcards_test_* helpers and the desk sensor (no personal names in any shot).

- name: chart
  card:
    type: custom:lcards-chart
    chart_type: area
    height: 320
    data_sources:
      deck_temp:
        entity: sensor.desk_sensor_temperature
        history: {hours: 24}
        processing:
          smoothed: {type: smooth, method: exponential, alpha: 0.15}
    sources:
    - {datasource: deck_temp, name: Raw}
    - {datasource: deck_temp, buffer: smoothed, name: Smoothed}
    style:
      colors:
        series: [var(--lcars-orange), var(--lcars-blue)]
      fill:
        type: gradient
        gradient: {opacityFrom: 0.5, opacityTo: 0.05}
      thresholds:
      - {value: 19.5, label: Comfort, color: var(--lcars-yellow), dash: true}
      legend: {show: true}
  size: [760, 320]
  settle: 5000
  selector: '#lcards-release-card'
  padding: 12
- name: msd
  card: &id001
    type: custom:lcards-msd-card
    msd:
      base_svg: {source: 'builtin:ncc-1701-a-blue'}
      view_box: [180, 270, 1600, 720]
      overlays:
      - id: shield_fore
        type: shape
        kind: polyline
        entity: input_number.lcards_test_shields
        corner_style: miter
        points:
