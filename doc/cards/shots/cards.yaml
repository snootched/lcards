        - [872, 952]
        - [825, 948]
        - [778, 942]
        - [732, 935]
        - [687, 926]
        - [644, 916]
        - [602, 905]
        - [562, 892]
        style:
          width: 6
          line_cap: round
          color: {default: var(--lcards-blue-light), 'below:50': var(--lcards-orange), 'below:20': 'var(--lcars-alert-red, #cc0000)'}
      - id: shield_aft
        type: shape
        kind: polyline
        entity: input_number.lcards_test_shields
        corner_style: miter
        points:
        - [410, 819]
        - [383, 800]
        - [359, 780]
        - [338, 759]
        - [320, 738]
        - [305, 716]
        - [293, 694]
