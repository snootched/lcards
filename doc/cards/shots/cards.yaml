        - [1553, 450]
        - [1577, 470]
        - [1598, 491]
        - [1616, 512]
        - [1631, 534]
        - [1643, 556]
        - [1651, 579]
        - [1656, 602]
        - [1658, 625]
        - [1656, 648]
        - [1651, 671]
        - [1643, 694]
        - [1631, 716]
        - [1616, 738]
        - [1598, 759]
        - [1577, 780]
        - [1553, 800]
        - [1526, 819]
        style:
          width: 6
          line_cap: round
          color: {default: var(--lcards-blue-light), 'below:50': var(--lcards-orange), 'below:20': 'var(--lcars-alert-red, #cc0000)'}
      - id: shield_starboard
        type: shape
        kind: polyline
        entity: input_number.lcards_test_shields
        corner_style: miter
