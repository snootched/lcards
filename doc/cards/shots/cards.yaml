          text:
            name: {content: SHUTTLE BAY, font_size: 30}
      - id: bridge-line
        type: line
        anchor: bridge-ctl
        attach_to: br
        route: auto
        corner_style: round
        style: {color: var(--lcards-gray-medium-light), width: 3}
      - id: core-line
        type: line
        anchor: core-ctl
        attach_to: wc
        route: auto
        corner_style: round
        style: {color: var(--lcards-gray-medium-light), width: 3}
      - id: shuttle-line
        type: line
        anchor: shuttle-ctl
        attach_to: sb
        route: auto
        corner_style: round
        style: {color: var(--lcards-gray-medium-light), width: 3}
  steps:
  - service:
    - input_boolean
    - turn_on
    - {entity_id: input_boolean.lcards_test_lights}
  - service:
    - input_boolean
    - turn_off
    - {entity_id: input_boolean.lcards_test_toggle}
  - service:
    - input_number
    - set_value
    - {entity_id: input_number.lcards_test_shields, value: 64}
  size: &id002 [1000, 450]
  settle: 5000
  selector: '#lcards-release-card'
  padding: 8
- name: msd-motion
  card: *id001
  steps:
  - service:
    - input_number
    - set_value
    - {entity_id: input_number.lcards_test_shields, value: 64}
  - {wait: 1500}
  size: *id002
  settle: 5000
  selector: '#lcards-release-card'
  padding: 8
  kind: video
  video_steps:
  - {wait: 900}
  - service:
    - input_number
    - set_value
    - {entity_id: input_number.lcards_test_shields, value: 40}
  - {wait: 1600}
  - service:
    - input_number
    - set_value
    - {entity_id: input_number.lcards_test_shields, value: 12}
  - {wait: 1600}
  - service:
    - input_boolean
    - turn_off
    - {entity_id: input_boolean.lcards_test_lights}
  - {wait: 1200}
  - service:
    - input_number
    - set_value
    - {entity_id: input_number.lcards_test_shields, value: 90}
  - service:
    - input_boolean
    - turn_on
    - {entity_id: input_boolean.lcards_test_lights}
  duration: 1800
- name: layout-card
  card: &id003
    type: custom:lcards-layout-card
    layout: {height: 420px, grid-gap: 6px, grid-template-columns: '180px minmax(0, 1fr) 120px', grid-template-rows: 60px 1fr 1fr 1fr 60px, grid-template-areas: '"header header header"

        "b1     grid   power"

        "b2     grid   power"

        "b3     grid   power"

        "footer footer footer"

        '}
    cards:
    - type: custom:lcards-elbow
      elbow:
        type: header-left
        style: segmented
        segments:
          gap: 5
          outer_segment: {bar_width: 180, bar_height: 20, color: var(--lcards-gray-medium)}
          inner_segment: {bar_width: 46, bar_height: 7, color: var(--lcards-orange-medium)}
      text:
        title: {content: OPERATIONS, position: bottom-right, font_size: 22, color: var(--lcards-orange)}
      view_layout: {grid-area: header}
    - type: custom:lcards-button
      preset: filled
      entity: input_boolean.lcards_test_lights
      text:
        name: {content: LIGHTS}
      view_layout: {grid-area: b1}
    - type: custom:lcards-button
      preset: filled
      entity: input_boolean.lcards_test_toggle
      text:
        name: {content: SHIELDS}
      view_layout: {grid-area: b2}
    - type: custom:lcards-button
      preset: filled
      text:
        name: {content: SENSORS}
      view_layout: {grid-area: b3}
    - type: custom:lcards-data-grid
      data_mode: decorative
      format: hex
      grid: {grid-template-rows: 'repeat(5, auto)', grid-template-columns: 'repeat(8, 1fr)', gap: 0px}
      style: {font_size: 20px, color: var(--lcards-blue-light)}
      view_layout: {grid-area: grid}
    - type: custom:lcards-slider
      entity: input_number.lcards_test_power
      preset: picard-gauge-vertical
      component: picard
      view_layout: {grid-area: power}
    - type: custom:lcards-elbow
      elbow:
        type: footer-left
        style: segmented
        segments:
          gap: 5
          outer_segment: {bar_width: 180, bar_height: 20, color: var(--lcards-gray-medium)}
          inner_segment: {bar_width: 46, bar_height: 7, color: var(--lcards-orange-medium)}
      view_layout: {grid-area: footer}
  steps:
  - service:
    - input_boolean
    - turn_on
    - {entity_id: input_boolean.lcards_test_lights}
  - service:
    - input_number
    - set_value
    - {entity_id: input_number.lcards_test_power, value: 70}
  size: [900, 420]
  settle: 4000
  selector: '#lcards-release-card'
  padding: 12
- name: layout-studio
  card: *id003
  editor: true
  open: _openStudio
  settle: 9000
  viewport: [1400, 900]
