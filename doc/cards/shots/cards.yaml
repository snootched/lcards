      - id: bridge-ctl
        type: control
        attachment: top-left
        position: [190, 278]
        size: [340, 96]
        card:
          type: custom:lcards-button
          preset: filled
          entity: input_boolean.lcards_test_lights
          text:
            name: {content: BRIDGE, font_size: 30}
          tap_action: {action: toggle}
      - id: core-ctl
        type: control
        attachment: top-left
        position: [190, 886]
        size: [340, 96]
        card:
          type: custom:lcards-button
          preset: filled
          entity: input_boolean.lcards_test_toggle
          text:
            name: {content: WARP CORE, font_size: 30}
