# Alert mode: the alert symbol, buttons that raise and clear LCARdS alert modes
# (the lcards.* actions recolour every LCARdS dashboard), and the alert overlay
# that shows over the view while an alert is active.
title: Alert Mode
views:
  - title: Alert
    path: alert
    type: custom:lcards-layout-view
    layout:
      height: calc(100dvh - var(--header-height, 56px))
      padding: 12px
      grid-gap: 6px
      grid-template-columns: 170px minmax(0, 1fr)
      grid-template-rows: 64px 70px 70px 70px 70px minmax(0, 1fr) 64px
      grid-template-areas: |
        "header header"
        "red    symbol"
        "yellow symbol"
        "blue   symbol"
        "clear  symbol"
        "filler symbol"
        "footer footer"
    cards:
      - type: custom:lcards-elbow
        elbow:
          type: header-left
          segment:
            bar_width: 170
            bar_height: 22
        text:
          title:
            content: ALERT STATUS
            position: bottom-right
            font_size: 24
            color: var(--lcards-orange)
        view_layout:
          grid-area: header
      - type: custom:lcards-alert-overlay
        view_layout:
          grid-area: symbol
      - type: custom:lcards-button
        component: alert
        preset: condition_red
        view_layout:
          grid-area: symbol
          justify-self: center
      - type: custom:lcards-button
        preset: lozenge
        style:
          card:
            color:
              background:
                default: var(--lcars-alert-red, #cc0000)
        text:
          label:
            content: RED ALERT
            show: true
        tap_action:
          action: perform-action
          service: lcards.red_alert
        view_layout:
          grid-area: red
      - type: custom:lcards-button
        preset: lozenge
        style:
          card:
            color:
              background:
                default: var(--lcars-alert-yellow, #ffcc00)
        text:
          label:
            content: YELLOW ALERT
            show: true
        tap_action:
          action: perform-action
          service: lcards.yellow_alert
        view_layout:
          grid-area: yellow
      - type: custom:lcards-button
        preset: lozenge
        style:
          card:
            color:
              background:
                default: var(--lcars-alert-blue, #3366ff)
        text:
          label:
            content: BLUE ALERT
            show: true
        tap_action:
          action: perform-action
          service: lcards.blue_alert
        view_layout:
          grid-area: blue
      - type: custom:lcards-button
        preset: lozenge
        text:
          label:
            content: STAND DOWN
            show: true
        tap_action:
          action: perform-action
          service: lcards.clear_alert
        view_layout:
          grid-area: clear
      - type: custom:lcards-button
        preset: panel-dark
        view_layout:
          grid-area: filler
      - type: custom:lcards-elbow
        elbow:
          type: footer-left
          segment:
            bar_width: 170
            bar_height: 22
        view_layout:
          grid-area: footer
