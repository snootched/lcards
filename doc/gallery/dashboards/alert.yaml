# Alert Mode: the "display with side columns" archetype from doc/getting-started/lcars-design.md,
# in the classic look. Two thick sweeps face each other across the top, joined by a band of
# labelled segments, and their arms run down both sides as sidebars of stacked blocks. The left
# sidebar's buttons raise each alert mode (lcards.red_alert, yellow_alert, blue_alert, gray_alert,
# black_alert) and stand down (lcards.clear_alert); the right one toggles lights, doors and the
# auxiliary helper. Between them an everyday systems screen: a 24 hour chart of power, shields and
# humidity with live readouts, a ship status table (every number a labelled live reading), and
# deck controls whose pill rows, led by big live numbers, toggle helpers and set power and shields.
# An alert recolours the whole screen in place, and the alert overlay covers the view while it lasts.
# Every colour is a theme role; the view uses the LCARS Modern theme.
# Uses lcards_test_* helpers and sensor.desk_sensor_temperature.
title: Alert Mode
views:
  - title: Alert
    path: alert
    theme: LCARS Modern
    type: custom:lcards-layout-view
    layout:
      height: calc(100dvh - var(--header-height, 56px))
      padding: 12px
      grid-gap: 6px
      grid-template-columns: 168px 40px minmax(0, 1fr) 300px 40px 168px
      grid-template-rows: 56px 30px 84px minmax(0, 1fr) 12px 168px 24px
