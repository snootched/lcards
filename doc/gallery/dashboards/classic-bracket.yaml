# Classic bracket: the "bracket screen" archetype from doc/getting-started/lcars-design.md.
# A top sweep whose bar runs on as four coded segments into
# the title, a sidebar of stacked blocks with codes at the top right (two toggle helpers), and
# a lower sweep whose bar closes the bottom; a divider band cuts across above the lower strip.
# The display is the shuttlecraft cutaway with labelled leader lines, several carrying live
# readings. Beside it a readings list (every value live), the screen's one number cascade and a
# dim code. The lower strip holds gauges that set three levels and a pill group led by big
# numbers whose pills toggle helpers. The view uses the LCARS Zeldaar theme;
# every colour is a theme role. Uses lcards_test_* helpers and sensor.desk_sensor_temperature.
title: Classic Bracket
views:
  - title: Runabout
    path: runabout
    theme: LCARS Zeldaar
    type: custom:lcards-layout-view
    layout:
      height: calc(100dvh - var(--header-height, 56px))
