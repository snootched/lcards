# Classic console: the "sweep console" archetype from doc/getting-started/lcars-design.md,
# built like a helm panel. Two thick sweeps face each other across the top, each bar
# continued as labelled colour blocks, and their arms run down the middle to the bottom edge
# as stacked blocks with codes. The left deck is a pill grid led by big numbers: the first
# group's numbers are live levels and its pills set them, the second group's pills and
# squares toggle helpers, the third is decorative codes, and a slider sets the warp factor.
# The right panel holds the title, a deck temperature trace in a thin nested sweep, a
# readings table and a small pill group. Each panel ends in a segmented bar.
# Every colour is a theme role; the view uses the LCARS Default theme for its pastels.
# Uses lcards_test_* helpers and sensor.desk_sensor_temperature.
title: Classic Console
views:
  - title: Operations
    path: operations
    theme: LCARS Default
    type: custom:lcards-layout-view
    layout:
      height: calc(100dvh - var(--header-height, 56px))
      padding: 12px
      grid-gap: 6px
      grid-template-columns: 520px 40px 128px 128px 40px minmax(0, 1fr)
      grid-template-rows: 64px 84px minmax(0, 1fr) 24px
    cards:
