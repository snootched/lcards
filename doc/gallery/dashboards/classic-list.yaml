# Classic list: the "list" archetype from doc/getting-started/lcars-design.md, as a crew duty
# roster. A title row; an upper band of three short tables split by dots
# (the shift schedule, live environment readings, helper states); a split header (the upper
# sweep turns into a segmented bar, the lower sweep comes out of the next); the crew roster
# with the medical officer's status following a helper, labelled counts beside it, and a sidebar of
# blocks with codes. Along the bottom, pill rows: a capped block, a code block and a big number
# lead each row, and the first pill of each toggles a helper. The view uses the LCARS Nemesis
# Blue theme; every colour is a theme role.
# Uses lcards_test_* helpers and sensor.desk_sensor_temperature.
title: Classic List
