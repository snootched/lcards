# Classic Wings: the "wings" archetype from doc/getting-started/lcars-design.md, in the classic
# look, as the Enterprise's warp propulsion: port and starboard nacelles around what they share.
# Two thick sweeps face each other across the top with a thin split band between them, and two
# thin sweeps close the wings at the bottom. Each wing is the same module, mirrored: its flow as
# a big live number, pill rows led by live numbers (one sets its coil or field level, the next
# toggles its injector and vent and counts how many are on), the side's own readings table,
# a pill slider for its flow and two rows of coded pills, beside a sidebar of coded blocks. Port is wheat and starboard blue throughout, and the centre charts both flows in the
# same two colours, over shared readings (warp factor, balance, core) and a pill group that
# engages warp and steps the sequence.
# Every colour is a theme role; the view uses the LCARS Nemesis Blue theme.
# Uses lcards_test_* helpers and sensor.desk_sensor_temperature.
