# Engineering: the "master systems display" archetype from doc/getting-started/lcars-design.md,
# in the Picard look. The built-in NCC-1701-A blueprint fills the screen as a dimmed schematic.
# Shield arcs round the ship change colour with shield strength (the shield_* naming MSD Studio's
# Suggest Shield Bubble uses), and eight callouts above and below it are small blocks joined to
# the ship's own markers by routed lines; four of the blocks toggle helpers, and their labels
# carry live readings (one fault in the accent).
# The header bar turns down over a code-block column (with the power and shield gauges at its
# foot) and a sweep at its foot turns into the closing bar under the display. Round it: utility
# pills in a bracket open on the left edge, a column with a systems readings table, flagged blocks
# and a mode selector, and a strip of toggle tabs over three readings tables.
# Every colour is a theme role (theme: tokens), so it follows the HA-LCARS theme.
# Uses lcards_test_* helpers and sensor.desk_sensor_temperature.
title: Engineering
