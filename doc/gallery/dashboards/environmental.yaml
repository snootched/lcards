# Environmental: the "data screen" archetype from doc/getting-started/lcars-design.md, in the
# Picard look. The upper band holds a climate table and a life support table (every number a
# labelled live reading) and the title; under them a strip of toggle tabs and a shaped slider
# that sets the cabin's set point. Two thin sweeps meet at a segmented band across the screen:
# the upper one comes down a code-block column, the lower one turns into the sidebar. Under the
# band a 24 hour temperature history fills the display, with a humidity column gauge (dry,
# nominal and humid bands, and a legend) beside it, and a sidebar of code blocks with a set
# point and ambient gauge pair.
# Every colour is a theme role (theme: tokens), so it follows the HA-LCARS theme.
# Uses lcards_test_* helpers and sensor.desk_sensor_temperature.
title: Environmental
views:
  - title: Environmental
    path: environmental
    type: custom:lcards-layout-view
    layout:
      height: calc(100dvh - var(--header-height, 56px))
      padding: 8px
      grid-gap: 6px
      grid-template-columns: 134px 40px minmax(0, 1fr) 196px
      grid-template-rows: 154px 40px 14px 14px 40px minmax(0, 1fr)
