# Picard console: the "display with side columns" archetype from doc/getting-started/lcars-design.md,
# built as modules whose slots take a decorative part or a control of the same size.
# Utility pills in a bracket open on the left (gauge groups in its slot); one display sweep down
# the left edge (the header bar turns down over a code-block column and ends in a short sweep
# into the strip's closing bar); a dimmed ship schematic inside it; a gauge bank
# (picard-gauge-column) beside flagged readings; toggle tabs and readout rows along the bottom.
# Every colour is a theme role (theme: tokens), so it follows the HA-LCARS theme.
# Uses lcards_test_* helpers.
title: Picard Console
views:
  - title: Console
    path: console
    type: custom:lcards-layout-view
    layout:
      height: calc(100dvh - var(--header-height, 56px))
      padding: 8px
      grid-gap: 6px
      grid-template-columns: 130px 180px minmax(0, 1fr) 196px
      grid-template-rows: 76px minmax(0, 1fr) 140px
      grid-template-areas: |
        "pills top top top"
        "pills left main right"
        "pills left strip right"
    cards:
      - type: custom:lcards-elbow
        view_layout:
          grid-area: pills
        elbow:
          type: frame
          segment:
            color: theme:colors.ui.secondary
          frame:
            bar_width: 14
            bar_height: 30
            outer_curve: 30
            left:
              enabled: false
      - type: custom:lcards-layout-card
        view_layout:
          grid-area: pills
        layout:
          padding: 40px 30px 40px 0px
          grid-gap: 6px
          grid-template-columns: minmax(0, 1fr)
          grid-template-rows: 24px minmax(0, 1fr) 24px 24px 24px
        cards:
          - type: custom:lcards-button
            preset: lozenge
            min_height: 0
            text:
              label:
                content: ZOOM
                show: true
                position: center
                font_size: 13
                color: theme:colors.ui.secondary
            style:
              card:
                color:
                  background:
                    default: theme:colors.card.topColor
          - type: custom:lcards-layout-card
            layout:
              grid-gap: 6px
              grid-template-columns: repeat(2, minmax(0, 1fr))
              grid-template-rows: 6px 24px minmax(0, 1fr) 24px minmax(0, 1fr) 24px 6px
              grid-template-areas: |
                ". ."
                "h1 h1"
                "g1 g2"
                "h2 h2"
                "g3 g4"
                "b7 b8"
                ". ."
            cards:
              - type: custom:lcards-button
                preset: panel-light
                min_height: 0
                text:
                  label:
                    content: 46-370
                    position: center-right
                    font_size: 13
                style:
                  card:
                    color:
                      background:
                        default: theme:colors.ui.tertiary
                view_layout:
                  grid-area: h1
              - type: custom:lcards-slider
