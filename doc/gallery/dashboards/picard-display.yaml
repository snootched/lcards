# Picard display: the "display over controls" archetype from doc/getting-started/lcars-design.md,
# built as modules whose slots take a decorative part or a control of the same size.
# One display sweep, open on the right, frames a dimmed side profile of a starship with labelled
# leader lines (three labels carry live readings, one fault in the accent); its top and bottom bars
# run on as segments and the title sits under the top bar. The control deck under it: a code-block
# column (three blocks toggle helpers), a gauge bank (picard-gauge-column), toggle tabs over two
# readings tables and a mode selector, a column of flagged blocks, and utility pills in a bracket
# open on the right edge. A segmented bar closes the screen.
# Every colour is a theme role (theme: tokens), so it follows the HA-LCARS theme.
# Uses lcards_test_* helpers.
title: Picard Display
views:
  - title: Display
    path: display
    type: custom:lcards-layout-view
    layout:
      height: calc(100dvh - var(--header-height, 56px))
      padding: 8px
      grid-gap: 6px
      grid-template-columns: 134px 258px minmax(0, 1fr) 196px 130px
      grid-template-rows: minmax(0, 1fr) 264px 12px
      grid-template-areas: |
        "top  top    top    top   top"
        "code gauges centre flags pills"
        "b1   b2     b3     b4    pills"
