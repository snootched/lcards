# Picard portrait: the "portrait panel" archetype from doc/getting-started/lcars-design.md, for a
# phone or an upright wall tablet, built as modules whose slots take a decorative part or a control
# of the same size. A header bar with the title; a sweep down the left edge that frames the panel
# and turns into the segmented closing bar; the main display, a labelled, dimmed plan of the
# Enterprise (three labels carry live readings, one fault in the accent); a segmented band; a
# code-block column (three blocks toggle helpers) beside a condition readout (a readings table);
# utility pills in a bracket open on the right edge, code blocks in its slot; a short gauge bank
# (picard-gauge-column) beside reading cells (a code block and the live value in a flagged block);
# toggle tabs and a mode selector.
# Every colour is a theme role (theme: tokens), so it follows the HA-LCARS theme.
# Uses lcards_test_* helpers.
title: Picard Portrait
