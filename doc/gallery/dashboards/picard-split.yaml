# Picard split: a split screen in the Picard style, from doc/getting-started/lcars-design.md,
# built as modules whose slots take a decorative part or a control of the same size.
# Two segmented sweeps (a thin outer band with a large curve round a wide inner block, as in the
# lcars-shell strategy) face each other across a cut through the screen. Their arms run on across
# the screen as segments and up and down the left edge as a band beside a two-wide block column.
# Upper half: utility pills inside the curve, the title, a readings table, readout rows, a gauge
# pair beside toggle blocks, and a code-block column. Lower half: flagged blocks and a gauge pair inside the curve, a labelled ship
# schematic open on the right, fleet tiles, and toggle tabs with a mode selector.
# Every colour is a theme role (theme: tokens), so it follows the HA-LCARS theme.
# Uses lcards_test_* helpers.
