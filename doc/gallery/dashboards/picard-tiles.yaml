      - type: custom:lcards-elbow
        view_layout:
          grid-area: hsw
        elbow:
          type: header-left
          segment:
            bar_width: 134
            bar_height: 14
            outer_curve: 46
            color: theme:colors.ui.secondary
      - type: custom:lcards-layout-card
