# Picard Tiles: the "tile wall" archetype from doc/getting-started/lcars-design.md, in the
# Picard look. Nine sections of the Enterprise, each a framed tile with the same module inside:
# the deck code and section name on the frame's thick top bar, a small readings table on the
# left, a slot on the right and a control row at the bottom. The slots vary: setting gauges, a
# big live number, 12 hour charts, readout bars and a slider, a view selector, transporter pads
# and the screen's one number cascade (the cargo manifest). A tile's frame takes the accent
# while its section is active (bridge lights, warp, bay doors, holodeck, star chart trail,
# pattern lock). The header sweep comes down a code-block column with a warp factor and power
# gauge pair; a shipwide summary table sits under the header bar, and the utility bracket on
# the right edge holds an index of the six live sections whose blocks toggle them.
# Every colour is a theme role (theme: tokens), so it follows the HA-LCARS theme.
# Uses lcards_test_* helpers and sensor.desk_sensor_temperature.
title: Picard Tiles
views:
  - title: Sections
    path: sections
    type: custom:lcards-layout-view
    layout:
      height: calc(100dvh - var(--header-height, 56px))
      padding: 8px
      grid-gap: 6px
      grid-template-columns: 134px 24px repeat(3, minmax(0, 1fr)) 110px
      grid-template-rows: 14px 84px repeat(3, minmax(0, 1fr)) 30px 14px
      grid-template-areas: '"hsw hsw bar bar bar util" "hsw hsw head head head util" "code . t1 t2 t3 util" "code . t4 t5 t6 util" "code . t7 t8 t9 util" "fsw fsw strip strip strip util" "fsw fsw foot foot foot util"'
