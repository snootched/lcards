          grid-gap: 6px
          grid-template-columns: 220px 96px minmax(0, 1fr) 64px 160px
          grid-template-rows: minmax(0, 1fr)
        cards:
          - type: custom:lcards-button
            preset: panel-light
            min_height: 0
            text:
              label:
                show: false
            style:
              card:
                color:
                  background:
                    default: theme:colors.card.topColor
          - type: custom:lcards-button
            preset: text-only
            min_height: 0
            text:
              label:
                content: •  •••  ••  •
                show: true
                position: center
                font_size: 14
                color: theme:colors.ui.secondary
          - type: custom:lcards-button
            preset: panel-light
            min_height: 0
            text:
              label:
                show: false
            style:
              card:
                color:
                  background:
                    default: theme:colors.ui.secondary
          - type: custom:lcards-button
            preset: panel-light
            min_height: 0
            text:
              label:
                show: false
            style:
              card:
                color:
                  background:
                    default: theme:colors.ui.tertiary
          - type: custom:lcards-button
            preset: panel-light
            min_height: 0
            text:
              label:
                show: false
            style:
              card:
                color:
                  background:
                    default: theme:colors.card.topColor
        view_layout:
          grid-area: bar
