                    name: HOURLY
                    curve: stepline
                    stroke_width: 1
                    group_by:
                      func: avg
                      duration: 1h
                style:
                  colors:
                    series:
                      - theme:colors.ui.tertiary
                      - theme:colors.ui.secondary
                    grid: theme:colors.card.topColor
                    axis:
                      x: theme:colors.ui.secondary
                      'y': theme:colors.ui.secondary
                      border: theme:colors.card.topColor
                      ticks: theme:colors.card.topColor
                  legend:
                    show: false
