# Sciences: the "bracket screen" archetype from doc/getting-started/lcars-design.md, in the
# Picard look: a top and a bottom bar with round caps, in segments, and a numbered sidebar of
# code blocks (three toggle the scan, probe and lab lights). The readout fills the bracket in
# labelled sections divided by a thin segmented bar: a 24 hour temperature history (a smooth line
# and its hourly mean as steps) with a readings table beside it; four Picard ring gauges that set
# power, shields, humidity and the cabin temperature; a sensor log (every number a labelled live
# reading); and hourly means over 12 hours as columns.
# Every colour is a theme role (theme: tokens), so it follows the HA-LCARS theme.
# Uses lcards_test_* helpers and sensor.desk_sensor_temperature.
title: Sciences
views:
  - title: Sciences
    path: sciences
    type: custom:lcards-layout-view
    layout:
      height: calc(100dvh - var(--header-height, 56px))
      padding: 8px
      grid-gap: 6px
      grid-template-columns: 134px minmax(0, 1fr)
      grid-template-rows: 18px 54px minmax(0, 1fr) 18px
    cards:
      - type: custom:lcards-layout-card
        layout:
          grid-gap: 6px
          grid-template-columns: 120px 300px 64px minmax(0, 1fr) 96px 64px 120px
          grid-template-rows: minmax(0, 1fr)
        cards:
          - type: custom:lcards-button
            preset: bullet-right
            min_height: 0
            text:
              label:
                content: SCIENCES
                show: true
                position: center-right
                font_size: 13
                color: var(--lcars-text-dark, var(--lcards-gray-darkest))
            style:
              card:
                color:
                  background:
                    default: theme:colors.ui.secondary
          - type: custom:lcards-button
