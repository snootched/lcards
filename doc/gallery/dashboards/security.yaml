# Security: the "sweep console" archetype from doc/getting-started/lcars-design.md, in the
# classic look: one thick header sweep, a sidebar that sweeps into a segmented bottom bar,
# button groups in the middle and a readout on the right. The title row holds the security
# mode selector. The camera group is the Voyager D-pad: left and right step a helper
# (standing in for a camera pan), the centre recentres it, preset pills point it, and the
# pan leads the group as a big live number over a pill slider. The access group's pill rows
# toggle the doors, the exterior lights and the intruder alert, and three pills set the
# alert mode (lcards.red_alert, yellow_alert, clear_alert). Four sector tiles take the accent
# while their sector is active (doors open, lights on, intruder), and the readout is a
# sector status table (every number a labelled live reading).
# Every colour is a theme role; the view uses the LCARS Classic theme.
# Uses lcards_test_* helpers; swap in your own locks, lights, cameras and modes.
title: Security
