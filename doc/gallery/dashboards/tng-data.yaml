# TNG data screen: the classic "data screen" archetype from doc/getting-started/lcars-design.md.
# An upper band with a sweep, a readings table of the environment (labelled live values with a
# status word) beside the screen's one small number cascade, the big title and a pill group
# led by big numbers; a divider band of segmented bars; a sidebar of blocks (three toggle
# helpers) beside a long range scan (astrometrics) with a bearing scale and a systems
# readings table. The view sets theme: LCARS Default for the TNG pastels.
# Uses lcards_test_* helpers and sensor.desk_sensor_temperature.
title: TNG Data Screen
views:
  - title: Long Range Scan
    path: scan
    type: custom:lcards-layout-view
    theme: LCARS Default
    layout:
      height: calc(100dvh - var(--header-height, 56px))
      padding: 12px
      grid-gap: 6px
      grid-template-columns: 168px 200px minmax(0, 1fr) 156px 156px
      grid-template-rows: 84px 132px 18px 18px 90px minmax(0, 1fr)
      grid-template-areas: |-
        "topblk codes   title   title  title"
        "usweep usweep  .       .      .     "
        "usweep usweep  ubar    ubar   ubar"
        "lsweep lsweep  lbar    lbar   lbar"
        "lsweep lsweep  .       .      .     "
        "side   .       .       .      .     "
    cards:
      - type: custom:lcards-button
        preset: panel-light
        min_height: 0
        text:
          label:
            content: LCARS 40274
            position: bottom-right
            font_size: 14
            color: var(--lcars-text-dark, var(--lcards-gray-darkest))
        style:
          card:
            color:
              background:
                default: theme:colors.ui.quaternary
        view_layout:
          grid-area: topblk
      - type: custom:lcards-elbow
        elbow:
          type: footer-left
          segment:
            bar_width: 168
            bar_height: 18
            color: theme:colors.ui.secondary
        text:
          code:
            content: 02-654598
            zone: vertical_bar
            position: top-right
            font_size: 14
            color: var(--lcars-text-dark, var(--lcards-gray-darkest))
        view_layout:
          grid-area: usweep
      - type: custom:lcards-data-grid
        data_mode: data
        rows:
          - - value: DATE
              style:
                color: var(--lcars-orange, var(--lcards-orange-medium))
            - '{{ now().strftime(''%y%m.%d'') }}'
          - - value: TIME
              style:
                color: var(--lcars-orange, var(--lcards-orange-medium))
            - '{{ now().strftime(''%H%M'') }}'
        grid:
          grid-template-rows: repeat(2, 22px)
          grid-template-columns: 44px 70px
          gap: 0px 10px
        style:
          font_size: 15
          padding: 0px
          line_height: 1.1
          color: var(--lcards-moonlight)
          align: right
        view_layout:
          grid-area: codes
      - type: custom:lcards-layout-card
        layout:
          grid-gap: 0px 28px
          grid-template-columns: max-content max-content
          grid-template-rows: 104px
          justify-content: start
        cards:
          - type: custom:lcards-data-grid
            data_mode: data
            rows:
              - values:
                  - value: '01'
                    style:
                      color: var(--lcards-moonlight)
                  - TEMP
                  - input_number.lcards_test_temperature
                  - '{{ ''LOW'' if states(''input_number.lcards_test_temperature'') | float(0) < 18 else (''HIGH'' if states(''input_number.lcards_test_temperature'') | float(0) > 26 else ''NOMINAL'') }}'
                style:
                  color: var(--lcars-orange, var(--lcards-orange-medium))
              - values:
                  - value: '02'
                    style:
                      color: var(--lcards-moonlight)
                  - HUMIDITY
                  - input_number.lcards_test_humidity
                  - '{{ ''LOW'' if states(''input_number.lcards_test_humidity'') | float(0) < 30 else (''HIGH'' if states(''input_number.lcards_test_humidity'') | float(0) > 60 else ''NOMINAL'') }}'
                style:
                  color: var(--lcars-orange, var(--lcards-orange-medium))
              - values:
                  - value: '03'
                    style:
                      color: var(--lcards-moonlight)
                  - AMBIENT
                  - sensor.desk_sensor_temperature
                  - '{{ ''LOW'' if states(''sensor.desk_sensor_temperature'') | float(0) < 18 else (''HIGH'' if states(''sensor.desk_sensor_temperature'') | float(0) > 26 else ''NOMINAL'') }}'
                style:
