# Gallery video for classic-list.yaml: the lights, doors and CMO pills and sidebar block switch; the upper band readings and the medical officer's roster status follow the helpers.
# node scripts/dashboard-shots.mjs doc/gallery/dashboards/classic-list.yaml --video
steps:
- {wait: 800}
- service: [input_boolean, turn_on, {entity_id: input_boolean.lcards_test_doors}]
- {wait: 1200}
- service: [input_number, set_value, {entity_id: input_number.lcards_test_power, value: 40}]
- {wait: 1200}
- service: [input_boolean, turn_on, {entity_id: input_boolean.lcards_test_toggle}]
- {wait: 1200}
- service: [input_boolean, turn_off, {entity_id: input_boolean.lcards_test_lights}]
- service: [input_number, set_value, {entity_id: input_number.lcards_test_humidity, value: 70}]
- {wait: 1500}
- service: [input_number, set_value, {entity_id: input_number.lcards_test_power, value: 82}]
- service: [input_number, set_value, {entity_id: input_number.lcards_test_humidity, value: 46}]
- service: [input_boolean, turn_off, {entity_id: input_boolean.lcards_test_doors}]
- service: [input_boolean, turn_off, {entity_id: input_boolean.lcards_test_toggle}]
- {wait: 800}
- service: [input_boolean, turn_on, {entity_id: input_boolean.lcards_test_lights}]
tail: 1500
