# Gallery video for sciences.yaml: The scan starts and the probe launches in the sidebar and the sensor log, then power, shields and humidity change on the ring gauges.
# node scripts/dashboard-shots.mjs doc/gallery/dashboards/sciences.yaml --video
steps:
- {wait: 800}
- service:
  - input_boolean
  - turn_on
  - {entity_id: input_boolean.lcards_test_toggle}
- {wait: 1200}
- service:
  - input_boolean
  - turn_on
  - {entity_id: input_boolean.lcards_test_doors}
- {wait: 1200}
- service:
  - input_number
  - set_value
  - {entity_id: input_number.lcards_test_power, value: 40}
- {wait: 1400}
- service:
  - input_number
  - set_value
  - {entity_id: input_number.lcards_test_shields, value: 90}
- {wait: 1400}
- service:
  - input_number
  - set_value
  - {entity_id: input_number.lcards_test_humidity, value: 75}
- {wait: 1400}
- service:
  - input_number
  - set_value
  - {entity_id: input_number.lcards_test_power, value: 82}
- service:
  - input_number
  - set_value
  - {entity_id: input_number.lcards_test_shields, value: 64}
- service:
  - input_number
  - set_value
  - {entity_id: input_number.lcards_test_humidity, value: 46}
- {wait: 1000}
- service:
  - input_boolean
  - turn_off
  - {entity_id: input_boolean.lcards_test_doors}
- service:
  - input_boolean
  - turn_off
  - {entity_id: input_boolean.lcards_test_toggle}
tail: 1500
