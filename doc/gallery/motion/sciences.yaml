- {wait: 1400}
- service:
  - input_number
  - set_value
  - {entity_id: input_number.lcards_test_shields, value: 90}
- {wait: 1400}
- service:
  - input_number
  - set_value
  - {entity_id: input_number.lcards_test_humidity, value: 75}
- {wait: 1400}
- service:
  - input_number
  - set_value
  - {entity_id: input_number.lcards_test_power, value: 82}
- service:
  - input_number
  - set_value
  - {entity_id: input_number.lcards_test_shields, value: 64}
- service:
  - input_number
  - set_value
