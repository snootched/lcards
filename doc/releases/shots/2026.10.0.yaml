# Pictures for doc/releases/2026.10.0.md: node scripts/release-shots.mjs 2026.10.0
# The dev HA's own sensors carry personal names (city, utility): use the desk sensor in
# anything that shows entity ids, and charts show the others only by `name:`.

- name: chart
  card:
    type: custom:lcards-chart
    chart_type: area
    height: 300
    graph_span: 24h
    sources:
      - entity: sensor.toronto_temperature
        name: Outside
      - entity: sensor.desk_sensor_temperature
        name: Inside
  size: [760, 300]
  selector: '#lcards-release-card'

- name: chart-studio
  card:
    type: custom:lcards-chart
    chart_type: line
    height: 300
    graph_span: 24h
    sources:
      - entity: sensor.desk_sensor_temperature
        name: Bridge
  editor: true
  open: _openChartStudio
  settle: 4000
  selector: 'lcards-chart-studio-dialog wa-dialog [part~="dialog"]'

- name: data-grid
  card:
    type: custom:lcards-data-grid
    data_mode: data
    rows:
      - values: [System, Status]
        header: true
      - - Test value
        - value: input_number.lcards_test_value
          style:
            color:
              default: var(--lcars-green)
              above:50: var(--lcars-yellow)
              above:80: var(--lcars-red)
      - - Toggle
        - value: input_boolean.lcards_test_toggle
          style:
            background:
              default: transparent
              'on': var(--lcars-orange)
      - - Mode
        - value: input_select.lcards_test_mode
    grid:
      grid-template-columns: 1fr 1fr
    style:
      font_size: 22px
  steps:
    - service: [input_number, set_value, { entity_id: input_number.lcards_test_value, value: 64 }]
    - service: [input_boolean, turn_on, { entity_id: input_boolean.lcards_test_toggle }]
    - wait: 1500
  size: [600, 0]
  selector: '#lcards-release-card'
  padding: 16

- name: processor-preview
  card: { type: custom:lcards-elbow, elbow: { type: header-left } }
  editor: true
  steps:
    - eval: |
        (async () => {
          await customElements.whenDefined('lcards-datasource-studio-dialog');
          const ha = document.querySelector('home-assistant');
          const dialog = document.createElement('lcards-datasource-studio-dialog');
          dialog.hass = ha.hass;
          dialog.mode = 'edit';
          dialog.sourceName = 'bridge';
          dialog.sourceConfig = {
            entity: 'sensor.desk_sensor_temperature',
            history: { hours: 48 },
            processing: {
              average: { type: 'smooth', method: 'moving_average', window: 12 },
              exponential: { type: 'smooth', method: 'exponential', alpha: 0.1 },
            },
          };
          ha.shadowRoot.appendChild(dialog);
          dialog.open = true;
          await dialog.updateComplete;
        })()
    - wait: 1500
    - click: 'lcards-datasource-studio-dialog ha-tab-group-tab:has-text("Processing")'
    - wait: 5000
  selector: 'lcards-datasource-studio-dialog wa-dialog [part~="dialog"]'

- name: provenance
  card:
    type: custom:lcards-button
    id: warp_core
    entity: input_boolean.lcards_test_toggle
    preset: lozenge
    style: { card: { color: { background: { active: 'theme:colors.ui.primary', inactive: '#333366' } } } }
  editor: true
  steps:
    - eval: |
        (() => {
          const ha = document.querySelector('home-assistant');
          const card = document.createElement('lcards-button');
          card.setConfig({ type: 'custom:lcards-button', id: 'warp_core', entity: 'input_boolean.lcards_test_toggle', preset: 'lozenge',
            style: { card: { color: { background: { active: 'theme:colors.ui.primary', inactive: '#333366' } } } } });
          card.hass = ha.hass;
          card.style.cssText = 'position:fixed;left:-2000px;width:300px';
          ha.shadowRoot.appendChild(card);
        })()
    - click: 'role=tab[name=/Main Engineering/]'
    - wait: 800
    - click: '#lcards-release-editor >> role=tab[name="Provenance"]'
    - wait: 1500
    - click: 'lcards-provenance-tab >> role=button[name="Open inspector"]'
    - wait: 1500
    - type: ['lcards-provenance-tab ha-dialog ha-input.search input', 'background.active']
    - wait: 600
    - click: 'lcards-provenance-tab ha-dialog .field-row[data-path="style.card.color.background.active"]'
    - wait: 1200
  selector: 'lcards-provenance-tab ha-dialog wa-dialog [part~="dialog"]'

- name: template-sandbox
  card:
    type: custom:lcards-button
    entity: input_number.lcards_test_value
    preset: lozenge
    text:
      label: { content: 'Power {{ states("input_number.lcards_test_value") | int * 12 }} kW', show: true }
  editor: true
  steps:
    - click: 'role=tab[name=/Main Engineering/]'
    - wait: 800
    - click: '#lcards-release-editor >> role=tab[name="Templates"]'
    - wait: 1500
    - click: 'lcards-template-evaluation-tab >> role=button[name="Open in sandbox"]'
    - wait: 2500
  selector: 'lcards-template-sandbox ha-dialog wa-dialog [part~="dialog"]'

- name: health-check
  path: /lcards-config
  settle: 5000
  viewport: [1400, 1200]
  selector: 'lcards-about-tab .section:has-text("Support & system info")'

- name: slider-drag-badge
  kind: video
  card:
    type: custom:lcards-slider
    entity: input_number.lcards_test_value
    preset: pills-basic
    drag_badge:
      enabled: true
      format: { decimals: 0 }
  steps:
    - service: [input_number, set_value, { entity_id: input_number.lcards_test_value, value: 20 }]
    - wait: 1500
  video_steps:
    - wait: 500
    - drag: ['#lcards-release-card', 0.2, 0.75, 1800]
    - wait: 600
    - drag: ['#lcards-release-card', 0.75, 0.4, 1200]
  duration: 1500
  size: [600, 64]
  viewport: [900, 400]
  selector: '#lcards-release-card'
  padding: 48

# The card editor's YAML tab: completion for the key being typed and the "Options here"
# panel.
- name: yaml-editor
  card:
    type: custom:lcards-button
    entity: input_boolean.lcards_test_toggle
    preset: filled
    text:
      name:
        content: Warp Core
  editor: true
  steps:
    - wait: 1000
    - click: '#lcards-release-editor >> role=tab[name="YAML"]'
    - wait: 2000
    - eval: |
        (async () => {
          const find = (r) => { for (const n of r.querySelectorAll('*')) { if (n.tagName === 'LCARDS-YAML-EDITOR') return n; const x = n.shadowRoot && find(n.shadowRoot); if (x) return x; } return null; };
          const el = find(document);
          const view = el._editorView;
          view.focus();
          // Start typing a new top-level key at the end (the doc ends with a newline).
          const text = view.state.doc.toString().replace(/\n+$/, '\n');
          view.dispatch({ changes: { from: 0, to: view.state.doc.length, insert: text } });
          const at = view.state.doc.length;
          view.dispatch({ changes: { from: at, insert: 'anim' }, selection: { anchor: at + 4 }, userEvent: 'input.type' });
        })()
    - wait: 2500
  selector: '#lcards-release-editor'
  padding: 8

# A rule's Apply section edited as YAML in context: completion in warp_core's patch lists
# the button's own options; the Options here panel shows where the cursor is.
- name: rule-apply
  card:
    type: custom:lcards-button
    id: warp_core
    entity: input_boolean.lcards_test_toggle
    preset: filled
  editor: true
  steps:
    - eval: |
        (async () => {
          const ha = document.querySelector('home-assistant');
          // Cards on the page, so the Apply schema has targets.
          for (const [id, name] of [['warp_core', 'Warp Core'], ['shields', 'Shields']]) {
            const card = document.createElement('lcards-button');
            card.setConfig({ type: 'custom:lcards-button', id, entity: 'input_boolean.lcards_test_toggle', preset: 'filled', tags: ['engineering'], text: { name: { content: name } } });
            card.hass = ha.hass;
            card.style.cssText = 'position:fixed;left:-2000px;width:300px';
            ha.shadowRoot.appendChild(card);
          }
          await customElements.whenDefined('lcards-rule-editor-dialog');
          const find = (r, tag) => { for (const n of r.querySelectorAll('*')) { if (n.tagName === tag) return n; const x = n.shadowRoot && find(n.shadowRoot, tag); if (x) return x; } return null; };
          const dialog = document.createElement('lcards-rule-editor-dialog');
          dialog.hass = ha.hass;
          dialog.mode = 'edit';
          dialog.editor = find(document, 'LCARDS-BUTTON-EDITOR');
          dialog.rule = {
            id: 'warp_core_online', name: 'Warp core online',
            when: { entity: 'input_boolean.lcards_test_toggle', state: 'on' },
            apply: { overlays: { warp_core: { style: { card: { color: { background: 'var(--lcards-orange)' } } } } } },
          };
          ha.shadowRoot.appendChild(dialog);
          dialog.open = true;
          await dialog.updateComplete;
        })()
    - wait: 2500
    - eval: |
        (async () => {
          const find = (r, tag) => { for (const n of r.querySelectorAll('*')) { if (n.tagName === tag) return n; const x = n.shadowRoot && find(n.shadowRoot, tag); if (x) return x; } return null; };
          const apply = find(document, 'LCARDS-RULE-APPLY-EDITOR');
          const yamlEditor = find(apply.shadowRoot, 'LCARDS-YAML-EDITOR');
          const view = yamlEditor._editorView;
          // The new line's indent is trailing whitespace; its marker would read as an error here.
          const quiet = document.createElement('style');
          quiet.textContent = '.cm-trailingSpace { background: none !important; }';
          yamlEditor.shadowRoot.appendChild(quiet);
          view.focus();
          // The cursor on a new line in warp_core's patch (Ctrl+Space then lists the
          // button's own options; an empty line keeps the YAML valid).
          const text = view.state.doc.toString().replace(/\n+$/, '') + '\n    ';
          view.dispatch({ changes: { from: 0, to: view.state.doc.length, insert: text }, selection: { anchor: text.length } });
        })()
    - wait: 800
    - press: Control+Space
    - wait: 2000
  viewport: [1400, 1500]
  selector: 'lcards-rule-apply-editor'
  padding: 12
