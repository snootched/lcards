# Pictures for doc/releases/2026.11.0.md: node scripts/release-shots.mjs 2026.11.0
# The dev HA's own sensors carry personal names (city, utility): use the desk sensor in
# anything that shows entity ids, and charts show the others only by `name:`.

# Charts: the docs' weather panel (two Y axes, thresholds, grouped history) beside the
# a fortnight of daily lows and highs from long-term statistics (a range area).
- name: chart
  card:
    type: custom:lcards-layout-card
    layout:
      height: 380px
      grid-gap: 16px
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)
      grid-template-areas: '"weather range"'
    cards:
      - type: custom:lcards-chart
        view_layout: { grid-area: weather }
        chart_type: area
        height: 380
        graph_span: 48h
        yaxis:
          - id: temperature
          - { id: humidity, opposite: true, min: 0, max: 100, decimals: 0 }
        sources:
          - { entity: sensor.toronto_temperature, name: Temperature, unit: °C, float_precision: 1, opacity: 0.35, group_by: { func: avg, duration: 30min } }
          - { entity: sensor.toronto_humidity, name: Humidity, type: line, yaxis_id: humidity, stroke_dash: 4, group_by: { func: avg, duration: 30min } }
        style:
          colors: { series: [var(--lcars-orange), var(--lcars-blue)] }
          thresholds:
            - { value: 8, label: Cold, color: var(--lcars-blue), dash: true }
            - { value: 15, label: Warm, color: var(--lcars-red) }
          legend: { show: true, position: top }
          formatters: { xaxis_label: ddd HH:mm }
      - type: custom:lcards-chart
        view_layout: { grid-area: range }
        chart_type: rangeArea
        height: 380
        graph_span: 14d
        sources:
          - { entity: sensor.toronto_temperature, name: Daily low to high, unit: °C, float_precision: 1, statistics: { type: mean, period: day } }
        style:
          colors: { series: [var(--lcars-blue)] }
          legend: { show: true, position: top }
          yaxis: { decimals: 0 }
  steps:
    - wait: 3000
  size: [1400, 380]
  viewport: [1600, 600]
  selector: '#lcards-release-card'
  padding: 16

- name: chart-studio
  card:
    type: custom:lcards-chart
    chart_type: line
    height: 300
    graph_span: 24h
    sources:
      - entity: sensor.desk_sensor_temperature
        name: Bridge
  editor: true
  open: _openChartStudio
  settle: 4000
  selector: 'lcards-chart-studio-dialog wa-dialog [part~="dialog"]'

# Data grids: a status table whose cells recolour by state and flash as the helpers
# change, beside a decorative grid running the LCARS cascade.
- name: data-grid
  kind: video
  card:
    type: custom:lcards-layout-card
    layout:
      height: 300px
      grid-gap: 24px
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)
      grid-template-areas: '"status cascade"'
    cards:
      - type: custom:lcards-data-grid
        view_layout: { grid-area: status }
        data_mode: data
        highlight_changes: true
        rows:
          - values: [System, Status]
            header: true
          - - Warp core
            - value: input_number.lcards_test_power
              style:
                color: { default: var(--lcars-green), 'below:60': var(--lcars-yellow), 'below:35': var(--lcars-red) }
          - - Shields
            - value: input_number.lcards_test_shields
              style:
                color: { default: var(--lcars-green), 'below:60': var(--lcars-yellow), 'below:35': var(--lcars-red) }
          - - Sensor load
            - value: input_number.lcards_test_value
              style:
                color: { default: var(--lcars-green), 'above:50': var(--lcars-yellow), 'above:80': var(--lcars-red) }
          - - Main lights
            - value: input_boolean.lcards_test_toggle
              style:
                background: { default: transparent, 'on': var(--lcars-orange) }
        grid:
          grid-template-columns: 1fr 1fr
        style:
          font_size: 24px
      - type: custom:lcards-data-grid
        view_layout: { grid-area: cascade }
        data_mode: decorative
        format: digit
        refresh_interval: 1500
        refresh_cells: 0.15
        highlight_changes: true
        grid:
          grid-template-rows: repeat(8, auto)
          grid-template-columns: repeat(10, 1fr)
          gap: 0px
        style:
          font_size: 20px
        animations:
          - trigger: on_load
            preset: cascade-color
            params:
              pattern: niagara
              colors: { start: var(--lcars-orange), text: var(--lcars-red), end: var(--lcars-yellow) }
  steps:
    - service: [input_number, set_value, { entity_id: input_number.lcards_test_power, value: 92 }]
    - service: [input_number, set_value, { entity_id: input_number.lcards_test_shields, value: 88 }]
    - service: [input_number, set_value, { entity_id: input_number.lcards_test_value, value: 30 }]
    - service: [input_boolean, turn_off, { entity_id: input_boolean.lcards_test_toggle }]
    - wait: 2000
  video_steps:
    - wait: 1200
    - service: [input_boolean, turn_on, { entity_id: input_boolean.lcards_test_toggle }]
    - wait: 1200
    - service: [input_number, set_value, { entity_id: input_number.lcards_test_shields, value: 55 }]
    - wait: 1200
    - service: [input_number, set_value, { entity_id: input_number.lcards_test_value, value: 72 }]
    - wait: 1200
    - service: [input_number, set_value, { entity_id: input_number.lcards_test_shields, value: 24 }]
    - wait: 1000
    - service: [input_number, set_value, { entity_id: input_number.lcards_test_power, value: 48 }]
    - wait: 1200
    - service: [input_number, set_value, { entity_id: input_number.lcards_test_value, value: 91 }]
    - wait: 1600
    - service: [input_number, set_value, { entity_id: input_number.lcards_test_shields, value: 88 }]
    - service: [input_number, set_value, { entity_id: input_number.lcards_test_power, value: 92 }]
    - wait: 1200
    - service: [input_number, set_value, { entity_id: input_number.lcards_test_value, value: 30 }]
    - service: [input_boolean, turn_off, { entity_id: input_boolean.lcards_test_toggle }]
  duration: 1200
  size: [1300, 300]
  viewport: [1500, 500]
  selector: '#lcards-release-card'
  padding: 16

- name: processor-preview
  card: { type: custom:lcards-elbow, elbow: { type: header-left } }
  editor: true
  steps:
    - eval: |
        (async () => {
          await customElements.whenDefined('lcards-datasource-studio-dialog');
          const ha = document.querySelector('home-assistant');
          const dialog = document.createElement('lcards-datasource-studio-dialog');
          dialog.hass = ha.hass;
          dialog.mode = 'edit';
          dialog.sourceName = 'bridge';
          dialog.sourceConfig = {
            entity: 'sensor.desk_sensor_temperature',
            history: { hours: 48 },
            processing: {
              average: { type: 'smooth', method: 'moving_average', window: 12 },
              exponential: { type: 'smooth', method: 'exponential', alpha: 0.1 },
            },
          };
          ha.shadowRoot.appendChild(dialog);
          dialog.open = true;
          await dialog.updateComplete;
        })()
    - wait: 1500
    - click: 'lcards-datasource-studio-dialog ha-tab-group-tab:has-text("Processing")'
    - wait: 5000
