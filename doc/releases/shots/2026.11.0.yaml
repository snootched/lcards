# Grid wells: a gravity well with a polar grid, ripples running down into the throat.
- name: grid-wells
  kind: video
  duration: 5000
  card:
    type: custom:lcards-elbow
    elbow:
      type: frame
      segment: { color: var(--lcards-gray) }
      frame: { bar_width: 4, bar_height: 4, outer_curve: 10 }
    background_animation:
      inset: auto
      effects:
        - preset: grid
          config: { surface: well, well_profile: [1.1, 0.5, 0.2, 0.12, 0.1], well_ripple: 0.12, well_ripple_speed: 0.6, pattern: polar, spoke_count: 24, line_spacing: 18, camera_tilt: 40, color: var(--lcards-orange), color_major: var(--lcards-moonlight), major_row_interval: 4 }
  steps:
    - wait: 1500
  selector: '#lcards-release-card'
  padding: 24
  size: [700, 360]

# Astrometrics: the galaxy reference (disc, territories, beams, a planet with orbits).
- name: astrometrics
  card:
    type: custom:lcards-astrometrics-card
    height: 620
    camera:
      view: galaxy
      views:
        galaxy: {target: core, yaw: 20, tilt: 35, distance: 280}
        map: {target: core, tilt: 90, distance: 300}
        dive: {target: [10, 2, 20], yaw: 200, tilt: 4, distance: 90}
        planet: {target: nimbus, yaw: 60, tilt: 20, distance: 40}
    backdrop:
      stars:
        count: 2500
    points:
      - id: core
        xyz: [0, 0, 0]
        label: GALACTIC CORE
        style: title
      - id: sagittarius
        polar: [45, 300]
        label: Sagittarius Arm
        style: major
      - id: perseus
        polar: [70, 225]
        label: Perseus Arm
        style: major
      - id: federation
        polar: [75, 135]
        'y': 22
        label: FEDERATION
        style: major
        color: var(--lcars-blue)
      - id: borg
        polar: [30, 345]
        'y': 44
        label: BORG SPACE
        style: major
        color: var(--lcars-green)
      - id: talos
        polar: [52, 310]
        marker: dot
        label: Talos IV
        style: tiny
        max_distance: 200
        tap_action: {action: fly-to}
      - id: vega
        polar: [64, 160]
        marker: triangle
        label: Vega
        style: minor
      - id: rigel
        polar: [88, 95]
        marker: diamond
        label: Rigel
        style: minor
      - id: deneb
        polar: [40, 60]
        marker: dot
        label: Deneb
        style: tiny
      - id: nimbus
        polar: [72, 236]
        'y': 12
        marker: reticle
        label: NIMBUS III
        style: minor
      - id: away
        latlon: [10, 40]
        'on': planet
        alt: 0.3
        marker: dot
        label: AWAY TEAM
        style: tiny
        color: var(--lcars-orange)
      - id: outpost
        latlon: [-20, 200]
        'on': planet
        alt: 0.3
        marker: dot
        label: OUTPOST
        style: tiny
        color: var(--lcars-orange)
    objects:
      - type: grid
        shape: disc
        radius: 100
        pattern: polar
        line_spacing: 10
        spoke_count: 36
        major_row_interval: 3
        color: theme:colors.ui.tertiary
        ring_labels: {step: 10, radius: 106}
      - type: ring
        radius: 100
        width: 3
        color: theme:colors.ui.secondary
      - type: ring
        radius: 30
        width: 2
        color: theme:colors.ui.secondary
      - type: volume
        id: federation_space
        shape: sector
        radius: [55, 95]
        angle: [100, 170]
        height: [-6, 18]
        cells: {ring: 10, angle: 10, layer: 8}
        color: var(--lcars-blue)
        tap_action: {action: fly-to}
      - type: volume
        id: borg_space
        shape: sector
        radius: [18, 42]
        angle: [330, 360]
        height: [0, 40]
        color: var(--lcars-green)
      - type: glow
        at: core
        size: 70
        color: var(--lcars-yellow)
      - type: beam
        from: [-180, 0, 0]
        to: [180, 0, 0]
        color: theme:colors.ui.secondary
      - type: beam
        from: [0, 0, -180]
        to: [0, 0, 180]
        width: 10
        color: var(--lcars-ui-primary)
      - type: path
        points: [talos, vega]
        arc: 12
        dash: [6, 4]
        color: var(--lcars-orange)
      - type: path
        points: [deneb, rigel]
        arc: 8
        dash: [3, 3]
        color: var(--lcars-orange)
        color_to: var(--lcars-yellow)
        glow: true
      - type: sphere
        id: planet
        at: nimbus
        radius: 7
        spin: 6
        color: var(--lcars-blue)
      - type: ring
        at: nimbus
        radius: [14, 12]
        inclination: 20
        width: 1.5
        color: var(--lcars-blue)
      - type: ring
        at: nimbus
        radius: 19
        inclination: -35
        node: 40
        dash: [4, 3]
        color: var(--lcars-blue)
  steps:
    - wait: 4000
  size:
    - 1300
    - 620
  viewport:
    - 1500
    - 800
  selector: '#lcards-release-card'
  padding: 0

# The Astrometrics Studio's Starters tab: a planet with moons about to be added to the solar system.
- name: astrometrics-studio
  card:
    type: custom:lcards-astrometrics-card
    height: 560
    points:
      - { id: sun, xyz: [0, 0, 0], label: SOL, style: major }
      - id: mercury
        polar: [20, 40]
        object: mercury_orbit
        marker: dot
        label: MERCURY
        style: minor
        tap_action: { action: fly-to }
      - { id: venus, polar: [30, 150], object: venus_orbit, marker: dot, label: VENUS, style: minor, tap_action: { action: fly-to } }
      - { id: earth, polar: [42, 250], object: earth_orbit, marker: dot, label: EARTH, style: minor, tap_action: { action: fly-to } }
      - { id: mars, polar: [56, 320], object: mars_orbit, marker: dot, label: MARS, style: minor, tap_action: { action: fly-to } }
      - id: jupiter
        polar: [82, 100]
        object: jupiter_orbit
        marker: dot
        label: JUPITER
        style: minor
        tap_action: { action: fly-to }
      - { id: moon, polar: [5, 0], object: moon_orbit, marker: dot, label: LUNA, style: tiny, max_distance: 80 }
    objects:
      - { type: glow, at: sun, size: 40, color: var(--lcars-yellow) }
      - type: sphere
        id: sun_body
        at: sun
        radius: 5
        fill_color: var(--lcars-yellow)
        color: var(--lcars-orange)
        line_spacing_deg: 30
      - { type: ring, id: mercury_orbit, radius: 20, spin: 24, width: 1, color: theme:colors.ui.secondary, opacity: 0.6 }
      - { type: sphere, id: mercury_body, at: mercury, radius: 1.2, line_spacing_deg: 30, spin: 15 }
      - { type: ring, id: venus_orbit, radius: 30, spin: 16, width: 1, color: theme:colors.ui.secondary, opacity: 0.6 }
      - { type: sphere, id: venus_body, at: venus, radius: 2, line_spacing_deg: 30, spin: 15 }
      - { type: ring, id: earth_orbit, radius: 42, spin: 10, width: 1, color: theme:colors.ui.secondary, opacity: 0.6 }
      - { type: sphere, id: earth_body, at: earth, radius: 2.4, image: builtin:earth_blue_marble, line_spacing_deg: 30, spin: 20 }
      - { type: ring, id: mars_orbit, radius: 56, spin: 6, width: 1, color: theme:colors.ui.secondary, opacity: 0.6 }
      - { type: sphere, id: mars_body, at: mars, radius: 1.6, line_spacing_deg: 30, spin: 15 }
      - { type: ring, id: jupiter_orbit, radius: 82, spin: 2.5, width: 1, color: theme:colors.ui.secondary, opacity: 0.6 }
      - { type: sphere, id: jupiter_body, at: jupiter, radius: 5, line_spacing_deg: 30, spin: 15 }
      - { type: ring, id: moon_orbit, at: earth, radius: 5, spin: 40, width: 1, dash: [3, 3], opacity: 0.6 }
      - { type: sphere, id: moon_body, at: moon, radius: 0.6, line_spacing_deg: 45 }
    camera:
      view: system
      views:
        system: { target: sun, yaw: 20, tilt: 40, distance: 230 }
        top: { target: sun, tilt: 90, distance: 250 }
        earth: { target: earth, yaw: 30, tilt: 20, distance: 22 }
    backdrop: { stars: { count: 2000 } }
  editor: true
  open: _openStudio
  steps:
    - wait: 3000
    - click: 'lcards-astrometrics-studio-dialog ha-tab-group-tab:has-text("Starters")'
    - wait: 800
    - click: 'lcards-astrometrics-studio-dialog lcards-form-section[data-starter="planet"] [slot="header"] span >> nth=0'
    - wait: 600
    - eval: 'const f = (r) => r.querySelector(`lcards-form-section[data-starter="planet"]`) ?? [...r.querySelectorAll("*")].filter((e) => e.shadowRoot).map((e) => f(e.shadowRoot)).find(Boolean); f(document)?.scrollIntoView({ block: "start" })'
    - wait: 600
  settle: 4000
  viewport: [1400, 900]
  selector: 'lcards-astrometrics-studio-dialog wa-dialog [part~="dialog"]'
