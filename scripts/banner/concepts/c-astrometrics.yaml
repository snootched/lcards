# Concept C, astrometrics: the title in a small classic frame, a live 3D scene
# with the Galaxy-class model turning slowly on the right.
type: custom:lcards-layout-card
layout:
  height: 300px
  grid-gap: 6px
  grid-template-columns: 120px minmax(0, 1fr) 620px
  grid-template-rows: 36px minmax(0, 1fr) minmax(0, 1fr) 26px
  grid-template-areas: |
    "corner bar scene"
    "side title scene"
    "side byline scene"
    "fcorner fbar scene"
cards:
  - type: custom:lcards-elbow
    view_layout:
      grid-area: corner
    elbow:
      type: header-left
      segment:
        bar_width: 120
        bar_height: 36
        color: var(--lcars-bluey)
  - type: custom:lcards-button
    view_layout:
      grid-area: bar
    preset: panel-light
    min_height: 0
    text:
      label:
        content: ASTROMETRICS
        position: bottom-right
    style:
      card:
        color:
          background:
            default: var(--lcars-bluey)
  - type: custom:lcards-layout-card
    view_layout:
      grid-area: side
    layout:
      grid-gap: 6px
      grid-template-columns: minmax(0, 1fr)
      grid-template-rows: 2fr 1fr 3fr
    cards:
      - type: custom:lcards-button
        preset: panel-light
        min_height: 0
        text:
          label:
            content: 03-118
        style:
          card:
            color:
              background:
                default: var(--lcars-african-violet)
      - type: custom:lcards-button
        preset: panel-light
        min_height: 0
        text:
          label:
            content: "47"
        style:
          card:
            color:
              background:
                default: var(--lcars-alt-orange)
      - type: custom:lcards-button
        preset: panel-light
        min_height: 0
        text:
          label:
            content: 1701-D
        style:
          card:
            color:
              background:
                default: var(--lcars-bluey)
  - type: custom:lcards-button
    view_layout:
      grid-area: title
    preset: text-only
    min_height: 0
    text:
      label:
        content: LCARdS
        show: true
        text_transform: none
        position: bottom-left
        font_size: 88
        color: var(--lcars-alt-orange)
  - type: custom:lcards-button
    view_layout:
      grid-area: byline
    preset: text-only
    min_height: 0
    text:
      label:
        content: LCARS CARDS FOR HOME ASSISTANT
        show: true
        position: top-left
        font_size: 24
        color: var(--lcars-bluey)
  - type: custom:lcards-elbow
    view_layout:
      grid-area: fcorner
    elbow:
      type: footer-left
      segment:
        bar_width: 120
        bar_height: 26
        color: var(--lcars-bluey)
  - type: custom:lcards-button
    view_layout:
      grid-area: fbar
    preset: panel-light
    min_height: 0
    text:
      label:
        content: SECTOR 001
        position: bottom-right
    style:
      card:
        color:
          background:
            default: var(--lcars-african-violet)
  - type: custom:lcards-astrometrics-card
    id: banner_scene
    view_layout:
      grid-area: scene
    height: 300
    camera:
      view: ship
      buttons: false
      auto_rotate: 6
      views:
        ship:
          target: [0, 0, 0]
          yaw: 40
          tilt: 14
          distance: 78
    backdrop:
      stars:
        count: 1500
    points:
      - id: ship_at
        xyz: [0, 0, 0]
    objects:
      - type: model
        id: galaxy
        src: builtin:galaxy_class
        at: ship_at
        size: 64.25
        scan:
          period: 6
        animation: all
