# Concept E, the wormhole: a live astrometrics wormhole (swirling funnel, vortex,
# glow) beside the title, thin Picard bars along the top and bottom.
type: custom:lcards-layout-card
layout:
  height: 300px
  grid-gap: 0px
  grid-template-columns: 430px minmax(0, 1fr)
  grid-template-rows: 300px
cards:
  - type: custom:lcards-astrometrics-card
    view_layout:
      grid-area: 1 / 2
    id: banner_wormhole
    height: 300
    camera:
      view: wide
      buttons: false
      controls: false
      auto_rotate: 3
      views:
        wide:
          target: [0, 0, 0]
          yaw: 20
          tilt: 28
          distance: 27
    backdrop:
      stars:
        count: 2500
    points:
      - id: mouth
        xyz: [0, 0, 0]
      - id: down
        at: mouth
        offset: [0, -1000, 0]
    objects:
      - type: grid
        id: funnel
        shape: well
        well:
          shape: trumpet
          throat: 0.07
        at: mouth
        face: down
        radius: 11
        depth: 7
        line_width: 0
        edges: false
        fill:
          effect:
            type: swirl
            colors: [var(--lcards-moonlight), var(--lcards-orange-lightest), var(--lcars-violet), var(--lcards-blue-medium), var(--lcars-violet), var(--lcards-blue-medium-dark), var(--lcards-blue-medium), var(--lcards-blue-dark)]
            speed: 2.7
            turbulence: 0.8
            num_octaves: 5
        deform:
          - type: twist
            angle: 80
            anchor: top
            period: 6
      - type: galaxy
        id: vortex
        at: mouth
        face: down
        radius: 11
        arms:
          count: 4
          pitch: 20
          color: var(--lcards-blue-light)
        bar:
          length: 0
        thickness: 0.02
        stars:
          count: 8000
        seed: 4
        glow: 0
        dust:
          amount: 0
        core:
          color: var(--lcards-moonlight)
        spin: 15
      - type: glow
        id: heart
        at: mouth
        color: var(--lcards-orange-lightest)
        size: 6
  # the frame: thin bars top and bottom, an elbow sweep at the left
  - type: custom:lcards-layout-card
    view_layout:
      grid-area: 1 / 1 / 2 / 3
    layout:
      grid-gap: 5px
      grid-template-columns: 160px 300px 6px minmax(0, 1fr) 6px 90px
      grid-template-rows: 14px minmax(0, 1fr) minmax(0, 1fr) 14px
      grid-template-areas: |
        "corner t1 . t2 . t3"
        "corner title . . . ."
        "fcorner byline . . . ."
        "fcorner b1 . b2 . b3"
    cards:
      - type: custom:lcards-elbow
        view_layout:
          grid-area: corner
        elbow:
          type: header-left
          segment:
            bar_width: 40
            bar_height: 14
            outer_curve: 40
            color: theme:colors.ui.primary
      - type: custom:lcards-elbow
        view_layout:
          grid-area: fcorner
        elbow:
          type: footer-left
          segment:
            bar_width: 40
            bar_height: 14
            outer_curve: 40
            color: theme:colors.ui.primary
      - type: custom:lcards-button
        view_layout:
          grid-area: t1
        preset: panel-light
        min_height: 0
        text:
          label:
            show: false
        style:
          card:
            color:
              background:
                default: theme:colors.ui.primary
      - type: custom:lcards-button
        view_layout:
          grid-area: t2
        preset: panel-light
        min_height: 0
        text:
          label:
            show: false
        style:
          card:
            color:
              background:
                default: theme:colors.ui.quaternary
      - type: custom:lcards-button
        view_layout:
          grid-area: t3
        preset: panel-light
        min_height: 0
        text:
          label:
            show: false
        style:
          card:
            color:
              background:
                default: var(--lcars-alt-orange)
      - type: custom:lcards-button
        view_layout:
          grid-area: b1
        preset: panel-light
        min_height: 0
        text:
          label:
            show: false
        style:
          card:
            color:
              background:
                default: theme:colors.ui.primary
      - type: custom:lcards-button
        view_layout:
          grid-area: b2
        preset: panel-light
        min_height: 0
        text:
          label:
            show: false
        style:
          card:
            color:
              background:
                default: theme:colors.ui.quaternary
      - type: custom:lcards-button
        view_layout:
          grid-area: b3
        preset: panel-light
        min_height: 0
        text:
          label:
            show: false
        style:
          card:
            color:
              background:
                default: theme:colors.ui.primary
      - type: custom:lcards-button
        view_layout:
          grid-area: title
        preset: text-only
        min_height: 0
        interactive: false
        text:
          label:
            content: LCARdS
            show: true
            text_transform: none
            position: bottom-left
            font_size: 88
            color: var(--lcars-alt-orange)
      - type: custom:lcards-button
        view_layout:
          grid-area: byline
        preset: text-only
        min_height: 0
        interactive: false
        text:
          label:
            content: LCARS CARDS FOR HOME ASSISTANT
            show: true
            position: top-left
            font_size: 26
            color: var(--lcars-space-white)
