# Concept G, sciences: WebGL backgrounds on one card (a holo-sphere planet over
# a polar grid floor) beside the title, thin Picard bars along the top and bottom.
type: custom:lcards-layout-card
layout:
  height: 300px
  grid-gap: 0px
  grid-template-columns: 430px minmax(0, 1fr)
  grid-template-rows: 300px
cards:
  - type: custom:lcards-button
    view_layout:
      grid-area: 1 / 2
    preset: text-only
    min_height: 0
    interactive: false
    background_animation:
      - preset: grid
        config:
          pattern: polar
          view: floor
          camera_tilt: 22
          spoke_count: 24
          major_row_interval: 4
          major_col_interval: 6
          color: var(--lcards-blue-light)
          color_major: var(--lcards-moonlight)
          speed: 0.6
      - preset: holo-sphere
        config:
          size: 1.1
          position_x: 0.55
          tilt: 18
          rotate_speed: 2
  # the frame: thin bars top and bottom, an elbow sweep at the left
  - type: custom:lcards-layout-card
    view_layout:
      grid-area: 1 / 1 / 2 / 3
    layout:
      grid-gap: 5px
      grid-template-columns: 160px 300px 6px minmax(0, 1fr) 6px 90px
      grid-template-rows: 14px minmax(0, 1fr) minmax(0, 1fr) 14px
      grid-template-areas: |
        "corner t1 . t2 . t3"
        "corner title . . . ."
        "fcorner byline . . . ."
        "fcorner b1 . b2 . b3"
    cards:
      - type: custom:lcards-elbow
        view_layout:
          grid-area: corner
        elbow:
          type: header-left
          segment:
            bar_width: 40
            bar_height: 14
            outer_curve: 40
            color: theme:colors.ui.primary
      - type: custom:lcards-elbow
        view_layout:
          grid-area: fcorner
        elbow:
          type: footer-left
          segment:
            bar_width: 40
            bar_height: 14
            outer_curve: 40
            color: theme:colors.ui.primary
      - type: custom:lcards-button
        view_layout:
          grid-area: t1
        preset: panel-light
        min_height: 0
        text:
          label:
            show: false
        style:
          card:
            color:
              background:
                default: theme:colors.ui.primary
      - type: custom:lcards-button
        view_layout:
          grid-area: t2
        preset: panel-light
        min_height: 0
        text:
          label:
            show: false
        style:
          card:
            color:
              background:
                default: theme:colors.ui.quaternary
      - type: custom:lcards-button
        view_layout:
          grid-area: t3
        preset: panel-light
        min_height: 0
        text:
          label:
            show: false
        style:
          card:
            color:
              background:
                default: var(--lcars-alt-orange)
      - type: custom:lcards-button
        view_layout:
          grid-area: b1
        preset: panel-light
        min_height: 0
        text:
          label:
            show: false
        style:
          card:
            color:
              background:
                default: theme:colors.ui.primary
      - type: custom:lcards-button
        view_layout:
          grid-area: b2
        preset: panel-light
        min_height: 0
        text:
          label:
            show: false
        style:
          card:
            color:
              background:
                default: theme:colors.ui.quaternary
      - type: custom:lcards-button
        view_layout:
          grid-area: b3
        preset: panel-light
        min_height: 0
        text:
          label:
            show: false
        style:
          card:
            color:
              background:
                default: theme:colors.ui.primary
      - type: custom:lcards-button
        view_layout:
          grid-area: title
        preset: text-only
        min_height: 0
        interactive: false
        text:
          label:
            content: LCARdS
            show: true
            text_transform: none
            position: bottom-left
            font_size: 88
            color: var(--lcars-alt-orange)
      - type: custom:lcards-button
        view_layout:
          grid-area: byline
        preset: text-only
        min_height: 0
        interactive: false
        text:
          label:
            content: LCARS CARDS FOR HOME ASSISTANT
            show: true
            position: top-left
            font_size: 26
            color: var(--lcars-space-white)
