# Design reference galaxy: galaxy disc, territories, a spinning planet (astrometrics.spec.js, visual baseline).
# Same as tests/core/fixtures/astro-references.yaml (galaxy); tests/docs/astrometrics-config.test.js keeps them equal.
type: custom:lcards-astrometrics-card
height: 420
camera:
  view: galaxy
  views:
    galaxy:
      target: core
      yaw: 20
      tilt: 35
      distance: 280
    map:
      target: core
      tilt: 90
      distance: 300
    dive:
      target:
        - 10
        - 2
        - 20
      yaw: 200
      tilt: 4
      distance: 90
    planet:
      target: nimbus
      yaw: 60
      tilt: 20
      distance: 40
backdrop:
  stars:
    count: 2500
points:
  - id: core
    xyz:
      - 0
      - 0
      - 0
    label: GALACTIC CORE
    style: title
  - id: sagittarius
    polar:
      - 45
      - 300
    label: Sagittarius Arm
    style: major
  - id: perseus
    polar:
      - 70
      - 225
    label: Perseus Arm
    style: major
  - id: federation
    polar:
      - 75
      - 135
    'y': 22
    label: FEDERATION
    style: major
    color: var(--lcars-blue)
  - id: borg
    polar:
      - 30
      - 345
    'y': 44
    label: BORG SPACE
    style: major
    color: var(--lcars-green)
  - id: talos
    polar:
      - 52
      - 310
    marker: dot
    label: Talos IV
    style: tiny
    max_distance: 200
    tap_action:
      action: fly-to
  - id: vega
    polar:
      - 64
      - 160
    marker: triangle
    label: Vega
    style: minor
  - id: rigel
    polar:
      - 88
      - 95
    marker: diamond
    label: Rigel
    style: minor
  - id: deneb
    polar:
      - 40
      - 60
    marker: dot
    label: Deneb
    style: tiny
  - id: nimbus
    polar:
      - 72
      - 236
    'y': 12
    marker: reticle
    label: NIMBUS III
    style: minor
  - id: away
    latlon:
      - 10
      - 40
    'on': planet
    alt: 0.3
    marker: dot
    label: AWAY TEAM
    style: tiny
    color: var(--lcars-orange)
  - id: outpost
    latlon:
      - -20
      - 200
    'on': planet
    alt: 0.3
    marker: dot
    label: OUTPOST
    style: tiny
    color: var(--lcars-orange)
objects:
  - type: grid
    shape: disc
    radius: 100
    pattern: polar
    line_spacing: 10
    spoke_count: 36
    major_row_interval: 3
    color: theme:colors.ui.tertiary
    ring_labels:
      step: 10
      radius: 106
  - type: ring
    radius: 100
    width: 3
    color: theme:colors.ui.secondary
  - type: ring
    radius: 30
    width: 2
    color: theme:colors.ui.secondary
  - type: volume
    id: federation_space
    shape: sector
    radius:
      - 55
      - 95
    angle:
      - 100
      - 170
    height:
      - -6
      - 18
    cells:
      ring: 10
      angle: 10
      layer: 8
    color: var(--lcars-blue)
    tap_action:
      action: fly-to
  - type: volume
    id: borg_space
    shape: sector
    radius:
      - 18
      - 42
    angle:
      - 330
      - 360
    height:
      - 0
      - 40
    color: var(--lcars-green)
  - type: glow
    at: core
    size: 70
    color: var(--lcars-yellow)
  - type: beam
    from:
      - -180
      - 0
      - 0
    to:
      - 180
      - 0
      - 0
    color: theme:colors.ui.secondary
  - type: beam
    from:
      - 0
      - 0
      - -180
    to:
      - 0
      - 0
      - 180
    width: 10
    color: var(--lcars-ui-primary)
  - type: path
    points:
      - talos
      - vega
    arc: 12
    dash:
      - 6
      - 4
    color: var(--lcars-orange)
  - type: path
    points:
      - deneb
      - rigel
    arc: 8
    dash:
      - 3
      - 3
    color: var(--lcars-orange)
    color_to: var(--lcars-yellow)
    glow: true
  - type: sphere
    id: planet
    at: nimbus
    radius: 7
    spin: 6
    color: var(--lcars-blue)
  - type: ring
    around: nimbus
    radius:
      - 14
      - 12
    inclination: 20
    width: 1.5
    color: var(--lcars-blue)
  - type: ring
    around: nimbus
    radius: 19
    inclination: -35
    node: 40
    dash:
      - 4
      - 3
    color: var(--lcars-blue)
