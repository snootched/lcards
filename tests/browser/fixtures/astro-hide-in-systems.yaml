# hide_in_systems (R4d): the dive fixture with a galaxy-scale label (VEGA) and
# line (core to Sol) marked to step aside inside a star system
# (astrometrics.spec.js: shown at the galaxy, hidden at the station).
type: custom:lcards-astrometrics-card
height: 400
units: ly
backdrop:
  stars: { count: 1500 }
camera:
  view: galaxy
  views:
    galaxy: { target: core, yaw: 20, tilt: 35, distance: 140000 }
    near_sol: { target: sol, yaw: 30, tilt: 30, distance: 40 }
    system: { target: sun, yaw: 40, tilt: 35, distance: 700000000 }
    earth: { target: earth, yaw: 225, tilt: 12, distance: 70000 }
    station: { target: ds9, yaw: 330, tilt: 6, distance: 4 }
points:
  - { id: core, xyz: [0, 0, 0], label: GALACTIC CORE, style: title }
  - { id: sol, polar: [26000, 200], alt: 60, marker: dot, label: SOL, style: major }
  - { id: vega, at: sol, offset: [9, 14, -21], marker: dot, label: VEGA, style: tiny, max_distance: 2000, hide_in_systems: true }
objects:
  - { type: grid, id: disc, shape: disc, radius: 50000, pattern: polar, line_spacing: 5000, spoke_count: 36 }
  - { type: glow, at: core, size: 30000 }
  - { type: beam, id: core_line, from: core, to: sol, width: 2, hide_in_systems: true }
  - type: system
    id: sol_system
    at: sol
    units: km
    points:
      - { id: sun, xyz: [0, 0, 0] }
      - { id: earth, polar: [149597870.7, 30], marker: dot, label: EARTH, style: minor, max_distance: 3000000000 }
      - { id: moon, at: earth, offset: [-360000, 20000, -140000], label: LUNA, style: tiny, max_distance: 20000000 }
      - { id: ds9, at: earth, offset: [-21082, 0, 36515], label: DEEP SPACE 9, style: tiny, max_distance: 3000000 }
    objects:
      - { type: glow, at: sun, size: 9000000, color: var(--lcars-yellow) }
      - { type: sphere, id: sun_body, at: sun, radius: 696340, fill_color: var(--lcars-yellow), color: var(--lcars-orange) }
      - { type: ring, id: earth_orbit, radius: 149597870.7, width: 1, color: var(--lcars-blue), opacity: 0.6 }
      - { type: sphere, id: earth_body, at: earth, radius: 6371, image: builtin:earth_blue_marble, line_spacing_deg: 30, line_width: 0.5 }
      - { type: sphere, id: moon_body, at: moon, radius: 1737, image: builtin:moon_lroc, line_spacing_deg: 45, line_width: 0.5 }
      - { type: model, id: station, src: builtin:deep_space_nine, at: ds9, size: 1.452, material: original }
      - { type: path, id: shuttle_route, from: ds9, to: moon, dash: [6, 4], color: var(--lcars-orange) }
