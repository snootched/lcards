# A model on astrometrics (astro-model.spec.js): the built-in ship as a
# hologram with edges and its bussards clip. Points on its parts: bridge (on
# top), port and starboard nacelles (the side view looks at the starboard
# side, so port is behind the ship), the collector (follows the pulsing
# bussard). port carries an always card: it hides with its point.
type: custom:lcards-astrometrics-card
height: 400
camera:
  view: side
  views:
    side: { target: [0, 0, 0], yaw: 90, tilt: 4, distance: 110 }
    top: { target: [0, 0, 0], tilt: 88, distance: 120 }
points:
  - { id: bridge, object: ship, part: bridge, label: BRIDGE, marker: dot }
  - { id: starboard, object: ship, part: nacelle_starboard, label: STARBOARD, marker: dot }
  - id: port
    object: ship
    part: nacelle_port
    label: PORT
    marker: dot
    card:
      show: always
      width: 120
      card: { type: custom:lcards-button, entity: light.demo, preset: lozenge }
  - { id: collector, object: ship, part: bussard_starboard, xyz: [0, 5, 0], label: COLLECTOR, marker: diamond }
objects:
  - { type: model, id: ship, src: builtin:constitution_class_refit, size: 70, scan: { period: 5 }, animation: all }
