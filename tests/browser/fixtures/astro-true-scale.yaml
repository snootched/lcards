# E10 true scale in one scene (astrometrics.spec.js): the Sun, Earth, the Moon
# and Deep Space 9 at their real sizes and distances, in km. The station view
# (4 km out, Earth 42,000 km behind, the Sun 150 million km) needs depth
# slices; the Earth view needs the orbit ring refined so it meets Earth.
type: custom:lcards-astrometrics-card
height: 400
backdrop:
  stars: { count: 1500 }
camera:
  view: station
  views:
    system: { target: sun, yaw: 40, tilt: 35, distance: 2100000000 }
    earth: { target: earth, yaw: 225, tilt: 12, distance: 70000 }
    station: { target: ds9, yaw: 330, tilt: 6, distance: 4 }
points:
  - { id: sun, xyz: [0, 0, 0], label: SOL, style: major }
  - { id: earth, polar: [149597870.7, 30], marker: dot, label: EARTH, style: minor }
  - { id: moon, at: earth, offset: [-360000, 20000, -140000], label: LUNA, style: tiny }
  - { id: ds9, at: earth, offset: [-21082, 0, 36515], label: DEEP SPACE 9, style: tiny, max_distance: 3000000 }
objects:
  - { type: glow, at: sun, size: 9000000, color: var(--lcars-yellow) }
  - { type: sphere, id: sun_body, at: sun, radius: 696340, fill_color: var(--lcars-yellow), color: var(--lcars-orange) }
  - { type: ring, id: earth_orbit, radius: 149597870.7, width: 1, color: var(--lcars-blue), opacity: 0.6 }
  - { type: sphere, id: earth_body, at: earth, radius: 6371, image: builtin:earth_blue_marble, line_spacing_deg: 30, line_width: 0.5 }
  - { type: sphere, id: moon_body, at: moon, radius: 1737, image: builtin:moon_lroc, line_spacing_deg: 45, line_width: 0.5 }
  - { type: model, id: station, src: builtin:deep_space_nine, at: ds9, size: 1.452, material: original }
