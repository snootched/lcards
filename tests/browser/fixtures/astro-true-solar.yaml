    radius: 6371
    body: earth
    image: builtin:earth_blue_marble
    line_spacing_deg: 30
    line_width: 0.5
  - type: sphere
    id: mars_body
    at: mars
    radius: 3389.5
    body: mars
    image: builtin:mars_viking
    line_spacing_deg: 30
    line_width: 0.5
  - type: sphere
    id: ceres_body
    at: ceres
    radius: 469.7
    body: ceres
    image: builtin:ceres_dawn
    line_spacing_deg: 30
    line_width: 0.5
  - type: sphere
