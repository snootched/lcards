# W1: a swirl fill on a well (realistic mouth), a tube line drawn at a point
# (its [x, y, z] are offsets from at), and a glowing arched path (glow blends
# brightest-wins). astrometrics.spec.js reads the swirl's clock, the line
# materials and where the offset path lands.
type: custom:lcards-astrometrics-card
height: 400
camera:
  views:
    v: { target: [0, -2, 0], yaw: 20, tilt: 40, distance: 40 }
points:
  - { id: mouth, xyz: [0, 0, 0] }
  - { id: side, xyz: [20, 0, 0] }
objects:
  - type: grid
    id: funnel
    shape: well
    well: { throat: 0.07 }
    radius: 15
    depth: 5
    line_width: 0
    edges: false
    fill:
      effect: { type: swirl, colors: [var(--lcards-moonlight), var(--lcards-orange-lightest), var(--lcards-blue-medium), var(--lcards-blue-dark)], speed: 3, turbulence: 0.8 }
  - { type: path, id: pipe, at: side, points: [[0, 0, 0], [0, -10, 0]], width: 8, line_look: tube, glow: 2, pulse: true }
  - { type: path, id: arch, points: [[-15, 0, 10], [15, 0, 10]], arc: 6, width: 3, glow: 3 }
