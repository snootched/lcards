# target: background ramps the starfield's speed (background-animation.spec.js)
type: custom:lcards-button
entity: input_select.demo_mode
preset: lozenge
text:
  name:
    content: Warp
    show: true
background_animation:
  - preset: starfield
    config:
      seed: 7
animations:
  - trigger: on_entity_change
    entity: input_select.demo_mode
    to_state: Heat
    target: background
    effect: 0
    preset: custom
    params:
      speed: [1, 8]
      duration: 1500
      ease: linear
