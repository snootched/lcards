# Mixed stack (background-webgl.spec.js): a Canvas2D solid fill over the WebGL grid floor,
# then warp-starfield on top. First entry is the bottom layer.
type: custom:lcards-button
preset: lozenge
text:
  name:
    content: Stack
    show: true
background_animation:
  - preset: grid
    config:
      view: floor
      color: '#ff9966'
  - preset: solid
    config:
      color: 'rgba(0, 0, 255, 0.3)'
  - preset: warp-starfield
    config:
      seed: 3
      count: 300
