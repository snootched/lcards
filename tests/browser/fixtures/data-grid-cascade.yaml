# Decorative grid with a cascade over palette colours (alert-palette.spec.js)
type: custom:lcards-data-grid
data_mode: decorative
format: mixed
grid:
  grid-template-rows: repeat(3, auto)
  grid-template-columns: repeat(4, minmax(60px, 1fr))
animations:
  - preset: cascade-color
    params:
      colors: [var(--lcards-orange), var(--lcards-blue), var(--lcards-moonlight)]
