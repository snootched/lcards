# on_show on a data grid (on-show.spec.js)
type: custom:lcards-data-grid
data_mode: decorative
format: mixed
grid:
  grid-template-rows: repeat(2, auto)
  grid-template-columns: repeat(4, minmax(60px, 1fr))
animations:
  - trigger: on_show
    preset: fade
    params: {from: 0, to: 1, duration: 300}
