# tap-ripple from the tap point across decorative data-grid cells (new-presets.spec.js)
type: custom:lcards-data-grid
data_mode: decorative
format: hex
refresh_interval: 0
grid:
  grid-template-columns: repeat(6, 1fr)
  grid-template-rows: repeat(4, 24px)
  gap: 4px
animations:
  - trigger: on_tap
    preset: tap-ripple
    target: .grid-cell
    params:
      spread: 300
      duration: 400
