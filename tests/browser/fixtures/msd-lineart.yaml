# builtin:galaxy-class-lineart: the line-art blueprint loads, its named anchors
# resolve, and a line joins one by name (msd-lineart.spec.js)
type: custom:lcards-msd-card
msd:
  base_svg:
    source: builtin:galaxy-class-lineart
  overlays:
    - id: core_line
      type: line
      anchor: [200, 650]
      attach_to: warp_core
      route: manhattan
      style:
        color: var(--lcars-card-top-color, var(--lcards-gray-medium))
        width: 8
    - id: label
      type: control
      position: [300, 600]
      size: [300, 60]
      card:
        type: custom:lcards-button
        preset: text-only
        min_height: 0
        text:
          label:
            content: WARP CORE
            show: true
