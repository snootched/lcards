# The three design references (reports/astrometrics-design.md section 7) as
# runtime configs: tests/core/astro-scene.test.js builds them headless, the
# dev page (tools/astrometrics-spike/astro.html) renders them.
galaxy:
  camera:
    view: galaxy
    views:
      galaxy: { target: core, yaw: 20, tilt: 35, distance: 280 }
      map: { target: core, tilt: 90, distance: 300 }
      dive: { target: [10, 2, 20], yaw: 200, tilt: 4, distance: 90 }
      planet: { target: nimbus, yaw: 60, tilt: 20, distance: 40 }
  backdrop:
    stars: { count: 2500 }
  points:
    - { id: core, xyz: [0, 0, 0], label: GALACTIC CORE, style: title }
    - { id: sagittarius, polar: [45, 300], label: Sagittarius Arm, style: major }
    - { id: perseus, polar: [70, 225], label: Perseus Arm, style: major }
    - { id: federation, polar: [75, 135], alt: 22, label: FEDERATION, style: major, color: var(--lcars-blue) }
    - { id: borg, polar: [30, 345], alt: 44, label: BORG SPACE, style: major, color: var(--lcars-green) }
    - { id: talos, polar: [52, 310], marker: dot, label: Talos IV, style: tiny, max_distance: 200, tap_action: { action: fly-to } }
    - { id: vega, polar: [64, 160], marker: triangle, label: Vega, style: minor }
    - { id: rigel, polar: [88, 95], marker: diamond, label: Rigel, style: minor }
    - { id: deneb, polar: [40, 60], marker: dot, label: Deneb, style: tiny }
    - { id: nimbus, polar: [72, 236], alt: 12, marker: reticle, label: NIMBUS III, style: minor }
    - { id: away, latlon: [10, 40], object: planet, alt: 0.3, marker: dot, label: AWAY TEAM, style: tiny, color: var(--lcars-orange) }
    - { id: outpost, latlon: [-20, 200], object: planet, alt: 0.3, marker: dot, label: OUTPOST, style: tiny, color: var(--lcars-orange) }
  objects:
    - type: grid
      shape: disc
      radius: 100
      pattern: polar
      line_spacing: 10
      spoke_count: 36
      major_row_interval: 3
      color: theme:colors.ui.tertiary
      ring_labels: { step: 10, radius: 106 }
    - { type: ring, radius: 100, width: 3, color: theme:colors.ui.secondary }
    - { type: ring, radius: 30, width: 2, color: theme:colors.ui.secondary }
    - type: volume
      id: federation_space
      shape: sector
      radius: [55, 95]
      angle: [100, 170]
      height: [-6, 18]
      cells: { ring: 10, angle: 10, layer: 8 }
      color: var(--lcars-blue)
      tap_action: { action: fly-to }
    - type: volume
      id: borg_space
      shape: sector
      radius: [18, 42]
      angle: [330, 360]
      height: [0, 40]
      color: var(--lcars-green)
    - { type: glow, at: core, size: 70, color: var(--lcars-yellow) }
    - { type: beam, from: [-180, 0, 0], to: [180, 0, 0], color: theme:colors.ui.secondary }
    - { type: beam, from: [0, 0, -180], to: [0, 0, 180], width: 10, color: var(--lcars-ui-primary) }
    - { type: path, points: [talos, vega], arc: 12, dash: [6, 4], color: var(--lcars-orange) }
    - { type: path, points: [deneb, rigel], arc: 8, dash: [3, 3], color: var(--lcars-orange), color_to: var(--lcars-yellow), glow: true }
    - { type: sphere, id: planet, at: nimbus, radius: 7, spin: 6, color: var(--lcars-blue) }
    - { type: ring, at: nimbus, radius: [14, 12], inclination: 20, width: 1.5, color: var(--lcars-blue) }
    - { type: ring, at: nimbus, radius: 19, inclination: -35, node: 40, dash: [4, 3], color: var(--lcars-blue) }

sector:
  camera:
    view: map
    views:
      map: { target: [0, 0, 0], tilt: 90, distance: 1250, projection: orthographic }
    limits: { tilt: [90, 90] }
  objects:
    - type: grid
      id: sectors
      shape: plane
      size: [1200, 600]
      line_spacing: 40
      axis_labels: { columns: letters, rows: numbers, column_start: AD }
      cells:
        - { from: AF3, to: AH6, color: var(--lcars-blue), opacity: 0.3, shade: 0.25, edges: true }
        - { from: AL2, to: AO5, color: var(--lcars-green), opacity: 0.3, shade: 0.25 }
        - { from: AL9, to: AP12, color: var(--lcars-red), opacity: 0.35, shade: 0.25, edges: { width: 2, opacity: 0.6 } }
  points:
    - { id: ufp, cell: AG4, object: sectors, label: UNITED FEDERATION OF PLANETS, style: major }
    - { id: sb10, cell: AJ2, object: sectors, offset: [8, 0, 12], marker: triangle, label: Starbase 10 }
    - { id: achernar, cell: AN3, object: sectors, marker: diamond, label: Achernar }
    - { id: qualor, cell: AL6, object: sectors, marker: dot, label: Qualor, style: tiny, max_distance: 1300 }

sky:
  camera:
    view: horizon
    views:
      horizon: { target: [0, 15, 0], yaw: 180, tilt: 28, distance: 260 }
      zenith: { target: [0, 0, 0], tilt: 90, distance: 260 }
  objects:
    - type: grid
      id: sky
      shape: dome
      radius: 100
      pattern: both
      line_spacing_deg: 15
      major_col_interval: 6
      color: theme:colors.ui.tertiary
    - { type: ring, radius: 100, width: 3, color: theme:colors.ui.primary }
    - { type: path, sky: sun, object: sky, span: today, dash: [6, 4], color: var(--lcars-yellow) }
    - { type: path, sky: moon, object: sky, span: today, dash: [6, 4], color: var(--lcars-blue) }
  points:
    - { id: sun, sky: sun, object: sky, marker: reticle, label: SOL, below_horizon: dim }
    - { id: moon, sky: moon, object: sky, marker: moon_phase, label: LUNA }
    - { id: north, altaz: [0, 0], object: sky, label: "N", style: major, overlap: true }
    - { id: east, altaz: [90, 0], object: sky, label: E, style: major, overlap: true }
    - { id: south, altaz: [180, 0], object: sky, label: S, style: major, overlap: true }
    - { id: west, altaz: [270, 0], object: sky, label: W, style: major, overlap: true }
