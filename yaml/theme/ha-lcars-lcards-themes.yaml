      lcars-card-mid-left-color: var(--lcards-gray-medium-light)
      lcars-card-button: var(--lcards-gray-light)
      lcars-card-button-off: var(--lcards-gray-medium-light)
      lcars-card-button-unavailable: var(--lcards-gray-medium-dark)
      lcars-card-button-bar: var(--lcards-gray-medium-dark)
      lcars-card-bottom-color: var(--lcards-gray-medium-dark)
      lcars-card-background: var(--lcards-gray-medium-light)

      # Misc
