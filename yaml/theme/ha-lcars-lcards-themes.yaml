      # Card colors
      lcars-card-top-color: var(--lcards-gray-dark)
      lcars-card-mid-left-color: var(--lcards-gray)
      lcars-card-button: var(--lcards-gray-medium-light)
      lcars-card-button-off: var(--lcards-gray)
      lcars-card-button-unavailable: var(--lcards-gray-dark)
      lcars-card-button-bar: var(--lcards-gray-dark)
      lcars-card-bottom-color: var(--lcards-gray-dark)
      lcars-card-background: var(--lcards-gray)
      # Misc
      success-color: var(--lcards-green)
      warning-color: var(--lcards-orange)
      error-color: var(--lcards-dark-orange)


