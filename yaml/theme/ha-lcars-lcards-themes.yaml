      # Header colors
      lcars-ui-app-header-background-color: "var(lcars-ui-primary)"
      lcars-ui-app-header-text-color: var(--lcards-gray-lightest)
      lcars-ui-app-header-clock: var(--lcards-orange)
      lcars-ui-sidebar-icon: var(--lcars-ui-secondary)
      lcars-ui-config-button: var(--lcards-blue-lightest)
